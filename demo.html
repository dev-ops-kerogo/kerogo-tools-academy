bjectif || '',\n        reussie: !!(x && x[0]), score: x ? { meilleur: x[1], total: x[2] } : null, reussieLe: x && x[0] ? x[3] || '' : '' };\n    });\n    const faites = missions.filter(function (m) { return m.reussie; }).length;\n    return { num: n.num, titre: n.titre, badge: n.badge, missions: missions, faites: faites, complet: faites === missions.length };\n  });\n  const courant = niveaux.filter(function (n) { return !n.complet; })[0] || niveaux[niveaux.length - 1];\n  return partiePersoDepuis_(email, j, niveaux, courant, prochaineMission_(niveaux), etatQuiz_(resume));\n}\n\n/* Index adresse → numéro de ligne dans Joueurs, gardé en cache */\nlet INDEX_J_ = null;\nfunction indexJoueurs_(refaire) {\n  if (INDEX_J_ && !refaire) return INDEX_J_;\n  const cache = cache_();\n  if (!refaire) { const v = cache.get('INDEX_J'); if (v) return (INDEX_J_ = JSON.parse(v)); }\n  const sh = feuille_('Joueurs'), n = sh.getLastRow() - 1, index = {};\n  if (n > 0) sh.getRange(2, 1, n, 1).getValues().forEach(function (l, i) { if (l[0]) index[String(l[0]).toLowerCase()] = i + 2; });\n  try { cache.put('INDEX_J', JSON.stringify(index), 21600); } catch (e) { }\n  return (INDEX_J_ = index);\n}\nfunction lireLigneJoueur_(ligne) {\n  const entetes = ONGLETS.Joueurs, v = feuille_('Joueurs').getRange(ligne, 1, 1, entetes.length).getValues()[0];\n  const o = { _ligne: ligne };\n  entetes.forEach(function (h, k) { o[h] = v[k]; });\n  return o;\n}\n/* La ligne d'une personne, sans lire tout l'onglet */\nfunction ligneJoueur_(email) {\n  let ligne = indexJoueurs_()[email];\n  if (ligne) { const j = lireLigneJoueur_(ligne); if (String(j.Email).toLowerCase() === email) return j; }\n  ligne = indexJoueurs_(true)[email];\n  return ligne ? lireLigneJoueur_(ligne) : null;\n}\n\n/* Écritures de la personne pas encore consolidées : appliquées à son état (cache perdu entre-temps) */\nfunction appliquerEnAttente_(email, perso) {\n  const sh = feuille_('Écritures'), depuis = Number(PropertiesService.getScriptProperties().getProperty(cleCurseur_())) || 2, fin = sh.getLastRow();\n  if (fin < depuis) return;\n  sh.getRange(depuis, 1, fin - depuis + 1, 4).getValues().forEach(function (l) {\n    if (String(l[1]).toLowerCase() !== email) return;\n    let d = {};\n    try { d = JSON.parse(l[3] || '{}'); } catch (e) { return; }\n    if (l[2] === 'mission' && MISSIONS[d.id]) appliquerMissionPerso_(perso, d.id, Number(d.bonnes) || 0, Number(d.total) || 0, d.charte === true, l[0]);\n    else if (l[2] === 'site') { perso.joueur.site = d.site; if (d.cabinet) perso.joueur.cabinet = d.cabinet; }\n    else if (l[2] === 'theme') perso.joueur.theme = d.theme;\n    else if (l[2] === 'charte') appliquerCharte_(perso, d.version, l[0]);\n    else if (l[2] === 'quiz' && perso.quiz && perso.quiz.mois === d.mois) {\n      if (!perso.quiz.fait) perso.joueur.xp += (Number(d.score) || 0) * XP_QUIZ_PAR_BONNE;\n      perso.quiz.fait = true; perso.quiz.score = Math.max(Number(perso.quiz.score) || 0, Number(d.score) || 0);\n    }\n  });\n}\nfunction cleCurseur_() { return MODE_CHARGE_ ? 'CH_ECRITURES_SUIVANTE' : 'ECRITURES_SUIVANTE'; }\n\n/* Déclencheur toutes les 5 minutes : reporte les écritures, par lots de moins de 4 minutes */\nfunction consoliderEcritures() {\n  if (!versionActivee_()) return;\n  const debut = Date.now();\n  EN_LOT_ = true;\n  // Hors verrou : identifiants Slack des nouveaux venus (les appels Slack ne doivent pas bloquer les écritures)\n  const slackConnus = {};\n  try {\n    const shE = feuille_('Écritures'), depuis = Number(PropertiesService.getScriptProperties().getProperty(cleCurseur_())) || 2, finE = shE.getLastRow();\n    if (finE >= depuis && !MODE_CHARGE_) {\n      const sansSlack = {};\n      lignes_('Joueurs').forEach(function (j) { if (j['Slack ID']) sansSlack[String(j.Email).toLowerCase()] = false; });\n      shE.getRange(depuis, 2, Math.min(1000, finE - depuis + 1), 2).getValues().forEach(function (l) {\n        const e = String(l[0]).toLowerCase();\n        if ((l[1] === 'creation' || l[1] === 'visite') && sansSlack[e] !== false && Object.keys(slackConnus).length < 30 && !(e in slackConnus)) slackConnus[e] = infosSlack_(e);\n      });\n    }\n  } catch (e) { console.warn('Slack avant consolidation : ' + e.message); }\n  // Firestore (si activé) : fiches modifiées depuis le dernier passage, lues hors verrou ; Slack des nouveaux venus\n  let lectureFs = null, copieFs = null;\n  if (firestoreActif_() && !MODE_CHARGE_) {\n    try {\n      lectureFs = lireModifsFirestore_();\n      const inscrits = {};\n      lignes_('Joueurs').forEach(function (j) { inscrits[String(j.Email).toLowerCase()] = !!j['Slack ID']; });\n      lectureFs.fiches.forEach(function (x) {\n        if (!inscrits[x.email] && !(x.email in slackConnus) && Object.keys(slackConnus).length < 30) slackConnus[x.email] = infosSlack_(x.email);\n      });\n    } catch (e) { lectureFs = null; console.warn('Lecture Firestore : ' + e.message); }\n  }\n  const verrou = LockService.getScriptLock();\n  if (!verrou.tryLock(30000)) { noterDuree_('consoliderEcritures', debut, 'verrou occupé : au prochain passage'); return; }\n  let traitees = 0, touches = {}, aPreparer = [], nouveauxJoueurs = false;\n  try {\n    // Fiches Firestore modifiées : changées en lignes d'« Écritures », consolidées ci-dessous comme les autres\n    if (lectureFs) { try { copieFs = appliquerModifsFirestore_(lectureFs); } catch (e) { console.warn('Copie Firestore : ' + e.message); } }\n    const props = PropertiesService.getScriptProperties();\n    const sh = feuille_('Écritures');\n    let curseur = Number(props.getProperty(cleCurseur_())) || 2;\n    const fin = sh.getLastRow();\n    const migration = props.getProperty('RESUMES_VERSION') !== VERSION_CODE;\n    if (curseur > fin && !migration) return;\n\n    // Données en mémoire : une lecture par onglet\n    const J = tableau_('Joueurs'), P = tableau_('Progression');\n    const colJ = colonnes_('Joueurs'), colP = colonnes_('Progression');\n    const parEmail = {}, prog = {};\n    J.lignes.forEach(function (l, i) { if (l[colJ.Email]) parEmail[String(l[colJ.Email]).toLowerCase()] = i; });\n    P.lignes.forEach(function (l, i) { if (l[colP.Email]) prog[String(l[colP.Email]).toLowerCase() + '|' + String(l[colP.Mission])] = i; });\n    const journal = [], retours = [], vues = {}, accepteTest = MODE_CHARGE_ || chargeFs_();\n\n    const joueur = function (email, date, prenom) {\n      if (parEmail[email] === undefined) {\n        const l = ONGLETS.Joueurs.map(function () { return ''; });\n        l[colJ.Email] = email; l[colJ['Prénom']] = prenom || prenomDepuisEmail_(email); l[colJ.XP] = 0;\n        l[colJ['Inscrit le']] = date; l[colJ['Dernière visite']] = date; l[colJ['Thème']] = 'sombre'; l[colJ['Résumé']] = '{}';\n        parEmail[email] = J.lignes.push(l) - 1;\n      }\n      return J.lignes[parEmail[email]];\n    };\n    const ajouterProg = function (email, id, l) { prog[email + '|' + id] = P.lignes.push(l) - 1; return P.lignes[prog[email + '|' + id]]; };\n    const reussiesDe = function (email) {\n      return Object.keys(prog).filter(function (k) { return k.indexOf(email + '|') === 0 && P.lignes[prog[k]][colP.Statut] === 'Réussie'; })\n        .map(function (k) { return k.slice(email.length + 1); });\n    };\n\n    // Au plus 1 000 écritures par passage : le verrou reste court, la suite au passage suivant\n    while (curseur <= fin && traitees < 1000 && Date.now() - debut < LIMITE_LOT_MS - 60000) {\n      const n = Math.min(500, fin - curseur + 1);\n      const lot = sh.getRange(curseur, 1, n, 4).getValues();\n      lot.forEach(function (e) {\n        const date = e[0] instanceof Date ? e[0] : new Date(e[0]), email = String(e[1]).toLowerCase(), type = e[2];\n        let d = {};\n        try { d = JSON.parse(e[3] || '{}'); } catch (err) { return; }\n        if (!email || (estTest_(email) && !accepteTest)) return;\n        const j = joueur(email, date, d.prenom);\n        touches[email] = true;\n        const prenom = j[colJ['Prénom']], site = j[colJ.Site];\n        if (type === 'visite' || type === 'creation') {\n          j[colJ['Dernière visite']] = date;\n          const s = slackConnus[email];\n          if (!j[colJ['Slack ID']] && s) { j[colJ['Slack ID']] = s.id; if (s.prenom) j[colJ['Prénom']] = s.prenom; }\n        } else if (type === 'site' && d.site) {\n          if (!site) journal.push([date, email, prenom, d.site, \"a rejoint l'Académie\", 0]);\n          j[colJ.Site] = d.site;\n          if (d.cabinet) j[colJ.Cabinet] = d.cabinet;\n        } else if (type === 'charte' && d.version) {\n          const premiere = !j[colJ['Charte validée le']];\n          j[colJ['Charte validée le']] = date;\n          j[colJ['Charte version']] = \"'\" + d.version;\n          journal.push([date, email, prenom, site, \"a validé la charte d'usage de l'IA (version \" + d.version + ')', 0]);\n          // Niveau 1 déjà terminé : le badge Découvreur arrive avec la signature\n          const n1 = NIVEAUX[0], faites = reussiesDe(email);\n          if (premiere && n1.missions.every(function (x) { return faites.indexOf(x) !== -1; })) {\n            journal.push([date, email, prenom, site, 'a décroché le badge ' + n1.badge, XP_BADGE]);\n            j[colJ.XP] = (Number(j[colJ.XP]) || 0) + XP_BADGE;\n          }\n        } else if (type === 'theme') {\n          j[colJ['Thème']] = d.theme === 'jour' ? 'jour' : 'sombre';\n        } else if (type === 'retour') {\n          retours.push([date, email, site, \"'\" + d.mission, d.utile, d.usage]);\n        } else if (type === 'mission' && MISSIONS[d.id]) {\n          if (d.cle && vues[d.cle]) return;\n          if (d.cle) vues[d.cle] = true;\n          const m = MISSIONS[d.id], bonnes = Number(d.bonnes) || 0;\n          const reussie = bonnes >= m.seuil;\n          const k = prog[email + '|' + d.id];\n          const p = k === undefined ? null : P.lignes[k];\n          const deja = !!p && p[colP.Statut] === 'Réussie';\n          if (p) {\n            p[colP.Tentatives] = (Number(p[colP.Tentatives]) || 0) + 1;\n            if (bonnes > (Number(p[colP['Meilleur score']]) || 0)) p[colP['Meilleur score']] = bonnes;\n            if (reussie && !deja) { p[colP.Statut] = 'Réussie'; p[colP['Réussie le']] = date; }\n          } else {\n            ajouterProg(email, d.id, [email, d.id, reussie ? 'Réussie' : 'En cours', bonnes, m.total, 1, reussie ? date : '']);\n          }\n          if (d.avis && d.avis.utile) retours.push([date, email, site, \"'\" + d.id, d.avis.utile, d.avis.usage || '']);\n          if (reussie && !deja) {\n            let xp = XP_MISSION;\n            journal.push([date, email, prenom, site, 'a validé la mission ' + d.id, XP_MISSION]);\n            const niveau = NIVEAUX.filter(function (x) { return x.missions.indexOf(d.id) !== -1; })[0];\n            const faites = reussiesDe(email);\n            if (niveau.missions.every(function (x) { return faites.indexOf(x) !== -1; }) && (niveau.num !== 1 || j[colJ['Charte validée le']])) {\n              xp += XP_BADGE;\n              journal.push([date, email, prenom, site, 'a décroché le badge ' + niveau.badge, XP_BADGE]);\n            }\n            j[colJ.XP] = (Number(j[colJ.XP]) || 0) + xp;\n          }\n        } else if (type === 'quiz' && d.mois) {\n          const id = 'Q-' + d.mois, k = prog[email + '|' + id], score = Number(d.score) || 0;\n          if (k !== undefined) {\n            const p = P.lignes[k];\n            p[colP.Tentatives] = (Number(p[colP.Tentatives]) || 0) + 1;\n            if (score > (Number(p[colP['Meilleur score']]) || 0)) p[colP['Meilleur score']] = score;\n          } else {\n            ajouterProg(email, id, [email, id, 'Réussie', score, Number(d.nb) || 0, 1, date]);\n            const xp = score * XP_QUIZ_PAR_BONNE;\n            journal.push([date, email, prenom, site, 'a fait le quiz du mois (' + score + '/' + d.nb + ')', xp]);\n            if (xp) j[colJ.XP] = (Number(j[colJ.XP]) || 0) + xp;\n            if (!MODE_CHARGE_) {\n              const stats = JSON.parse(props.getProperty('QUIZ_STATS_' + d.mois) || '[]');\n              (d.justes || []).forEach(function (ok, i) { stats[i] = stats[i] || { ok: 0, ko: 0 }; if (ok) stats[i].ok++; else stats[i].ko++; });\n              props.setProperty('QUIZ_STATS_' + d.mois, JSON.stringify(stats));\n            }\n          }\n        }\n      });\n      sh.getRange(curseur, 5, n, 1).setValues(lot.map(function () { return [new Date()]; }));\n      curseur += n; traitees += n;\n    }\n\n    // Résumé de chaque collaborateur (tous lors d'une nouvelle version, sinon ceux qui ont bougé), documents compris\n    const resumes = {}, docs = {};\n    invalider_('Documents');\n    lignes_('Documents').forEach(function (d) {\n      const e = String(d.Email).toLowerCase();\n      (docs[e] = docs[e] || []).push({ type: d.Document, version: String(d.Version), date: dateIso_(d['Lu le'] || d.Date), pret: !!d.Fichier });\n    });\n    P.lignes.forEach(function (l) {\n      const e = String(l[colP.Email]).toLowerCase();\n      if (!e || (!migration && !touches[e])) return;\n      (resumes[e] = resumes[e] || {})[String(l[colP.Mission])] = [l[colP.Statut] === 'Réussie' ? 1 : 0, Number(l[colP['Meilleur score']]) || 0, Number(l[colP.Total]) || 0, dateIso_(l[colP['Réussie le']])];\n    });\n    J.lignes.forEach(function (l) {\n      const e = String(l[colJ.Email]).toLowerCase();\n      if (e && (migration || touches[e])) { const r = resumes[e] || {}; if (docs[e]) r._docs = docs[e]; l[colJ['Résumé']] = JSON.stringify(r); }\n    });\n\n    // Écriture : une seule plage par onglet\n    ecrireTableau_('Joueurs', J, 'Charte version');\n    ecrireTableau_('Progression', P, 'Mission');\n    ajouterLignes_('Journal', journal);\n    ajouterLignes_('Retours', retours);\n    SpreadsheetApp.flush();\n    props.setProperty(cleCurseur_(), String(curseur));\n    if (migration) props.setProperty('RESUMES_VERSION', VERSION_CODE);\n    ['Joueurs', 'Progression', 'Journal', 'Retours'].forEach(invalider_);\n    nouveauxJoueurs = J.lignes.length !== J.avant;\n    if (nouveauxJoueurs) indexJoueurs_(true);\n    J.lignes.forEach(function (l, i) { const e = String(l[colJ.Email]).toLowerCase(); if (e && touches[e]) aPreparer.push([e, i + 2, l.slice()]); });\n    if (journal.length) viderPartages_();\n  } finally {\n    verrou.releaseLock();\n  }\n  // Hors verrou : classement, rapprochements et état de chaque personne concernée (consolidé + écritures arrivées entre-temps)\n  if (Object.keys(touches).length) {\n    partages_();\n    if (nouveauxJoueurs) viderRapprochements_();\n    let lotCache = {};\n    aPreparer.forEach(function (x) {\n      const j = { _ligne: x[1] };\n      ONGLETS.Joueurs.forEach(function (h, k) { j[h] = x[2][k]; });\n      const perso = persoDepuisJoueur_(x[0], j);\n      appliquerEnAttente_(x[0], perso);\n      lotCache[clePerso_(x[0])] = JSON.stringify(perso);\n      if (Object.keys(lotCache).length >= 50) { cache_().putAll(lotCache, DUREE_PERSO); lotCache = {}; }\n    });\n    if (Object.keys(lotCache).length) cache_().putAll(lotCache, DUREE_PERSO);\n  }\n  // Firestore : documents et rôles recopiés dans les fiches, classement republié s'il a changé\n  if (firestoreActif_()) {\n    try { if (copieFs && copieFs.fiches) pousserDocumentsFs_(Object.keys(copieFs.documents), copieFs.documents); } catch (e) { console.warn('Documents Firestore : ' + e.message); }\n    try { if (nouveauxJoueurs) pousserRolesFs_(); } catch (e) { console.warn('Rôles Firestore : ' + e.message); }\n    try { if (Object.keys(touches).length) publierPublics_(['parcours', 'classement']); } catch (e) { console.warn('Publication Firestore : ' + e.message); }\n  }\n  noterOpsFs_();\n  noterDuree_('consoliderEcritures', debut, traitees + ' écriture(s), ' + Object.keys(touches).length + ' collaborateur(s)' + (copieFs ? ', ' + copieFs.fiches + ' fiche(s) Firestore copiée(s)' : ''));\n}\n\n/* ------------------------------------------------------------------ */\n/* Firestore (bascule) : RIEN ne se passe tant que la propriété         */\n/* FIRESTORE_ACTIF ne vaut pas « oui ». Apps Script y accède avec le    */\n/* compte de Katia (API REST, droits IAM) : les règles d'accès de la    */\n/* page ne s'appliquent pas ici. Propriétés : FIRESTORE_PROJET,         */\n/* FIRESTORE_URL (émulateur, tests), COUTS_CONSO (estimation, coûts    */\n/* unitaires étalonnés au test de charge). Cloud Monitoring exige la    */\n/* facturation : MESURE_MONITORING = oui (offre Blaze seulement),       */\n/* MONITORING_URL (tests), COEF_CONSO.                                  */\n/* ------------------------------------------------------------------ */\nconst QUOTAS_FIRESTORE = { lectures: 50000, ecritures: 20000, suppressions: 20000 };   // offre Spark, par jour\nconst COUTS_CONSO_DEFAUT = { lecturesActif: 11, ecrituresActif: 5, lecturesNouveau: 30, ecrituresNouveau: 12, lecturesFixes: 300, ecrituresFixes: 200 };\nconst SEUILS_ALERTE_CONSO = [90, 70];\n\nfunction firestoreActif_() { return PropertiesService.getScriptProperties().getProperty('FIRESTORE_ACTIF') === 'oui'; }\nfunction projetFirestore_() { return PropertiesService.getScriptProperties().getProperty('FIRESTORE_PROJET') || 'kerogo-tools-academy'; }\nfunction baseFirestore_() {\n  return PropertiesService.getScriptProperties().getProperty('FIRESTORE_URL')\n    || 'https://firestore.googleapis.com/v1/projects/' + projetFirestore_() + '/databases/(default)/documents';\n}\n/* Nom complet d'un document (projects/…/documents/collaborateurs/x), utilisé dans les écritures groupées */\nfunction nomDocFs_(chemin) { return baseFirestore_().replace(/^https?:\\/\\/[^\\/]+\\/v1\\//, '') + '/' + chemin; }\nfunction urlDocFs_(chemin) { return baseFirestore_() + '/' + chemin.split('/').map(encodeURIComponent).join('/'); }\n\nfunction fsHttp_(methode, url, corps) {\n  const options = { method: methode, contentType: 'application/json; charset=utf-8', muteHttpExceptions: true,\n    headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() } };\n  if (corps !== undefined) options.payload = JSON.stringify(corps);\n  const r = UrlFetchApp.fetch(url, options), code = r.getResponseCode(), texte = r.getContentText();\n  if (code === 404) return null;\n  if (code >= 300) {\n    let m = texte;\n    try { m = JSON.parse(texte).error.message; } catch (e) { }\n    throw new Error('Firestore ' + code + ' : ' + String(m).slice(0, 200));\n  }\n  return texte ? JSON.parse(texte) : {};\n}\n\n/* Conversion JS ↔ valeurs Firestore. Les dates lues reviennent en texte ISO (horodatage d'origine). */\nfunction versFs_(v) {\n  if (v === null || v === undefined) return { nullValue: null };\n  if (v instanceof Date) return { timestampValue: v.toISOString() };\n  if (Array.isArray(v)) return { arrayValue: { values: v.map(versFs_) } };\n  if (typeof v === 'boolean') return { booleanValue: v };\n  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };\n  if (typeof v === 'object') return { mapValue: { fields: champsFs_(v) } };\n  return { stringValue: String(v) };\n}\nfunction champsFs_(o) {\n  const f = {};\n  Object.keys(o).forEach(function (k) { if (o[k] !== undefined) f[k] = versFs_(o[k]); });\n  return f;\n}\nfunction depuisFs_(v) {\n  if (!v) return null;\n  if ('stringValue' in v) return v.stringValue;\n  if ('integerValue' in v) return Number(v.integerValue);\n  if ('doubleValue' in v) return Number(v.doubleValue);\n  if ('booleanValue' in v) return v.booleanValue;\n  if ('timestampValue' in v) return v.timestampValue;\n  if ('mapValue' in v) return objetFs_(v.mapValue.fields || {});\n  if ('arrayValue' in v) return (v.arrayValue.values || []).map(depuisFs_);\n  return null;\n}\nfunction objetFs_(fields) {\n  const o = {};\n  Object.keys(fields || {}).forEach(function (k) { o[k] = depuisFs_(fields[k]); });\n  return o;\n}\n/* Chemin de champ pour updateMask : `1.1` ou `2026-11` doivent être entre accents graves */\nfunction cheminChampFs_(segments) {\n  return [].concat(segments).map(function (s) { return /^[a-zA-Z_][a-zA-Z_0-9]*$/.test(s) ? s : '`' + String(s).replace(/`/g, '\\\\`') + '`'; }).join('.');\n}\n\nfunction fsLire_(chemin) {\n  OPS_FS_.lectures++;\n  const d = fsHttp_('get', urlDocFs_(chemin));\n  return d ? objetFs_(d.fields || {}) : null;\n}\n/* champs : liste de chemins (tableaux de segments) à mettre à jour ; sans champs, le document est remplacé.\n   existe : n'écrit que si le document existe déjà (renvoie null sinon). */\nfunction fsEcrire_(chemin, objet, champs, existe) {\n  const params = (champs || []).map(function (c) { return 'updateMask.fieldPaths=' + encodeURIComponent(cheminChampFs_(c)); });\n  if (existe) params.push('currentDocument.exists=true');\n  OPS_FS_.ecritures++;\n  return fsHttp_('patch', urlDocFs_(chemin) + (params.length ? '?' + params.join('&') : ''), { fields: champsFs_(objet) });\n}\nfunction fsCommit_(ecritures) {\n  ecritures.forEach(function (w) { if (w.delete) OPS_FS_.suppressions++; else OPS_FS_.ecritures++; });\n  return fsHttp_('post', baseFirestore_() + ':commit', { writes: ecritures });\n}\nfunction fsRequete_(requete) {\n  const r = fsHttp_('post', baseFirestore_() + ':runQuery', { structuredQuery: requete }) || [];\n  OPS_FS_.lectures += Math.max(1, r.filter(function (x) { return x.document; }).length);   // une requête sans résultat coûte une lecture\n  return r;\n}\n\n/* ---------- Test de charge Firestore (projet kerogo-tools-academy-test et copie du projet Apps Script seulement) ---------- */\n/* Les adresses …@charge.test ne sont recopiées dans le tableur que si les trois conditions sont réunies :\n   propriété CHARGE_FIRESTORE = oui, projet Firestore dont le nom finit par « -test », tableur = copie (SHEET_ID = TABLEUR_CHARGE). */\nconst OPS_FS_ = { lectures: 0, ecritures: 0, suppressions: 0 };   // opérations Firestore d'Apps Script, comptées exactement\nfunction chargeFs_() {\n  const p = PropertiesService.getScriptProperties();\n  return p.getProperty('CHARGE_FIRESTORE') === 'oui' && /-test$/.test(projetFirestore_())\n    && !!p.getProperty('TABLEUR_CHARGE') && p.getProperty('SHEET_ID') === p.getProperty('TABLEUR_CHARGE');\n}\nfunction noterOpsFs_() {\n  if (!OPS_FS_.lectures && !OPS_FS_.ecritures && !OPS_FS_.suppressions) return;\n  if (chargeFs_()) {\n    const p = PropertiesService.getScriptProperties(), t = JSON.parse(p.getProperty('FS_OPS') || '{\"lectures\":0,\"ecritures\":0,\"suppressions\":0}');\n    ['lectures', 'ecritures', 'suppressions'].forEach(function (k) { t[k] += OPS_FS_[k]; });\n    p.setProperty('FS_OPS', JSON.stringify(t));\n  }\n  OPS_FS_.lectures = OPS_FS_.ecritures = OPS_FS_.suppressions = 0;\n}\n/* Ce que la copie vers le tableur a écrit pour un lot : [adresse, site, cabinet, version de charte] et [adresse, mission, statut, tentatives, meilleur] */\nfunction bilanCopieFs(lot) {\n  if (!MODE_CHARGE_ || !chargeFs_()) throw new Error('Action réservée au test de charge Firestore.');\n  const du = function (e) { return String(e).toLowerCase().indexOf(String(lot) + '-') === 0; };\n  return {\n    curseur: PropertiesService.getScriptProperties().getProperty('FS_CURSEUR') || '',\n    joueurs: lignes_('Joueurs').filter(function (j) { return du(j.Email); }).map(function (j) { return [String(j.Email).toLowerCase(), j.Site, cabinetActuel_(j.Cabinet), String(j['Charte version'] || '').replace(/^'/, ''), Number(j.XP) || 0]; }),\n    progression: lignes_('Progression').filter(function (p) { return du(p.Email); }).map(function (p) { return [String(p.Email).toLowerCase(), String(p.Mission), p.Statut, Number(p.Tentatives) || 0, Number(p['Meilleur score']) || 0]; }),\n    retours: lignes_('Retours').filter(function (x) { return du(x.Email); }).length,\n    accuses: lignes_('Documents').filter(function (x) { return du(x.Email) && x.Document === 'accuse'; }).length\n  };\n}\n/* Opérations exactes d'Apps Script (remises à zéro si demandé), et mesure Cloud Monitoring si elle est active (offre Blaze) */\nfunction mesureConsoFs(debutIso, finIso, remettre) {\n  if (!MODE_CHARGE_ || !chargeFs_()) throw new Error('Action réservée au test de charge Firestore.');\n  const p = PropertiesService.getScriptProperties();\n  const r = { serveur: JSON.parse(p.getProperty('FS_OPS') || '{\"lectures\":0,\"ecritures\":0,\"suppressions\":0}') };\n  if (mesureMonitoringActive_()) { try { r.monitoring = mesureMonitoring_(new Date(debutIso), new Date(finIso)); } catch (e) { r.monitoring = null; r.erreurMonitoring = String(e.message).slice(0, 150); } }\n  if (remettre) p.deleteProperty('FS_OPS');\n  return r;\n}\n/* À lancer depuis l'éditeur de la copie : n'installe que la copie vers le tableur (toutes les 5 minutes) */\nfunction installerCopieFirestore() {\n  if (!chargeFs_()) throw new Error('Réservé à la copie du projet branchée sur kerogo-tools-academy-test (CHARGE_FIRESTORE, FIRESTORE_PROJET, SHEET_ID = TABLEUR_CHARGE).');\n  PropertiesService.getScriptProperties().setProperty('ECRITURES_ACTIVES', 'oui');\n  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });\n  ScriptApp.newTrigger('consoliderEcritures').timeBased().everyMinutes(5).create();\n  console.log('Copie vers le tableur installée (toutes les 5 minutes), aucun autre déclencheur.');\n}\n\n/* À lancer depuis l'éditeur (accepte aussi les autorisations) : publie les documents communs et vérifie l'accès à Firestore et à Cloud Monitoring */\nfunction verifierFirestore() {\n  if (!firestoreActif_()) throw new Error('Propriété FIRESTORE_ACTIF absente ou différente de « oui ».');\n  console.log('Projet Firestore : ' + projetFirestore_());\n  const publies = publierPublics_();\n  console.log('Documents communs publiés : ' + (publies.join(', ') || 'aucun (déjà à jour)'));\n  const v = fsLire_('public/version');\n  console.log('public/version : ' + JSON.stringify(v));\n  if (mesureMonitoringActive_()) {\n    try { const m = mesureMonitoring_(new Date(Date.now() - 3600000), new Date()); console.log('Cloud Monitoring (dernière heure) : ' + JSON.stringify(m)); }\n    catch (e) { console.warn('Cloud Monitoring inaccessible : ' + e.message); }\n  } else console.log('Compteur de consommation : estimation (Cloud Monitoring exige la facturation, absente de l’offre Spark).');\n  noterOpsFs_();\n  return { publies: publies, version: v };\n}\n\nfunction empreinte_(texte) {\n  return Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, texte, Utilities.Charset.UTF_8)\n    .map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join('');\n}\n\n/* ---------- Documents communs publics/* (lus par toute personne connectée) ---------- */\n\nfunction parcoursPublic_() {\n  const props = PropertiesService.getScriptProperties();\n  const ordre = [].concat.apply([], NIVEAUX.map(function (n) { return n.missions; })), ouv = ouvertures_();\n  const regles = { missions: {}, sites: sites_(), cabinets: CONFIG.CABINETS, charteVersion: props.getProperty('CHARTE_VERSION') || '' };\n  const mois = moisCourant_(), nbQuiz = questionsQuiz_(mois).length;\n  const page = {\n    nom: CONFIG.NOM, signature: CONFIG.SIGNATURE,\n    niveaux: NIVEAUX.map(function (n) { return { num: n.num, titre: n.titre, badge: n.badge, missions: n.missions }; }),\n    missions: {},\n    quiz: nbQuiz ? { mois: mois, libelle: libelleMois_(mois), nb: nbQuiz, xpMax: nbQuiz * XP_QUIZ_PAR_BONNE } : null,\n    videos: videos_(), sites: sites_(), cabinets: CONFIG.CABINETS, implantations: CONFIG.IMPLANTATIONS, liens: { catalogue: CONFIG.LIEN_CATALOGUE },\n    charteEnVigueur: { version: props.getProperty('CHARTE_VERSION') || '', mots: Number(props.getProperty('CHARTE_MOTS')) || 0 },\n    xp: { mission: XP_MISSION, badge: XP_BADGE, quiz: XP_QUIZ_PAR_BONNE, live: XP_LIVE }\n  };\n  ordre.forEach(function (id, i) {\n    const m = MISSIONS[id], date = ouv[String(niveauDe_(id))] || '';\n    regles.missions[id] = { seuil: m.seuil, total: m.total, dispo: !!m.dispo, ouvre: date ? new Date(date + 'T00:00:00') : new Date(0), precedente: i ? ordre[i - 1] : '' };\n    page.missions[id] = { titre: m.titre, minutes: m.minutes, seuil: m.seuil || 0, total: m.total, objectif: m.objectif || '', dispo: !!m.dispo, ouvre: date };\n  });\n  return { regles: regles, page: page };\n}\nfunction classementPublic_() {\n  const c = partages_();\n  return { page: { ligue: c.ligue, semaine: c.semaine, aLaUne: c.aLaUne, kerogoat: c.kerogoat, finSemaine: c.finSemaine } };\n}\nfunction chartePublique_() {\n  const connu = lireGrand_(cache_(), 'CHARTE_' + idCharte_());\n  return { page: connu ? JSON.parse(connu) : lireCharte_() };\n}\nfunction cataloguePublic_() {\n  const cache = cache_(), frais = lireGrand_(cache, 'CATALOGUE') || lireGrand_(cache, 'CATALOGUE_SECOURS');\n  const c = frais ? JSON.parse(frais) : preparerCatalogue_();\n  return { page: { outils: c.outils, cabinets: c.cabinets } };   // sans la date de préparation : republié seulement si le contenu change\n}\n/* Le programme, sans les invités ni les liens Meet */\nfunction webinairesPublics_() {\n  return { page: { webinaires: webinairesCommuns_().map(function (w) {\n    return { id: w.id, titre: w.titre, debut: w.debut, fin: w.fin, duree: w.duree, description: w.description, inscrits: w.invites.length };\n  }) } };\n}\n\n/* Publie dans Firestore les documents communs qui ont changé (empreinte gardée dans les propriétés : aucune lecture) */\nfunction publierPublics_(quoi) {\n  if (!firestoreActif_()) return [];\n  const props = PropertiesService.getScriptProperties();\n  const sources = { parcours: parcoursPublic_, classement: classementPublic_, charte: chartePublique_, catalogue: cataloguePublic_, webinaires: webinairesPublics_ };\n  const versions = JSON.parse(props.getProperty('FS_VERSIONS') || '{}'), publies = [];\n  (quoi || Object.keys(sources)).forEach(function (nom) {\n    let contenu;\n    try { contenu = sources[nom](); } catch (e) { console.warn('Publication Firestore de ' + nom + ' : ' + e.message); return; }\n    const json = JSON.stringify(contenu.page);\n    const emp = empreinte_(json + JSON.stringify(contenu.regles || {}));\n    if (props.getProperty('FS_EMPREINTE_' + nom) === emp) return;\n    const doc = { json: json, publieLe: new Date() };\n    Object.keys(contenu.regles || {}).forEach(function (k) { doc[k] = contenu.regles[k]; });\n    fsEcrire_('public/' + nom, doc);\n    props.setProperty('FS_EMPREINTE_' + nom, emp);\n    versions[nom] = new Date().toISOString();\n    publies.push(nom);\n  });\n  if (publies.length) {\n    fsEcrire_('public/version', versions);\n    props.setProperty('FS_VERSIONS', JSON.stringify(versions));\n  }\n  return publies;\n}\n\n/* ---------- Copie vers le tableur : seulement les fiches modifiées ---------- */\n\n/* Hors verrou : les fiches dont « maj » est postérieure au curseur, triées (au plus 3 pages de 300) */\nfunction lireModifsFirestore_() {\n  const props = PropertiesService.getScriptProperties(), curseurLu = props.getProperty('FS_CURSEUR') || '';\n  const fiches = [];\n  let c = curseurLu ? JSON.parse(curseurLu) : null;\n  for (let page = 0; page < 3; page++) {\n    const q = { from: [{ collectionId: 'collaborateurs' }], orderBy: [{ field: { fieldPath: 'maj' }, direction: 'ASCENDING' }, { field: { fieldPath: '__name__' }, direction: 'ASCENDING' }], limit: 300 };\n    if (c && c.nom) q.startAt = { values: [{ timestampValue: c.maj }, { referenceValue: c.nom }], before: false };\n    else if (c) q.where = { fieldFilter: { field: { fieldPath: 'maj' }, op: 'GREATER_THAN', value: { timestampValue: c.maj } } };\n    const res = fsRequete_(q).filter(function (x) { return x.document; });\n    res.forEach(function (x) {\n      const nom = x.document.name, email = decodeURIComponent(nom.split('/').pop()).toLowerCase();\n      fiches.push({ email: email, nom: nom, f: objetFs_(x.document.fields || {}) });\n    });\n    if (res.length) { const d = fiches[fiches.length - 1]; c = { maj: d.f.maj, nom: d.nom }; }\n    if (res.length < 300) break;\n  }\n  return { curseurLu: curseurLu, curseur: c ? JSON.stringify(c) : curseurLu, fiches: fiches };\n}\n\n/* Sous verrou : chaque changement de fiche devient une ligne d'« Écritures », consolidée juste après comme aujourd'hui.\n   Les accusés et certifications sont ajoutés à « Documents ». Renvoie les documents connus de chaque fiche (pour la mise à jour). */\nfunction appliquerModifsFirestore_(lecture) {\n  const props = PropertiesService.getScriptProperties();\n  if ((props.getProperty('FS_CURSEUR') || '') !== lecture.curseurLu) return null;   // un autre passage les a déjà copiées\n  if (!lecture.fiches.length) return { fiches: 0, lignes: 0, documents: {} };\n  const J = {}, P = {}, D = {};\n  lignes_('Joueurs').forEach(function (j) { J[String(j.Email).toLowerCase()] = j; });\n  lignes_('Progression').forEach(function (p) {\n    const e = String(p.Email).toLowerCase();\n    (P[e] = P[e] || {})[String(p.Mission)] = { reussie: p.Statut === 'Réussie', meilleur: Number(p['Meilleur score']) || 0, tentatives: Number(p.Tentatives) || 0 };\n  });\n  invalider_('Documents');\n  lignes_('Documents').forEach(function (d) { const e = String(d.Email).toLowerCase(); (D[e] = D[e] || []).push(d.Document + '|' + String(d.Version)); });\n  const enVigueur = props.getProperty('CHARTE_VERSION') || '';\n  const ordre = [].concat.apply([], NIVEAUX.map(function (n) { return n.missions; }));\n  const ecritures = [], documents = [], connus = {};\n  const date = function (iso, secours) { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d : secours; };\n  lecture.fiches.forEach(function (x) {\n    const email = x.email, f = x.f, j = J[email] || null, prog = P[email] || {}, docs = D[email] || [];\n    if (!email || (estTest_(email) && !chargeFs_())) return;\n    const maj = date(f.maj, new Date()), ajouter = function (d, type, donnees) { ecritures.push([d, email, type, JSON.stringify(donnees)]); };\n    connus[email] = JSON.stringify(f.documents || []);\n    if (!j) ajouter(date(f.inscritLe, maj), 'creation', { prenom: f.prenom || '' });\n    if (f.site && (f.site !== (j ? j.Site : '') || (f.cabinet || '') !== (j ? String(j.Cabinet || '') : ''))) ajouter(maj, 'site', { site: f.site, cabinet: f.cabinet || '' });\n    if (f.theme && f.theme !== (j ? j['Thème'] || 'sombre' : 'sombre')) ajouter(maj, 'theme', { theme: f.theme });\n    if (f.charte && f.charte.version && f.charte.version !== String(j ? j['Charte version'] : '').replace(/^'/, '')) {\n      const dc = date(f.charte.le, maj);\n      ajouter(dc, 'charte', { version: f.charte.version });\n      if (docs.indexOf('accuse|' + f.charte.version) === -1) { documents.push([dc, email, 'accuse', \"'\" + f.charte.version, dc, '', '']); docs.push('accuse|' + f.charte.version); }\n    }\n    ordre.forEach(function (id) {\n      const n = (f.missions || {})[id];\n      if (!n) return;\n      const p = prog[id] || { reussie: false, meilleur: 0, tentatives: 0 };\n      const nouvelle = !!n.reussie && !p.reussie, mieux = (Number(n.meilleur) || 0) > p.meilleur;\n      const delta = (Number(n.tentatives) || 0) - p.tentatives;\n      if (delta <= 0 && !nouvelle && !mieux) return;\n      const k = Math.max(1, Math.min(delta, 20));\n      ajouter(nouvelle ? date(n.le, maj) : maj, 'mission', { id: id, bonnes: Number(n.meilleur) || 0, total: Number(n.total) || 0, charte: false,\n        avis: nouvelle ? ((f.avis || {})[id] || null) : null, cle: 'fs|' + email + '|' + id + '|' + n.tentatives });   // clé propre à la personne : la consolidation écarte les clés déjà vues\n      for (let i = 1; i < k; i++) ajouter(maj, 'mission', { id: id, bonnes: 0, total: Number(n.total) || 0, charte: false, avis: null, cle: 'fs|' + email + '|' + id + '|' + n.tentatives + '|' + i });\n    });\n    // Niveau 1 terminé avec la charte en vigueur signée : certification (une seule)\n    const n1 = NIVEAUX[0].missions.every(function (id) { return (f.missions || {})[id] && f.missions[id].reussie; });\n    if (n1 && enVigueur && f.charte && f.charte.version === enVigueur && !docs.some(function (d) { return d.indexOf('certification|') === 0; })) {\n      documents.push([maj, email, 'certification', \"'\" + enVigueur, maj, '', '', '']);\n    }\n    if (j && f.derniereVisite && date(f.derniereVisite, null) > new Date(j['Dernière visite'] || 0)) ajouter(date(f.derniereVisite, maj), 'visite', {});\n  });\n  ecritures.sort(function (a, b) { return a[0] - b[0]; });\n  if (documents.length) ajouterLignes_('Documents', documents);\n  if (ecritures.length) ajouterLignes_('Écritures', ecritures.map(function (l) { return l.concat(['']); }));\n  SpreadsheetApp.flush();\n  props.setProperty('FS_CURSEUR', lecture.curseur);\n  ['Écritures', 'Documents'].forEach(invalider_);\n  return { fiches: lecture.fiches.length, lignes: ecritures.length, documents: connus, nouveauxDocs: documents.length };\n}\n\n/* Hors verrou, après la consolidation : documents (accusés, certifications) recopiés dans les fiches qui en ont de nouveaux */\nfunction pousserDocumentsFs_(emails, connus) {\n  if (!firestoreActif_() || !emails.length) return 0;\n  invalider_('Documents');\n  const docs = {};\n  lignes_('Documents').forEach(function (d) {\n    const e = String(d.Email).toLowerCase();\n    if (emails.indexOf(e) === -1) return;\n    (docs[e] = docs[e] || []).push({ type: d.Document, version: String(d.Version), date: dateIso_(d['Lu le'] || d.Date), pret: !!d.Fichier });\n  });\n  let n = 0;\n  emails.forEach(function (e) {\n    const liste = docs[e] || [];\n    if (connus && connus[e] === JSON.stringify(liste)) return;\n    if (!liste.length && connus) return;\n    try { if (fsEcrire_('collaborateurs/' + e, { documents: liste }, [['documents']], true)) n++; }\n    catch (x) { console.warn('Documents non recopiés dans Firestore pour ' + e + ' : ' + x.message); }\n  });\n  return n;\n}\n\n/* Rôles (administrateur, manager) recopiés dans les fiches : seulement les changements (gardés dans FS_ROLES) */\nfunction pousserRolesFs_() {\n  if (!firestoreActif_()) return 0;\n  const props = PropertiesService.getScriptProperties(), avant = JSON.parse(props.getProperty('FS_ROLES') || '{}'), apres = {};\n  const managers = managers_();\n  lignes_('Joueurs').forEach(function (j) {\n    const e = String(j.Email || '').toLowerCase();\n    if (!e || estTest_(e)) return;\n    const a = estAdmin_(e), m = a || !!managers[e] || estManagerOrg_(e);\n    if (a || m) apres[e] = (a ? 'a' : '') + (m ? 'm' : '');\n  });\n  let n = 0;\n  const garde = {};\n  Object.keys(avant).forEach(function (e) { garde[e] = avant[e]; });\n  Object.keys(Object.assign({}, avant, apres)).forEach(function (e) {\n    if ((avant[e] || '') === (apres[e] || '') || n >= 200) return;\n    try {\n      if (fsEcrire_('collaborateurs/' + e, { roles: { admin: /a/.test(apres[e] || ''), manager: /m/.test(apres[e] || '') } }, [['roles']], true)) {\n        n++;\n        if (apres[e]) garde[e] = apres[e]; else delete garde[e];\n      }\n    } catch (x) { console.warn('Rôle non recopié pour ' + e + ' : ' + x.message); }\n  });\n  props.setProperty('FS_ROLES', JSON.stringify(garde));\n  return n;\n}\n\n/* XP des webinaires suivis : ajoutés au champ bonus (seulement si la fiche existe) */\nfunction ajouterBonusFs_(email, xp) {\n  if (!firestoreActif_() || estTest_(email)) return;\n  try {\n    fsCommit_([{ transform: { document: nomDocFs_('collaborateurs/' + email), fieldTransforms: [{ fieldPath: 'bonus', increment: { integerValue: String(xp) } }] },\n      currentDocument: { exists: true } }]);\n  } catch (e) { console.warn('Bonus non recopié dans Firestore pour ' + email + ' : ' + e.message); }\n}\n\n/* Note du quiz du mois (corrigé par le serveur) : la meilleure note est gardée */\nfunction noterQuizFs_(email, mois, score, nb) {\n  if (!firestoreActif_() || estTest_(email)) return;\n  try {\n    const f = fsLire_('collaborateurs/' + email);\n    if (!f) return;\n    const avant = (f.quiz || {})[mois];\n    const quiz = {};\n    quiz[mois] = { score: Math.max(score, avant ? Number(avant.score) || 0 : 0), nb: nb, le: avant && avant.le ? new Date(avant.le) : new Date() };\n    fsEcrire_('collaborateurs/' + email, { quiz: quiz }, [['quiz', mois]], true);\n  } catch (e) { console.warn('Quiz non recopié dans Firestore pour ' + email + ' : ' + e.message); }\n}\n\n/* Inscriptions aux webinaires faites depuis la page : portées dans « Écritures » (circuit Slack actuel), puis effacées */\nfunction importerInscriptionsFs_() {\n  if (!firestoreActif_()) return 0;\n  const res = fsRequete_({ from: [{ collectionId: 'inscriptionsWebinaires' }], limit: 200 }).filter(function (x) { return x.document; });\n  if (!res.length) return 0;\n  const lignes = [], effacer = [];\n  res.forEach(function (x) {\n    const d = objetFs_(x.document.fields || {}), email = String(d.adresse || '').toLowerCase();\n    effacer.push({ delete: x.document.name });\n    if (!email || !d.evenement || estTest_(email)) return;\n    lignes.push(ligneEcriture_(email, 'webinaire', { id: d.evenement }));\n    const demandes = demandesWebinaire_(email);\n    if (demandes.indexOf(d.evenement) === -1) { demandes.push(d.evenement); cache_().put('WEBI_' + cleCache_(email), JSON.stringify(demandes), 21600); }\n  });\n  if (lignes.length) ajouterSousVerrou_(lignes);\n  fsCommit_(effacer);\n  return lignes.length;\n}\n\n/* ---------- Compteur de consommation (Admin › Réglages) ---------- */\n\n/* Début de la journée de quota : minuit heure du Pacifique (9 h à Paris) */\nfunction debutJourPacifique_(d) {\n  const p = Utilities.formatDate(d, 'America/Los_Angeles', 'yyyy-MM-dd HH:mm:ss').split(/[- :]/).map(Number);\n  const decalage = Date.UTC(p[0], p[1] - 1, p[2], p[3], p[4], p[5]) - Math.floor(d.getTime() / 1000) * 1000;\n  return new Date(Date.UTC(p[0], p[1] - 1, p[2]) - decalage);\n}\n\n/* Cloud Monitoring exige la facturation (offre Blaze) : sans MESURE_MONITORING = oui, le compteur se fonde sur l'estimation */\nfunction mesureMonitoringActive_() {\n  return PropertiesService.getScriptProperties().getProperty('MESURE_MONITORING') === 'oui';\n}\n\n/* Cloud Monitoring : opérations de documents depuis le début de la journée de quota (somme de tous les points) */\nfunction mesureMonitoring_(debut, fin) {\n  const base = PropertiesService.getScriptProperties().getProperty('MONITORING_URL') || 'https://monitoring.googleapis.com/v3/projects/' + projetFirestore_();\n  const secondes = Math.max(60, Math.ceil((fin - debut) / 1000));\n  const mesure = function (metrique) {\n    const params = { filter: 'metric.type=\"firestore.googleapis.com/document/' + metrique + '\"', 'interval.startTime': debut.toISOString(), 'interval.endTime': fin.toISOString(),\n      'aggregation.alignmentPeriod': secondes + 's', 'aggregation.perSeriesAligner': 'ALIGN_SUM', 'aggregation.crossSeriesReducer': 'REDUCE_SUM' };\n    const url = base + '/timeSeries?' + Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');\n    const r = UrlFetchApp.fetch(url, { headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, muteHttpExceptions: true });\n    if (r.getResponseCode() >= 300) throw new Error('Cloud Monitoring ' + r.getResponseCode() + ' : ' + r.getContentText().slice(0, 150));\n    let total = 0;\n    (JSON.parse(r.getContentText() || '{}').timeSeries || []).forEach(function (s) {\n      (s.points || []).forEach(function (pt) { total += Number(pt.value && (pt.value.int64Value || pt.value.doubleValue)) || 0; });\n    });\n    return total;\n  };\n  return { lectures: mesure('read_ops_count'), ecritures: mesure('write_ops_count'), suppressions: mesure('delete_ops_count') };\n}\n\n/* Estimation de secours : visites et inscriptions du jour (tableur) × coûts unitaires (étalonnés au test de charge) */\nfunction estimationConso_(debut, couts) {\n  let actifs = 0, nouveaux = 0;\n  lignes_('Joueurs').forEach(function (j) {\n    if (estTest_(j.Email)) return;\n    if (j['Inscrit le'] && new Date(j['Inscrit le']) >= debut) nouveaux++;\n    else if (j['Dernière visite'] && new Date(j['Dernière visite']) >= debut) actifs++;\n  });\n  return { actifs: actifs, nouveaux: nouveaux,\n    lectures: actifs * couts.lecturesActif + nouveaux * couts.lecturesNouveau + couts.lecturesFixes,\n    ecritures: actifs * couts.ecrituresActif + nouveaux * couts.ecrituresNouveau + couts.ecrituresFixes, suppressions: 0 };\n}\n\n/* Chaque heure (prechaufferCaches) : relevé gardé pour l'admin, alerte aux administrateurs à 70 % puis à 90 % */\nfunction releverConsommation() {\n  if (!versionActivee_() || !firestoreActif_()) return null;\n  const props = PropertiesService.getScriptProperties(), maintenant = new Date(), debut = debutJourPacifique_(maintenant);\n  const jour = Utilities.formatDate(debut, 'America/Los_Angeles', 'yyyy-MM-dd');\n  const couts = Object.assign({}, COUTS_CONSO_DEFAUT, JSON.parse(props.getProperty('COUTS_CONSO') || '{}'));\n  const coef = Number(props.getProperty('COEF_CONSO')) || 1;\n  let r = null, raison = '';\n  if (mesureMonitoringActive_()) {\n    try {\n      const m = mesureMonitoring_(debut, maintenant);\n      r = { source: 'mesure', coef: coef, lectures: Math.round(m.lectures * coef), ecritures: Math.round(m.ecritures * coef), suppressions: Math.round(m.suppressions * coef) };\n    } catch (e) {\n      console.warn('Consommation Firestore : mesure indisponible, estimation à la place (' + e.message + ')');\n      raison = String(e.message).slice(0, 150);\n    }\n  }\n  if (!r) {\n    r = estimationConso_(debut, couts);\n    r.source = 'estimation';\n    if (raison) r.raison = raison;\n  }\n  r.jour = jour; r.depuis = debut.toISOString(); r.releveLe = maintenant.toISOString(); r.quotas = QUOTAS_FIRESTORE;\n  const ancien = JSON.parse(props.getProperty('CONSO_RELEVE') || 'null');\n  r.hier = ancien ? (ancien.jour !== jour ? { jour: ancien.jour, lectures: ancien.lectures, ecritures: ancien.ecritures, suppressions: ancien.suppressions, source: ancien.source } : ancien.hier || null) : null;\n  r.alertes = alerterConso_(r);\n  props.setProperty('CONSO_RELEVE', JSON.stringify(r));\n  return r;\n}\n\nfunction alerterConso_(r) {\n  const props = PropertiesService.getScriptProperties();\n  let deja = JSON.parse(props.getProperty('ALERTES_CONSO') || '{}');\n  if (deja.jour !== r.jour) deja = { jour: r.jour, envoyees: [] };\n  const libelles = { lectures: 'lectures', ecritures: 'écritures', suppressions: 'suppressions' };\n  Object.keys(QUOTAS_FIRESTORE).forEach(function (k) {\n    const pct = Math.round(100 * (Number(r[k]) || 0) / QUOTAS_FIRESTORE[k]);\n    const seuil = SEUILS_ALERTE_CONSO.filter(function (s) { return pct >= s; })[0];\n    if (!seuil || deja.envoyees.indexOf(k + '-' + seuil) !== -1) return;\n    const texte = ':warning: *Académie : quota gratuit de Firestore à ' + pct + ' %* (' + libelles[k] + ' : ' + r[k].toLocaleString('fr-FR') + ' sur ' + QUOTAS_FIRESTORE[k].toLocaleString('fr-FR')\n      + ', ' + (r.source === 'mesure' ? 'mesure Cloud Monitoring' : 'estimation') + ').\\n'\n      + (seuil >= 90 ? 'Au-delà de 100 %, l’Académie est bloquée jusqu’à 9 h demain. Suspends dès maintenant invitations et annonces.' : 'Suspends les invitations et les annonces jusqu’à demain 9 h (remise à zéro du quota).');\n    admins_().forEach(function (a) {\n      try { envoyerMP_(trouverJoueur_(a) || { Email: a }, texte, 'Ouvrir l’admin', 'admin'); } catch (e) { console.warn('Alerte consommation non envoyée à ' + a + ' : ' + e.message); }\n    });\n    deja.envoyees.push(k + '-' + seuil);\n    if (seuil === 90 && deja.envoyees.indexOf(k + '-70') === -1) deja.envoyees.push(k + '-70');\n  });\n  props.setProperty('ALERTES_CONSO', JSON.stringify(deja));\n  return deja.envoyees;\n}\n\n/* ---------- Reprise des inscrits (lancée par Katia depuis l'éditeur) ---------- */\n\n/* exporterVersFirestore() ou exporterVersFirestore(true) : simulation, rien n'est écrit.\n   exporterVersFirestore(false) : écriture par lots de 500, avec l'accord de Katia. */\nfunction exporterVersFirestore(simulation) {\n  simulation = simulation !== false;\n  if (!simulation && !firestoreActif_()) throw new Error('FIRESTORE_ACTIF n’est pas à « oui » : écriture refusée.');\n  const debut = new Date();\n  const prog = {}, docs = {};\n  lignes_('Progression').forEach(function (p) {\n    const e = String(p.Email).toLowerCase();\n    (prog[e] = prog[e] || {})[String(p.Mission)] = p;\n  });\n  lignes_('Documents').forEach(function (d) {\n    const e = String(d.Email).toLowerCase();\n    (docs[e] = docs[e] || []).push({ type: d.Document, version: String(d.Version), date: dateIso_(d['Lu le'] || d.Date), pret: !!d.Fichier });\n  });\n  const managers = managers_(), fiches = [];\n  const bilan = { fiches: 0, missions: 0, missionsReussies: 0, quiz: 0, chartes: 0, documents: 0, bonus: 0, ecartsXp: 0 };\n  lignes_('Joueurs').forEach(function (j) {\n    const email = String(j.Email || '').toLowerCase();\n    if (!email || estTest_(email)) return;\n    const f = ficheDepuisTableur_(email, j, prog[email] || {}, docs[email] || [], managers, debut);\n    fiches.push({ email: email, f: f.fiche });\n    bilan.fiches++;\n    bilan.missions += Object.keys(f.fiche.missions).length;\n    bilan.missionsReussies += Object.keys(f.fiche.missions).filter(function (id) { return f.fiche.missions[id].reussie; }).length;\n    bilan.quiz += Object.keys(f.fiche.quiz).length;\n    if (f.fiche.charte) bilan.chartes++;\n    bilan.documents += f.fiche.documents.length;\n    if (f.fiche.bonus) bilan.bonus++;\n    if (f.ecartXp < 0) bilan.ecartsXp++;\n  });\n  const masquer = function (e) { const p = e.split('@'); return p[0].slice(0, 2) + '…@' + p[1]; };\n  bilan.exemples = fiches.slice(0, 3).map(function (x) { return { adresse: masquer(x.email), fiche: serialiser_(x.f) }; });\n  console.log((simulation ? 'SIMULATION (rien n’est écrit) : ' : 'ÉCRITURE : ') + bilan.fiches + ' fiches, ' + bilan.missions + ' missions (' + bilan.missionsReussies + ' réussies), '\n    + bilan.quiz + ' quiz, ' + bilan.chartes + ' chartes, ' + bilan.documents + ' documents, ' + bilan.bonus + ' bonus, ' + bilan.ecartsXp + ' XP du tableur inférieurs au calcul');\n  bilan.exemples.forEach(function (x) { console.log('Exemple ' + x.adresse + ' : ' + JSON.stringify(x.fiche)); });\n  bilan.simulation = simulation;\n  if (simulation) return bilan;\n  for (let i = 0; i < fiches.length; i += 500) {\n    fsCommit_(fiches.slice(i, i + 500).map(function (x) { return { update: { name: nomDocFs_('collaborateurs/' + x.email), fields: champsFs_(x.f) } }; }));\n  }\n  // Curseur de la copie : les fiches exportées (maj = début de l'export) ne reviennent pas dans le tableur\n  PropertiesService.getScriptProperties().setProperty('FS_CURSEUR', JSON.stringify({ maj: debut.toISOString() }));\n  bilan.ecritLe = debut.toISOString();\n  return bilan;\n}\n\nfunction ficheDepuisTableur_(email, j, prog, docs, managers, maj) {\n  const d = function (v) { const x = v ? new Date(v) : null; return x && !isNaN(x) ? x : null; };\n  const fiche = { prenom: String(j['Prénom'] || prenomDepuisEmail_(email)), theme: j['Thème'] === 'jour' ? 'jour' : 'sombre',\n    inscritLe: d(j['Inscrit le']) || maj, derniereVisite: d(j['Dernière visite']) || d(j['Inscrit le']) || maj, maj: maj,\n    missions: {}, quiz: {}, documents: docs };\n  if (j.Site) fiche.site = String(j.Site);\n  if (j.Cabinet) fiche.cabinet = cabinetActuel_(j.Cabinet);\n  Object.keys(prog).forEach(function (id) {\n    const p = prog[id];\n    if (MISSIONS[id]) {\n      const m = { reussie: p.Statut === 'Réussie', meilleur: Number(p['Meilleur score']) || 0, total: Number(p.Total) || MISSIONS[id].total, tentatives: Math.max(1, Number(p.Tentatives) || 1) };\n      if (m.reussie) m.le = d(p['Réussie le']) || maj;\n      fiche.missions[id] = m;\n    } else if (/^Q-\\d{4}-\\d{2}$/.test(id)) {\n      fiche.quiz[id.slice(2)] = { score: Number(p['Meilleur score']) || 0, nb: Number(p.Total) || 0, le: d(p['Réussie le']) || maj };\n    }\n  });\n  const version = String(j['Charte version'] || '').replace(/^'/, '');\n  if (j['Charte validée le']) fiche.charte = { version: version, le: d(j['Charte validée le']) || maj };\n  // XP : recalculés par la page ; l'écart avec le tableur (lives, anciens bonus) est gardé dans « bonus »\n  let calcul = 0;\n  NIVEAUX.forEach(function (n) {\n    const faites = n.missions.filter(function (id) { return fiche.missions[id] && fiche.missions[id].reussie; }).length;\n    calcul += faites * XP_MISSION;\n    if (faites === n.missions.length && (n.num !== 1 || fiche.charte)) calcul += XP_BADGE;\n  });\n  Object.keys(fiche.quiz).forEach(function (m) { calcul += fiche.quiz[m].score * XP_QUIZ_PAR_BONNE; });\n  const ecart = (Number(j.XP) || 0) - calcul;\n  if (ecart > 0) fiche.bonus = ecart;\n  const admin = estAdmin_(email), manager = admin || !!managers[email] || estManagerOrg_(email);\n  if (admin || manager) fiche.roles = { admin: admin, manager: manager };\n  return { fiche: fiche, ecartXp: ecart };\n}\n\n/* Lecture complète d'un onglet en tableau de valeurs (colonnes de ONGLETS) */\nfunction tableau_(nom) {\n  const sh = feuille_(nom), n = sh.getLastRow() - 1, k = ONGLETS[nom].length;\n  const lignes = n > 0 ? sh.getRange(2, 1, n, k).getValues() : [];   // lignes vides comprises : la réécriture garde les positions\n  return { lignes: lignes, avant: lignes.length };\n}\nfunction colonnes_(nom) { const c = {}; ONGLETS[nom].forEach(function (h, i) { c[h] = i; }); return c; }\n/* Réécrit l'onglet d'un bloc ; texte : colonne à garder en texte (« 1.1 » ne doit pas devenir un nombre) */\nfunction ecrireTableau_(nom, T, texte) {\n  if (!T.lignes.length) return;\n  const k = texte ? ONGLETS[nom].indexOf(texte) : -1;\n  const valeurs = T.lignes.map(function (l) {\n    if (k === -1) return l;\n    const c = l.slice(); c[k] = \"'\" + String(c[k]).replace(/^'/, ''); return c;\n  });\n  feuille_(nom).getRange(2, 1, valeurs.length, ONGLETS[nom].length).setValues(valeurs);\n}\nfunction ajouterLignes_(nom, lignes) {\n  if (!lignes.length) return;\n  const sh = feuille_(nom);\n  sh.getRange(sh.getLastRow() + 1, 1, lignes.length, lignes[0].length).setValues(lignes);\n}\n\n/* Durée de chaque traitement, pour surveiller le quota quotidien de 6 heures des déclencheurs */\nfunction noterDuree_(fonction, debut, detail) {\n  try { if (!MODE_CHARGE_) ajouter_('Journal technique', [new Date(), fonction, Math.round((Date.now() - debut) / 100) / 10, detail || '']); }\n  catch (e) { console.warn('Journal technique : ' + e.message); }\n}\n\nfunction trouverJoueur_(email) {\n  return lignes_('Joueurs').filter(function (j) { return String(j.Email).toLowerCase() === email; })[0] || null;\n}\n\nfunction prenomDepuisEmail_(email) {\n  const debut = email.split('@')[0].split(/[._-]/)[0] || '';\n  return debut.length > 1 ? debut.charAt(0).toUpperCase() + debut.slice(1) : '';\n}\n\n/* Site affiché et classé : « Paris · Keobiz » pour un site français, « Tunisie » pour un site offshore (même règle dans la page : siteCab) */\nfunction cabinetActuel_(cabinet) {\n  cabinet = String(cabinet || '');\n  return CONFIG.ANCIENS_CABINETS[cabinet] || cabinet;\n}\n\nfunction siteCabinet_(site, cabinet) {\n  site = String(site || '');\n  cabinet = cabinetActuel_(cabinet);\n  if (!site) return '';\n  return CONFIG.SITES_OFFSHORE.indexOf(site) !== -1 || !cabinet ? site : site + ' · ' + cabinet;\n}\n/* Cabinet de chaque collaborateur (le journal ne garde que le site) */\nfunction cabinetsParEmail_() {\n  if (MEMO_.__cabinets) return MEMO_.__cabinets;\n  const c = {};\n  lignes_('Joueurs').forEach(function (j) { c[String(j.Email).toLowerCase()] = cabinetActuel_(j.Cabinet); });\n  return (MEMO_.__cabinets = c);\n}\nfunction siteDuJournal_(e) { return siteCabinet_(e.Site, cabinetsParEmail_()[String(e.Email).toLowerCase()]); }\n\nfunction meilleurDuMois_(journal, annee, mois) {\n  const total = {}, infos = {};\n  journal.forEach(function (e) {\n    const d = new Date(e.Date);\n    if (d.getFullYear() !== annee || d.getMonth() !== mois || !(Number(e.XP) > 0)) return;\n    total[e.Email] = (total[e.Email] || 0) + Number(e.XP);\n    infos[e.Email] = { prenom: e['Prénom'], site: siteDuJournal_(e) };\n  });\n  const emails = Object.keys(total).sort(function (a, b) { return total[b] - total[a]; });\n  return emails.length ? { prenom: infos[emails[0]].prenom, nom: nomDe_(emails[0]), site: infos[emails[0]].site, xp: total[emails[0]] } : null;\n}\n\nfunction journal_(email, prenom, site, action, xp) {\n  ajouter_('Journal', [new Date(), email, prenom || '', site || '', action, xp || 0]);\n  viderPartages_();\n  invalider_('Journal');\n}\n\nfunction debutSemaine_() {\n  const d = new Date();\n  d.setHours(0, 0, 0, 0);\n  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));\n  return d;\n}\n\nfunction joursDepuis_(date) {\n  if (!date) return Infinity;\n  return (Date.now() - new Date(date).getTime()) / 86400000;\n}\n\n/* Rappel 2 jours ouvrés après l'invitation :\n   lundi → mercredi, mardi → jeudi, mercredi → vendredi, jeudi → lundi, vendredi → mardi */\nfunction dateRappel_(invitation) {\n  const d = new Date(invitation);\n  d.setHours(0, 0, 0, 0);\n  let restants = CONFIG.JOURS_OUVRES_AVANT_RAPPEL;\n  while (restants > 0) {\n    d.setDate(d.getDate() + 1);\n    if (estOuvre_(d)) restants--;\n  }\n  return d;\n}\n\n/* Jours fériés français (fixes + calculés depuis Pâques) */\nfunction paques_(annee) {\n  const a = annee % 19, b = Math.floor(annee / 100), c = annee % 100, d = Math.floor(b / 4), e = b % 4;\n  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;\n  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);\n  const mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;\n  return new Date(annee, mois - 1, jour);\n}\nfunction joursFeries_(annee) {\n  const paques = paques_(annee);\n  const plus = function (n) { const x = new Date(paques); x.setDate(x.getDate() + n); return x; };\n  const dates = [new Date(annee, 0, 1), plus(1), new Date(annee, 4, 1), new Date(annee, 4, 8), plus(39), plus(50),\n    new Date(annee, 6, 14), new Date(annee, 7, 15), new Date(annee, 10, 1), new Date(annee, 10, 11), new Date(annee, 11, 25)];\n  return dates.map(function (x) { return Utilities.formatDate(x, 'Europe/Paris', 'yyyy-MM-dd'); });\n}\n/* Pays d'un site, pour ses jours fériés */\nfunction paysDuSite_(site) {\n  const s = String(site || '').toLowerCase();\n  if (/tunisie/.test(s)) return 'TN';\n  if (/madagascar/.test(s)) return 'MG';\n  if (/maurice/.test(s)) return 'MU';\n  return 'FR';\n}\n/* Agendas publics des jours fériés (Google) ; si l'agenda ne répond pas, les fêtes à date fixe */\nconst AGENDAS_FERIES = { TN: 'en.tn#holiday@group.v.calendar.google.com', MG: 'en.mg#holiday@group.v.calendar.google.com', MU: 'en.mu#holiday@group.v.calendar.google.com' };\nconst FERIES_FIXES = {\n  TN: ['01-01', '03-20', '04-09', '05-01', '07-25', '08-13', '10-15', '12-17'],\n  MG: ['01-01', '03-29', '05-01', '06-26', '08-15', '11-01', '12-25'],\n  MU: ['01-01', '01-02', '02-01', '03-12', '05-01', '08-15', '11-01', '11-02', '12-25']\n};\nconst MEMO_FERIES_ = {};\nfunction joursFeriesPays_(pays, annee) {\n  const cle = 'FERIES_' + pays + '_' + annee;\n  if (MEMO_FERIES_[cle]) return MEMO_FERIES_[cle];\n  if (pays === 'FR') return (MEMO_FERIES_[cle] = joursFeries_(annee));\n  const cache = cache_(), connu = cache.get(cle);\n  if (connu) return (MEMO_FERIES_[cle] = JSON.parse(connu));\n  let jours = [];\n  try {\n    const r = Calendar.Events.list(AGENDAS_FERIES[pays], { timeMin: new Date(annee, 0, 1).toISOString(), timeMax: new Date(annee + 1, 0, 1).toISOString(), singleEvents: true, maxResults: 250 });\n    (r.items || []).forEach(function (ev) {\n      if (/observance/i.test(ev.description || '') || !ev.start || !ev.start.date) return;\n      const d = new Date(ev.start.date + 'T12:00:00'), fin = new Date   /* ---------------- PDF de « Mes documents » : la mise en page du serveur (gabarit), rendue avec jsPDF ---------------- */
  async function enPdf(html) {

    const titre = doc.splitTextToSize(propre(txt('h1')), 170); doc.text(titre, 20, y); y += titre.length * 9 + 6;

    const phrase = doc.splitTextToSize(propre(txt('h1 + p')), 170); doc.text(phrase, 20, y); y += phrase.length * 6 + 6;
    const missions = [...d.querySelectorAll('li')].map((x) => x.textContent.trim());
    if (missions.length) {
      doc.setFont('helvetica', 'bold'); doc.text(propre('Missions validées :'), 20, y); y += 7; doc.setFont('helvetica', 'normal');

      y += 5;
    }
    doc.setFontSize(10); doc.setTextColor(85, 83, 122);
    const note = doc.splitTextToSize(propre(txt('.note')), 170); doc.text(note, 20, y); y += note.length * 5 + 14;
    doc.setFontSize(12); doc.setTextColor(21, 20, 47);
    y = Math.max(y, 120); doc.text(propre(txt('.fait')), 20, y);
    const sig = d.querySelector('.sig');
    if (sig) {
      y += 14; doc.setFont('helvetica', 'bold'); doc.text(propre(txt('.sig strong')), 20, y);
      doc.setFont('helvetica', 'normal'); doc.text(propre(sig.textContent.replace(txt('.sig strong'), '').trim()), 20, y + 6);
    }
    return doc.output('datauristring').split(',')[1];
  }

.confetti{position:absolute;top:0;width:12px;height:18px;border-radius:3px;animation:confetti 1.8s ease-in both}
@keyframes entre{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes remplit{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes marche{to{stroke-dashoffset:-40}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function hacher(t) { let h = 5381; t = String(t); for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function utilisateurConnu() { return relire(CLE_UTILISATEUR); }
function cleLocale(nom) { const u = utilisateurConnu(); return u ? 'kta-' + nom + '-' + u + '-' + hacher(KTA_VERSION) : null; }

      if (k === 'kta-etat-v2' || k === 'kta-admin-v2' || (/^kta-(etat|page)-/.test(k) && !(u && k.endsWith(fin)))) localStorage.removeItem(k);

/* Pages Classement, Mon équipe, Admin… : préchargées, gardées en mémoire et dans le navigateur avec leur date */
const DONNEES = {}, EN_COURS = {}, FRAICHEUR = 5 * 60000;
const SQUELETTE = '<div class="pile" aria-busy="true"><div class="carte"><span class="os" style="width:260px;height:44px"></span></div><div class="carte"><span class="os" style="width:100%;height:320px"></span></div></div>';
function lireDonnees(nom) {
  if (!DONNEES[nom]) { const c = cleLocale('page-' + nom), v = c ? relire(c) : null; if (v && v.t) DONNEES[nom] = v; }
  return DONNEES[nom] || null;
}
function garderDonnees(nom, d) { const v = { d: d, t: Date.now() }; DONNEES[nom] = v; const c = cleLocale('page-' + nom); if (c) memoriser(c, v); return d; }
function oublierDonnees(nom) { delete DONNEES[nom]; const c = cleLocale('page-' + nom); if (c) memoriser(c, null); }
function chargerDonnees(nom, fn) {
  if (!EN_COURS[nom]) EN_COURS[nom] = appel(fn).then((d) => garderDonnees(nom, d)).finally(() => { delete EN_COURS[nom]; });
  return EN_COURS[nom];
}
const donneesVieilles = (nom) => { const c = lireDonnees(nom); return !c || Date.now() - c.t >= FRAICHEUR; };
const pageAffichee = (nom) => !!document.querySelector('.nav [data-aller="' + nom + '"][aria-current="page"]');
/* Affiche tout de suite ce qui est connu ; rafraîchit en silence si les données ont plus de 5 minutes */
async function pageAvecCache(nom, fn, dessiner, valide) {
  let connu = lireDonnees(nom);
  if (connu && valide && !valide(connu.d)) connu = null;
  if (connu) { try { dessiner(connu.d); } catch (e) { connu = null; oublierDonnees(nom); } }
  if (!connu) vue.innerHTML = SQUELETTE;
  if (connu && Date.now() - connu.t < FRAICHEUR) return;
  try {
    const d = await chargerDonnees(nom, fn);
    if (pageAffichee(nom) && (!connu || hacher(JSON.stringify(d)) !== hacher(JSON.stringify(connu.d)))) dessiner(d);
  } catch (e) { if (!connu && pageAffichee(nom)) vue.innerHTML = `<section class="carte panne"><p>${esc(messageErreur(e))}</p></section>`; }
}
/* Écritures envoyées au serveur : gardées dans le navigateur jusqu'à sa confirmation, envoyées une à une
   (dans l'ordre), avec de nouvelles tentatives espacées en cas de serveur saturé. Rien ne bloque l'affichage. */
let FILE_ENVOIS = Promise.resolve();
const lireAttentes = () => { const c = cleLocale('attente'); return (c && relire(c)) || []; };
const garderAttentes = (l) => { const c = cleLocale('attente'); if (c) memoriser(c, l); };
const retirerAttente = (cle) => garderAttentes(lireAttentes().filter((a) => a.cle !== cle));
const nouvelleCle = (fn) => fn + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
function erreurPassagere(e) {
  return /réessayer|occupé|too many|simultan|quota|limit|429|50\d|unavailable|indisponible|timeout|délai|failed to fetch|networkerror|load failed|réseau/i.test(messageErreur(e));
}
function envoyerAvecReprise(fn, args, essai) {
  essai = essai || 0;
  return appel(fn, ...args).catch((e) => {
    if (!erreurPassagere(e) || essai >= 4) throw e;
    const delai = Math.min(30000, 1000 * Math.pow(2, essai)) * (0.7 + Math.random() * 0.6);
    return new Promise((ok) => setTimeout(ok, delai)).then(() => envoyerAvecReprise(fn, args, essai + 1));
  });
}
/* siOk(réponse) ; siEchec(erreur) seulement pour un refus du serveur (pas pour un serveur saturé) */
function ecrireServeur(fn, args, cle, siOk, siEchec) {
  garderAttentes(lireAttentes().concat([{ cle, fn, args }]));
  FILE_ENVOIS = FILE_ENVOIS.then(() => envoyerAvecReprise(fn, args)
    .then((r) => { retirerAttente(cle); if (siOk) siOk(r); })
    .catch((e) => {
      if (erreurPassagere(e)) { toast('Enregistrement en attente', 'Le serveur est très demandé : c’est gardé et ce sera envoyé dès que possible.'); return; }
      retirerAttente(cle); if (siEchec) siEchec(e);
    }));
  return FILE_ENVOIS;
}
/* Au chargement : les écritures restées en attente sont réappliquées à l'affichage, puis renvoyées */
function renvoyerAttentes() {
  const liste = lireAttentes();
  if (!liste.length) return;
  liste.forEach((a) => {
    if (a.fn === 'terminerMission') appliquerResultat(a.args[0], a.args[1], a.args[3]);
    else if (a.fn === 'choisirSite') { ETAT.joueur.site = a.args[0]; if (a.args[1]) ETAT.joueur.cabinet = a.args[1]; }
    else if (a.fn === 'choisirTheme') { ETAT.joueur.theme = a.args[0]; appliquerTheme(a.args[0]); }
  });
  majEntete();
  liste.forEach((a) => { FILE_ENVOIS = FILE_ENVOIS.then(() => envoyerAvecReprise(a.fn, a.args).then((r) => {
    retirerAttente(a.cle);
    if (a.fn === 'terminerMission' && r && r.joueur) { ETAT = r; majEntete(); }
  }).catch((e) => { if (!erreurPassagere(e)) retirerAttente(a.cle); })); });
}

function chargerScript(url) {
  return new Promise((ok, ko) => {
    const sc = document.createElement('script');
    sc.src = url;
    sc.onload = ok;
    sc.onerror = () => ko(new Error('Le module PDF n’a pas pu se charger. Vérifie ta connexion.'));
    document.head.appendChild(sc);
  });
}
const CDNJS = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/';
function chargerJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return chargerScript(CDNJS + 'jspdf/2.5.1/jspdf.umd.min.js').then(() => window.jspdf.jsPDF);
}
/* Tableaux dans un PDF : module jspdf-autotable, chargé seulement quand on en a besoin */
function chargerTableauPDF() {
  return chargerJsPDF().then((JsPDF) => (JsPDF.API.autoTable ? JsPDF : chargerScript(CDNJS + 'jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js').then(() => JsPDF)));
}

  const man = document.getElementById('equipe-manager');
  if (man) man.onchange = () => { document.body.classList.add('sans-anim'); EQUIPE_MANAGER = man.value; EQUIPE_VUES = 50; dessinerEquipe(); };
  const rech = document.getElementById('equipe-recherche');
  rech.oninput = () => {
    document.body.classList.add('sans-anim');
    EQUIPE_RECHERCHE = rech.value; EQUIPE_VUES = 50;
    const pos = rech.selectionStart; dessinerEquipe();
    const r = document.getElementById('equipe-recherche'); r.focus(); r.setSelectionRange(pos, pos);
  };

  const suite = document.getElementById('equipe-suite');
  if (suite) {
    suite.onclick = () => { EQUIPE_VUES += 50; dessinerEquipe(); };
    if (window.IntersectionObserver) new IntersectionObserver((v, obs) => { if (v[0].isIntersecting) { obs.disconnect(); EQUIPE_VUES += 50; dessinerEquipe(); } }, { rootMargin: '200px' }).observe(suite);
  }
  document.getElementById('telecharger-equipe').onclick = (ev) => telechargerEquipe(listes, ev.currentTarget);
}

/* Liste du périmètre filtré, en PDF : A4 paysage, en-tête Kerogo, en-tête du tableau répété, « Page x / y » */
async function telechargerEquipe(liste, bouton) {
  const texte = bouton ? bouton.textContent : '';
  if (bouton) { bouton.disabled = true; bouton.textContent = 'Préparation du PDF…'; }
  try {
    const JsPDF = await chargerTableauPDF();
    const propre = (t) => String(t == null ? '' : t).replace(/[’‘]/g, "'").replace(/[“”]/g, '"');
    const ordre = toutesMissions().map((m) => m.id), titres = {};
    toutesMissions().forEach((m) => { titres[m.id] = m.titre; });
    const derniere = (x) => { const ids = (x.missions || []).slice().sort((a, b) => ordre.indexOf(a) - ordre.indexOf(b)); const id = ids[ids.length - 1]; return id ? id + ' · ' + (titres[id] || '') : ''; };
    const doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
    const aujourdhui = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    const logo = document.querySelector('.logo-jour');
    const entete = () => {
      if (logo && logo.naturalWidth) doc.addImage(logo.src, 'PNG', 14, 10, 9 * logo.naturalWidth / logo.naturalHeight, 9);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(21, 20, 47);
      doc.text(propre('Mon équipe · Académie IA'), 283, 15, { align: 'right' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(85, 83, 122);
      doc.text(propre(aujourdhui + ' · ' + nomComplet(ETAT.joueur)), 283, 20, { align: 'right' });
      doc.setDrawColor(99, 69, 240); doc.setLineWidth(0.5); doc.line(14, 24, 283, 24);
    };
    doc.autoTable({
      startY: 29, margin: { top: 29, left: 14, right: 14, bottom: 16 },
      head: [['Prénom et nom', 'Cabinet', 'Site', 'Poste', 'Charte lue le', 'Missions validées', 'Dernière mission validée', 'XP', 'Dernière visite']],
      body: liste.map((x) => [propre(nomComplet(x)), propre(x.cabinet), propre(x.inscrit ? siteCab(x.site, x.cabinet) : 'Pas encore inscrit'), propre(x.poste),
        x.charte ? dateCourte(x.charte) + (x.charteVersion ? ' (v' + x.charteVersion + ')' : '') : '', x.inscrit ? String(x.missions.length) : '',
        propre(x.inscrit ? derniere(x) : ''), x.inscrit ? nbr(x.xp).replace(/\s/g, ' ') : '', x.visite ? dateCourte(x.visite) : '']),
      showHead: 'everyPage', theme: 'grid',
      styles: { font: 'helvetica', fontSize: 8, cellPadding: 2, textColor: [21, 20, 47], lineColor: [226, 224, 240], lineWidth: 0.2 },
      headStyles: { fillColor: [99, 69, 240], textColor: [255, 255, 255], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [243, 243, 248] },
      columnStyles: { 0: { fontStyle: 'bold' }, 5: { halign: 'center' }, 7: { halign: 'right' } },
      didDrawPage: entete
    });
    const pages = doc.getNumberOfPages();
    for (let n = 1; n <= pages; n++) {
      doc.setPage(n); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(85, 83, 122);
      doc.text('Page ' + n + ' / ' + pages, 283, 203, { align: 'right' });
    }
    const fichier = 'equipe-academie-' + new Date().toISOString().slice(0, 10) + '.pdf';
    doc.save(fichier);
    toast('Liste téléchargée', fichier);
  } catch (e) { toast('Téléchargement impossible', messageErreur(e)); }
  if (bouton) { bouton.disabled = false; bouton.textContent = texte; }
}

async function exporterAttestations(bouton) {
  bouton.disabled = true; const t = bouton.textContent; bouton.textContent = 'Export en cours…';
  try { const url = await appel('exporterAttestations'); window.open(url, '_blank'); toast('Attestations exportées', 'L’onglet « Attestations » du tableur de suivi est à jour.'); }
  catch (e) { toast('Export impossible', messageErreur(e)); }
  bouton.disabled = false; bouton.textContent = t;
}

    s.enregistre = true;

  };

}

function annoncerResultat(r) {

/* Le résultat est calculé dans la page et affiché tout de suite ; l'enregistrement part en arrière-plan.
   En cas d'échec, la progression revient à l'état précédent. */
function appliquerResultat(id, bonnes, charteLue) {
  const m = toutesMissions().find((x) => x.id === id);
  const seuil = (m && m.seuil) || (MISSIONS_DEF[id] || {}).seuil || 0;
  const r = { reussie: bonnes >= seuil, xpGagne: 0, nouveauBadge: null, premiereFois: false };
  if (!m || !missionOuverte(id)) return Object.assign(r, { test: true });
  if (r.reussie && !m.reussie) {
    const n = ETAT.niveaux.find((x) => x.missions.indexOf(m) !== -1);
    m.reussie = true; m.reussieLe = new Date().toISOString();
    r.premiereFois = true; r.xpGagne = 50;
    n.faites = n.missions.filter((x) => x.reussie).length; n.complet = n.faites === n.missions.length;
    if (badgeObtenu(n)) { r.nouveauBadge = n.badge; r.xpGagne += 100; }
    if (n.num === 1 && n.complet && charteSignee() && !(ETAT.documents || []).some((d) => d.type === 'certification')) {
      (ETAT.documents = ETAT.documents || []).push({ type: 'certification', version: ETAT.joueur.charteVersion, date: new Date().toISOString(), pret: false });
    }
    ETAT.joueur.xp += r.xpGagne;
    ETAT.niveauCourant = (ETAT.niveaux.find((x) => !x.complet) || ETAT.niveaux[ETAT.niveaux.length - 1]).num;
    const suivante = toutesMissions().find((x) => !x.reussie);
    ETAT.prochaine = suivante && suivante.dispo ? suivante : null;
  }
  return r;
}
function envoyerMission(id, bonnes, total, charteLue) {
  const avis = avisRequis(id) && AVIS[id] ? { utile: AVIS[id].utile, usage: AVIS[id].usage } : null;
  const avant = JSON.parse(JSON.stringify(ETAT));
  const r = appliquerResultat(id, bonnes, charteLue);
  ETAT.resultat = r;
  majEntete(); annoncerResultat(r);
  const cle = nouvelleCle('mission');
  if (r.test) appel('terminerMission', id, bonnes, total, charteLue === true, null, cle).catch(() => {});
  else ecrireServeur('terminerMission', [id, bonnes, total, charteLue === true, avis, cle], cle,
    (frais) => { if (frais && frais.joueur) { ETAT = frais; majEntete(); } },
    (e) => {
      ETAT = avant; majEntete();
      if (!SESSION && (pageAffichee('accueil') || pageAffichee('progression'))) { document.body.classList.add('sans-anim'); if (pageAffichee('progression')) rendreProgression(); else rendreAccueil(); }
      toast('Mission non enregistrée', messageErreur(e) + ' Refais-la dans un instant.');
    });
  return Promise.resolve(r);
}

    const justes = jetons.filter((i) => (etat.sel.indexOf(i) !== -1) === ANONYMISER[i].retirer).length;

function rendreMissionOutils() {
  arreterMinuteur();
  navActive('progression');
  const id = '1.4';
  const etat = Object.assign({ rep: {}, valide: null, envoi: false }, lireReprise(id) || {});
  SESSION = { nom: 'la mission 1.4', active: () => etat.valide === null && Object.keys(etat.rep).length > 0, sauver: () => sauverReprise(id, { rep: etat.rep }) };
  const dessiner = () => {
    const defil = window.scrollY;
    const bonnes = SITUATIONS.filter((x, i) => etat.rep[i] === x.bonne).length;
    const pret = SITUATIONS.every((_, i) => etat.rep[i] !== undefined);
    vue.innerHTML = `<div class="pile" style="max-width:980px;margin:0 auto">
      ${bandeauMission(id)}
      ${entreteMission(id, 'Quel outil pour quoi', 'Cinq outils d’IA sont autorisés au travail, chacun pour un usage précis. Slackbot reste le premier réflexe. Tout le reste est interdit. Entraîne-toi à choisir le bon. 5 minutes, +50 XP.')}
      ${lecteurVideo(id)}
      <section class="carte" style="display:flex;flex-direction:column;gap:14px">
        <p class="surtitre">À retenir</p>
        <div class="ch-outils">${CHARTE_OUTILS.map((o) => `<article class="ch-outil ${o[3] ? 'ch-prioritaire' : ''}">${o[3] ? '<span class="ch-etiquette">Prioritaire</span>' : ''}
          <p class="titre" style="font-size:20px">${o[0]}</p><p class="doux" style="line-height:1.5">${o[1]}</p><p class="ch-regle">${o[2]}</p></article>`).join('')}</div>
        <p class="ch-alerte ch-alerte-rouge" style="line-height:1.55"><span class="ch-marque" style="background:var(--corail)">✕</span><span><strong>Tout le reste est interdit au travail</strong> : versions gratuites ou personnelles de ChatGPT, Claude, Mistral ou Gemini, et extensions de navigateur.</span></p>
      </section>
      <section class="carte" style="display:flex;flex-direction:column;gap:22px">
        <p class="surtitre">Exercice</p>
        <h2 class="titre" style="font-size:26px">Pour chaque situation, choisis le bon outil</h2>
        ${SITUATIONS.map((x, i) => `<fieldset><legend>${i + 1}. ${x.s}</legend><div class="choix-ligne">${OUTILS.map((o, k) => {
          let style = '';
          if (etat.valide !== null) style = k === x.bonne ? 'background:var(--bon);border-color:var(--citron)' : (etat.rep[i] === k ? 'background:var(--faux);border-color:var(--corail)' : '');
          return `<button type="button" data-situation="${i}" data-outil="${k}" aria-pressed="${etat.rep[i] === k}" ${etat.valide !== null ? 'disabled' : ''} style="${style}">${o}</button>`; }).join('')}</div>
          ${etat.valide !== null ? `<p class="explication"><strong>${etat.rep[i] === x.bonne ? 'Bien vu !' : 'Pas tout à fait.'}</strong> ${x.explication}</p>` : ''}</fieldset>`).join('')}
        ${etat.valide !== null ? verdictMission(etat.valide, bonnes + '/7 bonnes réponses' + (etat.valide ? '.' : ' : il en faut 5. Relis les explications et refais la mission.'), id)
          : `${pret ? blocAvis(id) : ''}<div class="boutons"><button type="button" class="btn btn-citron" id="valider" ${pret && avisComplet(id) && !etat.envoi ? '' : 'disabled'}>${etat.envoi ? 'Enregistrement…' : 'Valider ma mission'}</button>
            <p class="doux" style="font-size:14px">${pret ? (avisComplet(id) ? 'Tout est prêt.' : 'Réponds aux deux questions ci-dessus.') : 'Réponds aux 7 situations.'}</p></div>`}
      </section></div>`;
    window.scrollTo(0, defil);
    brancherAvis(id, dessiner);
    SESSION && SESSION.sauver && etat.valide === null && SESSION.sauver();
    document.querySelectorAll('[data-situation]').forEach((b) => { b.onclick = () => { etat.rep[Number(b.dataset.situation)] = Number(b.dataset.outil); dessiner(); }; });
    const v = document.getElementById('valider');
    if (v) v.onclick = async () => {
      etat.envoi = true; dessiner();
      try { const res = await envoyerMission(id, bonnes, 7); etat.valide = !!res.reussie; effacerReprise(id); SESSION = null; }
      catch (e) { toast('Enregistrement impossible', messageErreur(e)); }
      etat.envoi = false; dessiner(); brancherRetour(id);
    };
    const r = document.getElementById('reessayer');
    if (r) r.onclick = () => { effacerReprise(id); rendreMissionOutils(); };
    brancherRecommencer(id, rendreMissionOutils);
    brancherRetour(id);
  };
  if (lireReprise(id)) toast('On reprend', 'Tu retrouves la mission là où tu l’avais laissée.');
  dessiner();
  window.scrollTo(0, 0);
}
