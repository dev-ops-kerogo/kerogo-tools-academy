<script>window.KTA_CODE_GS = "/**\n * Kerogo Tools Academy — application web (Google Apps Script)\n *\n * Installation : voir le guide dans la conversation.\n *  1. Collez Code.gs, Index.html et appsscript.json dans un nouveau projet Apps Script.\n *  2. Propriété du script SLACK_ACADEMIE_TOKEN = jeton xoxb du bot Slack.\n *  3. Lancez installer() une fois, puis déployez en application web.\n *  4. Paramètres du projet > Propriétés du script : URL_APP = adresse de l'Académie\n *     (et CLIENT_ID_GOOGLE pour la version hébergée).\n */\n\nconst CONFIG = {\n  NOM: 'Kerogo Tools Academy',\n  NOM_ARTICLE: 'la Kerogo Tools Academy',      // utilisé dans les phrases des messages Slack\n  SIGNATURE: 'Les bons réflexes IA, 5 minutes par jour',\n  // L'adresse de l'Académie (URL_APP) et l'identifiant client Google (CLIENT_ID_GOOGLE) se règlent\n  // dans Paramètres du projet > Propriétés du script : rien à modifier ici, et rien à perdre\n  // quand on recolle une nouvelle version de ce fichier.\n  URL_APP: '',\n  CLIENT_ID_GOOGLE: '',\n  // Organigramme (onglets « Eurecia_raw » et « Mapping ») : noms, postes et managers. Propriété ORGANIGRAMME_ID prioritaire.\n  ORGANIGRAMME_ID: '1xfwplMrA5ViYD8okzvL2vv0UZ-S3O1oqtdHZjLGxlho',\n  LIEN_CATALOGUE: 'https://kerogofinance.enterprise.slack.com/lists/T2VSWBF08/F0C8NKQFVHB',\n  CANAL_ANNONCES: 'C0AES0RVB1T',     // #kerogo-tools\n  ADMINS: ['k.bellnoun-momha@kerogo.com', 'o.gronow@keobiz.fr'],\n  // Liste de départ ; ensuite, elle se gère depuis l'espace admin\n  SITES: ['Paris', 'Rouen', 'Nantes', 'Marseille', 'Mulhouse', 'Douai - Waziers', 'Strasbourg', 'Courbevoie',\n          'Sélestat', 'Tunisie', 'Île Maurice', 'Madagascar', 'Saint-Etienne'],\n  // Sites offshore : un seul cabinet par site, affichés tels quels ; les sites français sont dissociés par cabinet (« Paris · Keobiz »)\n  SITES_OFFSHORE: ['Tunisie', 'Madagascar', 'Île Maurice'],\n  // Implantations : chaque cabinet dans sa ou ses villes (choix unique « Ville · Cabinet » à la première visite).\n  // Vérifié le 5 novembre 2026 (annonces du groupe, annuaires) : à compléter quand un cabinet ouvre une ville.\n  IMPLANTATIONS: [['Paris', 'Keobiz'], ['Rouen', 'Keobiz'], ['Sélestat', 'Audit Conseils'], ['Mulhouse', 'Audit Conseils'], ['Strasbourg', 'Audit Conseils'],\n    ['Douai - Waziers', 'Cabinet Joël Pruvost'], ['Courbevoie', 'ECLA · EXA alliance'], ['Paris', 'Cabinet Experfinance'], ['Paris', 'Cabinet Jacques Rozenbaum'],\n    ['Nantes', 'Ozeo'], ['Saint-Etienne', 'Tamet'], ['Marseille', 'Cabinet Arditti (AHA)'],\n    ['Tunisie', 'Tunisie'], ['Madagascar', 'Karlit (Madagascar)'], ['Île Maurice', 'Keorise (Maurice)']],\n  // Cabinets du groupe : ceux de la colonne « Pour qui » du catalogue Kerogo Tools\n  CABINETS: ['Keobiz', 'Audit Conseils', 'Cabinet Joël Pruvost', 'ECLA · EXA alliance', 'Cabinet Experfinance', 'Cabinet Jacques Rozenbaum',\n             'Karlit (Madagascar)', 'Ozeo', 'Tamet', 'Cabinet Arditti (AHA)', 'Tunisie', 'Keorise (Maurice)'],\n  // Anciens noms de cabinets encore présents dans le tableur : lus sous leur nom actuel (renommés le 5 novembre 2026)\n  ANCIENS_CABINETS: { 'Cabinet JR': 'Cabinet Jacques Rozenbaum', 'Offshore Tunisie': 'Tunisie' },\n  // Domaines de départ ; ensuite, ils se gèrent dans l'admin (onglet Accès)\n  DOMAINES: ['kerogo.com', 'keobiz.fr', 'ozeo.com'],\n  TYPES_CONTENU: ['Article', 'Focus compétence', 'Quiz du mois', 'Cas du mois'],\n  TITRE_LIVE: 'Kerogo Tools webinar',  // début du titre des événements Google Agenda des lives\n  LISTE_INSCRIPTIONS_WEBINAIRE: 'F0CC4J96A3S',\n  // Charte officielle (Google Doc) : l'Académie la lit, sans en garder de copie. Modifiable dans Admin › Réglages.\n  CHARTE_DOC_ID: '18_kK21TdcbudqShWeUbAu5AA6FR3KLf8UxQZGeoOpb4',\n  // Accusés de réception de la charte et certifications du niveau 1 : archivés dans le Drive partagé « Automatisations »\n  // (modifiables dans Admin › Réglages)\n  DOSSIER_ACCUSES_CHARTE: '1L9BUPnVOvlRbEe2bZgNrLyGglQWWgBLT',\n  DOSSIER_CERTIFICATIONS: '1xpqmbOsMf76TkbLATi6fqvzWj78l_OEd',\n  SIGNATAIRE: 'Hugues Husson De Sampigny',\n  SIGNATAIRE_FONCTION: 'Président de Kerogo Finance',   // liste Slack lue par le script des webinaires (colonnes Participant et Événement)\n  LISTE_CATALOGUE: 'F0C8NKQFVHB',      // Catalogue Kerogo Tools (liste Slack)\n  LIEN_ELEMENT_CATALOGUE: 'https://kerogofinance.enterprise.slack.com/lists/T2VSWBF08/F0C8NKQFVHB?record_id=',\n\n  // Rédaction automatique : active dès que la propriété ANTHROPIC_API_KEY existe\n  JOUR_GENERATION: 20,               // le 20, brouillons du mois suivant\n  MODELE_CLAUDE: 'claude-sonnet-5-5',\n\n  // Sécurité : tant que le mode test est actif, relances et publications ne partent\n  // que vers EMAIL_TEST. Il se désactive aussi depuis l'espace admin.\n  MODE_TEST: true,\n  EMAIL_TEST: 'k.bellnoun-momha@kerogo.com',\n\n  JOURS_AVANT_RELANCE_CHARTE: 4,     // jours ouvrés (hors week-ends et jours fériés) après l'inscription\n  JOURS_INACTIVITE: 4,               // jours ouvrés sans visite\n  JOURS_ENTRE_RELANCES: 7,           // au plus une relance de chaque type par semaine\n  JOURS_OUVRES_AVANT_RAPPEL: 2,      // lundi → mercredi, jeudi → lundi, vendredi → mardi\n  INVITATIONS_PAR_JOUR: 40,\n  HEURE_ROUTINE: 9\n};\n\nconst URL_ICONE = 'https://dev-ops-kerogo.github.io/kerogo-tools-academy/favicon-chapeau-64.png';\nconst XP_MISSION = 50;\nconst XP_BADGE = 100;\nconst XP_LIVE = 30;\nconst XP_QUIZ_PAR_BONNE = 10;      // quiz du mois : 10 XP par bonne réponse, à la première partie du mois\nconst LETTRES = ['A', 'B', 'C'];\n\n/* Parcours en 6 niveaux de 4 missions, à suivre à son rythme et dans l'ordre. Une date d'ouverture peut être réglée par niveau dans l'admin (onglet Missions) ; sans date, le niveau s'ouvre dès qu'il est prêt. */\nconst NIVEAUX = [\n  { num: 1, titre: 'Les bons réflexes', badge: 'Découvreur', missions: ['1.1', '1.2', '1.3', '1.4'] },\n  { num: 2, titre: 'Bien utiliser Slackbot', badge: 'Utilisateur', missions: ['2.1', '2.2', '2.3', '2.4'] },\n  { num: 3, titre: 'Les compétences Kerogo Tools', badge: 'Efficace', missions: ['3.1', '3.2', '3.3', '3.4'] },\n  { num: 4, titre: 'Automatiser', badge: 'Autonome', missions: ['4.1', '4.2', '4.3', '4.4'] },\n  { num: 5, titre: 'L’IA dans ton métier', badge: 'Expert', missions: ['5.1', '5.2', '5.3', '5.4'] },\n  { num: 6, titre: 'Créateurs', badge: 'Créateur', missions: ['6.1', '6.2', '6.3', '6.4'] }\n];\n\n// dispo: true = contenu prêt ; seuil = bonnes réponses minimum pour valider\nconst MISSIONS = {\n  '1.1': { titre: \"L'IA, la loi et notre charte\", dispo: true, minutes: 5, seuil: 2, total: 3, objectif: 'Connaître les outils autorisés et les règles de la charte' },\n  '1.2': { titre: 'Anonymiser avant de demander', dispo: true, minutes: 5, seuil: 2, total: 3, objectif: 'Retirer d’une demande tout ce qui permet de reconnaître quelqu’un' },\n  '1.3': { titre: 'Hallucinations et biais', dispo: true, minutes: 5, seuil: 3, total: 5, objectif: 'Repérer une réponse inventée par l’IA et la vérifier' },\n  '1.4': { titre: 'Quel outil pour quoi', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Choisir le bon outil d’IA pour chaque tâche' },\n  '2.1': { titre: 'La méthode des 5 C', dispo: true, minutes: 5, seuil: 6, total: 8, objectif: 'Écrire une demande claire et complète, avec un exemple' },\n  '2.2': { titre: 'Affiner et éviter les pièges', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Corriger une réponse en une phrase et éviter les demandes qui partent mal' },\n  '2.3': { titre: 'Résumer et retrouver', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Faire résumer un canal ou un fil et retrouver une information' },\n  '2.4': { titre: 'Analyser un document', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Faire analyser un PDF, un tableau ou une image par Slackbot' },\n  '3.1': { titre: 'Trouver la bonne compétence', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Savoir ce qu’est une compétence et où la trouver' },\n  '3.2': { titre: 'Les outils de ton quotidien', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Reconnaître les quatre façons de lancer un outil Kerogo Tools' },\n  '3.3': { titre: 'Bien utiliser une compétence', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Lancer la bonne compétence avec les bonnes informations' },\n  '3.4': { titre: 'Les astuces d’expert', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Utiliser les fonctions de Slackbot qui font gagner du temps' },\n  '4.1': { titre: 'Les tâches planifiées', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Confier à Slackbot des tâches qui reviennent' },\n  '4.2': { titre: 'Les tâches déclenchées', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Faire réagir Slackbot à un message, une réaction ou une liste' },\n  '4.3': { titre: 'Slackbot passe à l’action', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Confier à Slackbot des actions dans Slack, tes brouillons et ton agenda' },\n  '4.4': { titre: 'Proposer une automatisation', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Décrire un besoin pour que l’équipe Dev Ops puisse l’automatiser' },\n  '5.1': { titre: 'Comptabilité et Pennylane', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Connaître les automatisations comptables et ce qui reste à contrôler' },\n  '5.2': { titre: 'Social et paie', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Connaître les automatismes de la paie et réagir à leurs signaux' },\n  '5.3': { titre: 'Juridique et fiscal', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Utiliser les outils juridiques et fiscaux prêts à l’emploi' },\n  '5.4': { titre: 'La relation client', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Gagner du temps avec Ker’Meet, les courriers et la synthèse des comptes' },\n  '6.1': { titre: 'Créer ta compétence', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Créer une compétence Slackbot pour une tâche qui revient' },\n  '6.2': { titre: 'Obtenir le label Kerogo Tools', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Préparer sa compétence pour la revue et obtenir le label' },\n  '6.3': { titre: 'Devenir champion IA', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Partager les bonnes pratiques et orienter vers la bonne documentation' },\n  '6.4': { titre: 'Tester un outil en pilote', dispo: true, minutes: 5, seuil: 5, total: 7, objectif: 'Tester un nouvel outil sur le terrain et donner son avis métier' }\n};\n\n/* Date d'ouverture de chaque niveau ({ '2': 'AAAA-MM-JJ', … }) ; sans date, le niveau est ouvert */\nfunction ouvertures_() { return lireListe_('OUVERTURES', {}); }\nfunction niveauDe_(id) { return Number(String(id).split('.')[0]); }\nfunction ouvreLe_(id) {\n  const d = ouvertures_()[String(niveauDe_(id))];\n  if (!d) return '';\n  return d > Utilities.formatDate(new Date(), 'Europe/Paris', 'yyyy-MM-dd') ? d : '';\n}\n/* Une mission est disponible quand son contenu est prêt et que son niveau est ouvert */\nfunction dispo_(id) { return !!(MISSIONS[id] && MISSIONS[id].dispo && !ouvreLe_(id)); }\n\n\nconst ONGLETS = {\n  Calendrier: ['Date', 'Type', 'Titre', 'Texte', 'Lien', 'Publié le', 'Statut'],\n  Joueurs: ['Email', 'Prénom', 'Site', 'XP', 'Inscrit le', 'Dernière visite', 'Charte validée le', 'Slack ID', 'Thème', 'Résumé', 'Cabinet', 'Charte version', 'Accusé charte', 'Certification niveau 1'],\n  Progression: ['Email', 'Mission', 'Statut', 'Meilleur score', 'Total', 'Tentatives', 'Réussie le'],\n  Journal: ['Date', 'Email', 'Prénom', 'Site', 'Action', 'XP'],\n  Relances: ['Date', 'Email', 'Type'],\n  Quiz: ['Mois', 'Question', 'Choix A', 'Choix B', 'Choix C', 'Bonne réponse', 'Explication', 'Statut'],\n  Notes: ['Date', 'Note', 'Utilisée le'],\n  Retours: ['Date', 'Email', 'Site', 'Mission', 'Utile', 'Usage compétences'],\n  // Écritures des collaborateurs, ajoutées sans verrou puis reportées par consoliderEcritures\n  'Écritures': ['Date', 'Email', 'Type', 'Données', 'Traitée le'],\n  'Journal technique': ['Date', 'Fonction', 'Durée (s)', 'Détail'],\n  // Un exemplaire par document : produit une fois, archivé, puis toujours le même fichier\n  Documents: ['Date', 'Email', 'Document', 'Version', 'Lu le', 'Fichier', 'Produit le'],\n  // Première apparition de chaque personne dans l'organigramme (l'organigramme n'a pas de date d'entrée)\n  'Arrivées': ['Email', 'Vu le']\n};\n\n/* ------------------------------------------------------------------ */\n/* Application web                                                     */\n/* ------------------------------------------------------------------ */\n\n/* La page arrive avec les données du joueur déjà dedans (si elles sont en cache) : pas\n   d'aller-retour avant l'affichage. Les « / » et « < » des données sont échappés, car Google\n   coupe tout ce qui suit « // » sur une ligne de script. En cas de souci, la page part seule. */\nfunction doGet() {\n  const debut = Date.now();\n  let page = HtmlService.createHtmlOutputFromFile('Index');\n  const contenu = page.getContent();\n  if (contenu.indexOf('<!DOCTYPE html>') === -1) {\n    throw new Error(\"Le fichier Index.html ne contient pas la page de l'Académie. Ouvrez-le dans Apps Script, effacez tout et collez-y le contenu de Index.html, qui commence par <!DOCTYPE html>.\");\n  }\n  let etat = null;\n  try {\n    const email = (Session.getActiveUser().getEmail() || '').toLowerCase();\n    if (email) etat = etatCacheSeul_(email);\n    if (etat) {\n      const json = JSON.stringify(etat).replace(/</g, '\\\\u003c').replace(/\\//g, '\\\\/')\n        .replace(/\\u2028/g, '\\\\u2028').replace(/\\u2029/g, '\\\\u2029');\n      page = HtmlService.createHtmlOutput(contenu.replace('window.ETAT_INITIAL = null;', function () { return 'window.ETAT_INITIAL = ' + json + ';'; }));\n    }\n  } catch (e) {\n    console.warn('Page envoyée sans données intégrées : ' + e.message);\n    page = HtmlService.createHtmlOutputFromFile('Index');\n  }\n  console.log('doGet · données intégrées : ' + (etat ? 'oui' : 'non') + ' · ' + (Date.now() - debut) + ' ms');\n  return page\n    .setTitle(CONFIG.NOM + ' · ' + CONFIG.SIGNATURE)\n    .setFaviconUrl(URL_ICONE)   // Apps Script n'accepte pas d'image intégrée : l'icône est servie par GitHub Pages\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n}\n\n/* ------------------------------------------------------------------ */\n/* API de la version hébergée : la page appelle doPost avec un jeton    */\n/* Google, vérifié ici avant d'exécuter l'action au nom de la personne. */\n/* À déployer comme une application web séparée, accès « Tout le monde ». */\n/* ------------------------------------------------------------------ */\n\nlet EMAIL_API_ = null;\nconst ACTIONS_API = ['getEtat', 'noterVisite', 'choisirSite', 'choisirTheme', 'terminerMission', 'getQuizMois', 'terminerQuizMois',\n  'enregistrerRetour', 'getEquipe', 'exporterAttestations', 'ajouterAcces', 'retirerAcces', 'ajouterDomaine', 'retirerDomaine', 'definirOuverture', 'rafraichirOrganigramme',\n  'getAdmin', 'ajouterContenu', 'publierMaintenant', 'supprimerContenu', 'validerContenu', 'modifierContenu', 'apercuSlack',\n  'validerQuiz', 'ajouterNote', 'genererMaintenant', 'ajouterQuestion', 'supprimerQuestion', 'enregistrerVideo',\n  'ajouterSite', 'renommerSite', 'supprimerSite', 'basculerModeTest', 'compterEcrituresCharge', 'listerEcrituresCharge', 'bilanCopieFs', 'mesureConsoFs', 'getCatalogue',\n  'getWebinaires', 'inscrireWebinaire', 'rejoindreWebinaire',\n  'getCharte', 'signerCharte', 'relireCharte', 'definirCharte',\n  'telechargerDocument', 'getDocumentsAdmin', 'definirReglagesDocuments', 'relancerCharte', 'definirLancement'];\n\nfunction doPost(e) {\n  let reponse;\n  try {\n    const corps = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    if (ACTIONS_API.indexOf(corps.action) === -1) throw new Error('Action inconnue.');\n    if (corps.charge) EMAIL_API_ = emailCharge_(corps);\n    else {\n      if (/^(compter|lister)EcrituresCharge$|^(bilanCopieFs|mesureConsoFs)$/.test(corps.action)) throw new Error('Action réservée au test de charge.');\n      EMAIL_API_ = emailDepuisJeton_(corps.jeton);\n    }\n    reponse = { ok: true, data: globalThis[corps.action].apply(null, corps.args || []) };\n  } catch (err) {\n    reponse = { ok: false, erreur: err.message };\n  } finally {\n    EMAIL_API_ = null;\n    MODE_CHARGE_ = false;\n  }\n  return ContentService.createTextOutput(JSON.stringify(reponse)).setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ------------------------------------------------------------------ */\n/* Test de charge (outils/tests/charge.mjs)                            */\n/* Actif seulement si les propriétés CLE_CHARGE et TABLEUR_CHARGE      */\n/* existent. Les appels portent la clé et une fausse adresse           */\n/* …@charge.test : ils lisent et écrivent dans la copie du tableur,    */\n/* avec un cache à part. Les vrais collaborateurs ne sont pas touchés. */\n/* Supprimer CLE_CHARGE après le test.                                 */\n/* ------------------------------------------------------------------ */\nlet MODE_CHARGE_ = false;\nfunction emailCharge_(corps) {\n  const props = PropertiesService.getScriptProperties();\n  const cle = props.getProperty('CLE_CHARGE'), tableur = props.getProperty('TABLEUR_CHARGE');\n  if (!cle || !tableur || corps.charge !== cle) throw new Error('Test de charge non autorisé.');\n  const email = String(corps.email || '').toLowerCase();\n  if (!/^[a-z0-9.-]+@charge\\.test$/.test(email)) throw new Error('Adresse de test invalide.');\n  MODE_CHARGE_ = true;\n  return email;\n}\n/* Lignes d'un lot du test de charge : [adresse, type, clé] (une ligne = une écriture), pour la vérification exacte */\nfunction listerEcrituresCharge(lot) {\n  if (!MODE_CHARGE_) throw new Error('Action réservée au test de charge.');\n  const sh = feuille_('Écritures'), n = sh.getLastRow() - 1;\n  if (n < 1) return [];\n  return sh.getRange(2, 2, n, 3).getValues().filter(function (l) { return String(l[0]).indexOf(String(lot) + '-') === 0; })\n    .map(function (l) { let d = {}; try { d = JSON.parse(l[2] || '{}'); } catch (e) { } return [String(l[0]), String(l[1]), d.cle || '']; });\n}\nfunction compterEcrituresCharge() {\n  if (!MODE_CHARGE_) throw new Error('Action réservée au test de charge.');\n  return Math.max(0, feuille_('Écritures').getLastRow() - 1);\n}\n/* Cache du script ; pendant le test de charge, des clés à part */\nfunction cache_() {\n  const c = CacheService.getScriptCache();\n  if (!MODE_CHARGE_) return c;\n  const k = function (x) { return 'CH_' + x; };\n  return {\n    get: function (x) { return c.get(k(x)); },\n    put: function (x, v, t) { return c.put(k(x), v, t); },\n    remove: function (x) { return c.remove(k(x)); },\n    getAll: function (xs) { const r = c.getAll(xs.map(k)), o = {}; xs.forEach(function (x) { if (r[k(x)] != null) o[x] = r[k(x)]; }); return o; },\n    putAll: function (o, t) { const q = {}; Object.keys(o).forEach(function (x) { q[k(x)] = o[x]; }); return c.putAll(q, t); },\n    removeAll: function (xs) { return c.removeAll(xs.map(k)); }\n  };\n}\n\n/* Vérifie le jeton de connexion Google : bon identifiant client, adresse vérifiée, domaine du groupe */\nfunction emailDepuisJeton_(jeton) {\n  if (!clientIdGoogle_()) throw new Error('Version hébergée non configurée : ajoutez la propriété du script CLIENT_ID_GOOGLE.');\n  if (!jeton) throw new Error('Connexion requise.');\n  const cle = 'T_' + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, jeton)).slice(0, 40);\n  const cache = cache_();\n  const connu = cache.get(cle);\n  if (connu) return connu;\n  const r = UrlFetchApp.fetch('https://oauth2.googleapis.com/tokeninfo?id_token=' + encodeURIComponent(jeton), { muteHttpExceptions: true });\n  if (r.getResponseCode() !== 200) throw new Error('Session expirée : reconnecte-toi.');\n  const info = JSON.parse(r.getContentText());\n  const email = String(info.email || '').toLowerCase();\n  if (info.aud !== clientIdGoogle_()) throw new Error('Jeton non reconnu.');\n  if (String(info.email_verified) !== 'true') throw new Error('Adresse Google non vérifiée.');\n  if (domaines_().indexOf(email.split('@')[1]) === -1) throw new Error(\"Cette adresse (\" + email.split('@')[1] + \") n'a pas encore accès à l'Académie : écris à l'équipe Dev Ops dans #kerogo-tools.\");\n  const reste = Math.max(60, Math.min(3600, Number(info.exp) - Math.floor(Date.now() / 1000) - 30));\n  cache.put(cle, email, reste);\n  return email;\n}\n\nfunction getEtat() {\n  SANS_SLACK_ = true;   // getEtat ne doit jamais attendre Slack\n  const debut = Date.now();\n  const email = emailCourant_();\n  let source = 'cache', perso = lirePerso_(email);\n  if (!perso) {\n    const j = ligneJoueur_(email);\n    if (j) { perso = persoDepuisJoueur_(email, j); appliquerEnAttente_(email, perso); source = 'ligne'; }\n    else {\n      perso = persoDepuisJoueur_(email, joueurNeuf_(email));\n      appliquerEnAttente_(email, perso);   // inscription pas encore consolidée : ses écritures comptent déjà\n      ecrire_(email, 'creation', { prenom: perso.joueur.prenom });   // vaut aussi première visite\n      cache_().put('V_' + cleCache_(email), '1', 21600);\n      source = 'nouveau';\n    }\n    garderPerso_(email, perso);\n  }\n  noterVisite();\n  const etat = serialiser_(assembler_(perso));\n  console.log('getEtat · ' + email + ' · ' + source + ' · ' + (Date.now() - debut) + ' ms');\n  return etat;\n}\n\n/* Date de visite : une écriture au plus toutes les 6 heures ; reportée par consoliderEcritures */\nfunction noterVisite() {\n  const email = emailCourant_();\n  const cache = cache_();\n  if (cache.get('V_' + cleCache_(email))) return true;\n  try { ecrire_(email, 'visite', {}); } catch (e) { return false; }\n  cache.put('V_' + cleCache_(email), '1', 21600);\n  return true;\n}\n\n/* Identifiant Slack et prénom d'un nouveau collaborateur : cherchés par la consolidation, jamais pendant getEtat */\nfunction infosSlack_(email) {\n  if (estTest_(email)) return null;\n  try {\n    const r = slack_('users.lookupByEmail', { email: email }, true);\n    if (!r.ok) return null;\n    return { id: r.user.id, prenom: (r.user.profile && (r.user.profile.first_name || (r.user.profile.real_name || '').split(' ')[0])) || '' };\n  } catch (e) { console.warn('Slack indisponible pour ' + email + ' : ' + e.message); return null; }\n}\n\n/* Site et cabinet : choisis ensemble à la première visite, modifiables dans Mon profil */\nfunction choisirSite(site, cabinet) {\n  if (sites_().indexOf(site) === -1) throw new Error('Site inconnu.');\n  if (cabinet && CONFIG.CABINETS.indexOf(cabinet) === -1) throw new Error('Cabinet inconnu.');\n  const email = emailCourant_();\n  const perso = persoCourant_(email);\n  ecrire_(email, 'site', { site: site, cabinet: cabinet || '' });\n  perso.joueur.site = site;\n  if (cabinet) perso.joueur.cabinet = cabinet;\n  garderPerso_(email, perso);\n  return serialiser_(assembler_(perso));\n}\n\nfunction choisirTheme(theme) {\n  const email = emailCourant_();\n  theme = theme === 'jour' ? 'jour' : 'sombre';\n  ecrire_(email, 'theme', { theme: theme });\n  const perso = lirePerso_(email);\n  if (perso) { perso.joueur.theme = theme; garderPerso_(email, perso); }\n  return true;\n}\n\n/**\n * Enregistre une partie. bonnes / total viennent de l'interface ; charteLue n'est plus utilisé (la charte se signe à l'étape 0).\n * avis : réponses aux questions de fin (envoyées avec la mission, en un seul appel) ;\n * cle : identifiant de l'envoi, pour ne pas compter deux fois une nouvelle tentative.\n * Aucun verrou : une ligne est ajoutée à « Écritures », l'état de la personne est mis à jour dans le cache.\n */\nfunction terminerMission(id, bonnes, total, charteLue, avis, cle) {\n  const m = MISSIONS[id];\n  if (!m || (!dispo_(id) && !estAdmin_(emailCourant_()))) throw new Error(ouvreLe_(id) ? 'Ce niveau s’ouvre le ' + Utilities.formatDate(new Date(ouvreLe_(id) + 'T12:00:00'), 'Europe/Paris', 'dd/MM') + '.' : 'Mission indisponible.');\n  bonnes = Math.max(0, Math.min(Number(bonnes) || 0, m.total));\n  const email = emailCourant_();\n  const perso = persoCourant_(email);\n  const toutes = [].concat.apply([], perso.niveaux.map(function (n) { return n.missions; }));\n  const cible = toutes.filter(function (x) { return x.id === id; })[0];\n  const manquante = cible && cible.reussie ? null : (toutes.slice(0, toutes.indexOf(cible)).filter(function (x) { return !x.reussie; })[0] || null);\n  if (manquante && !estAdmin_(email)) throw new Error('Termine d’abord la mission ' + manquante.id + ' : les missions se font dans l’ordre.');\n  if (manquante) {\n    // Un administrateur peut tout tester : le résultat est calculé mais rien n'est enregistré\n    const test = assembler_(perso);\n    test.resultat = { reussie: bonnes >= m.seuil, xpGagne: 0, nouveauBadge: null, premiereFois: false, test: true };\n    return serialiser_(test);\n  }\n  const resultat = appliquerMissionPerso_(perso, id, bonnes, m.total, charteLue === true, new Date());\n  // Niveau 1 terminé avec la charte en vigueur signée : la certification est enregistrée (sinon, en attente de la signature)\n  const enVigueur = PropertiesService.getScriptProperties().getProperty('CHARTE_VERSION') || '';\n  const lignes = [ligneEcriture_(email, 'mission', { id: id, bonnes: bonnes, total: m.total, charte: charteLue === true, avis: avis || null, cle: String(cle || '') })];\n  if (resultat.premiereFois && niveauDe_(id) === 1 && perso.niveaux[0].complet && enVigueur && perso.joueur.charteVersion === enVigueur) {\n    const doc = documentANoter_(perso, email, 'certification', enVigueur, new Date(), '');\n    if (doc) lignes.push(doc);\n  }\n  ajouterSousVerrou_(lignes);   // sinon : « à réessayer », rien n'est gardé dans le cache\n  garderPerso_(email, perso);\n  const etat = assembler_(perso);\n  etat.resultat = resultat;\n  return serialiser_(etat);\n}\n\n/* Applique une mission à l'état d'une personne (même calcul que dans la page) */\nfunction appliquerMissionPerso_(perso, id, bonnes, total, charteLue, date) {\n  const m = MISSIONS[id];\n  const r = { reussie: bonnes >= m.seuil, xpGagne: 0, nouveauBadge: null, premiereFois: false };\n  const n = perso.niveaux.filter(function (x) { return x.missions.some(function (y) { return y.id === id; }); })[0];\n  const mi = n.missions.filter(function (y) { return y.id === id; })[0];\n  mi.score = { meilleur: Math.max(bonnes, mi.score ? mi.score.meilleur : 0), total: total };\n  if (r.reussie && !mi.reussie) {\n    mi.reussie = true; mi.reussieLe = dateIso_(date);\n    r.premiereFois = true; r.xpGagne = XP_MISSION;\n    n.faites = n.missions.filter(function (y) { return y.reussie; }).length; n.complet = n.faites === n.missions.length;\n    // Le badge Découvreur demande aussi la charte signée (étape 0)\n    if (n.complet && (n.num !== 1 || perso.joueur.charte)) { r.nouveauBadge = n.badge; r.xpGagne += XP_BADGE; }\n    perso.joueur.xp += r.xpGagne;\n    perso.niveauCourant = (perso.niveaux.filter(function (x) { return !x.complet; })[0] || perso.niveaux[perso.niveaux.length - 1]).num;\n    perso.prochaine = prochaineMission_(perso.niveaux);\n  }\n  return r;\n}\n\n/* Ce qui est identique pour tous les joueurs : calculé une fois, gardé 60 secondes */\nfunction partages_() {\n  const cache = cache_();\n  const enCache = cache.get('PARTAGES');\n  if (enCache) return JSON.parse(enCache);\n  if (!EN_LOT_ && !MODE_CHARGE_) {\n    const secours = PropertiesService.getScriptProperties().getProperty('SECOURS_PARTAGES');\n    if (secours) { cache.put('PARTAGES', secours, 21600); return JSON.parse(secours); }\n  }\n  const journal = lignes_('Journal', 3000).filter(function (e) { return !estTest_(e.Email); });\n  const lundi = debutSemaine_();\n  const parSite = {};\n  journal.forEach(function (e) {\n    if (e.Site && e.Date && new Date(e.Date) >= lundi) { const s = siteDuJournal_(e); parSite[s] = (parSite[s] || 0) + (Number(e.XP) || 0); }\n  });\n  const maintenant = new Date();\n  const res = serialiser_({\n    ligue: Object.keys(parSite).map(function (s) { return { site: s, xp: parSite[s] }; }).sort(function (a, b) { return b.xp - a.xp; }),\n    direct: journal.slice(-10).reverse().map(function (e) { return { prenom: e['Prénom'], site: siteDuJournal_(e), action: e.Action, date: dateIso_(e.Date) }; }),\n    aLaUne: lignes_('Calendrier').filter(function (c) { return c['Publié le']; }).slice(-3).reverse()\n      .map(function (c) { return { type: c.Type, titre: c.Titre, texte: c.Texte, lien: c.Lien, date: dateIso_(c.Date) }; }),\n    kerogoat: meilleurDuMois_(journal, maintenant.getFullYear(), maintenant.getMonth()),\n    semaine: (function () {\n      const r = { missions: 0, chartes: 0, actifs: {} };\n      journal.forEach(function (e) {\n        if (!e.Date || new Date(e.Date) < lundi) return;\n        if (/a validé la mission/.test(e.Action)) r.missions++;\n        if (/a validé la charte/.test(e.Action)) r.chartes++;\n        r.actifs[e.Email] = true;\n      });\n      return { missions: r.missions, chartes: r.chartes, actifs: Object.keys(r.actifs).length };\n    })(),\n    finSemaine: dateIso_(new Date(lundi.getTime() + 7 * 86400000 - 1000))\n  });\n  const json = JSON.stringify(res);\n  cache.put('PARTAGES', json, 21600);\n  if (!MODE_CHARGE_ && json.length < 8500) PropertiesService.getScriptProperties().setProperty('SECOURS_PARTAGES', json);\n  return res;\n}\n\nfunction viderPartages_() { cache_().remove('PARTAGES'); PropertiesService.getScriptProperties().deleteProperty('SECOURS_PARTAGES'); }\n\n/* Les missions se font dans l'ordre : la prochaine est la première non réussie, si elle est déjà disponible */\nfunction prochaineMission_(niveaux) {\n  const suivante = [].concat.apply([], niveaux.map(function (n) { return n.missions; })).filter(function (m) { return !m.reussie; })[0];\n  return suivante && suivante.dispo ? suivante : null;\n}\n\nfunction partiePersoDepuis_(email, j, niveaux, courant, prochaine, quiz) {\n  return serialiser_({\n    nom: CONFIG.NOM,\n    signature: CONFIG.SIGNATURE,\n    admin: estAdmin_(email),\n    manager: estAdmin_(email) || !!managers_()[email] || estManagerOrg_(email),\n    joueur: { email: email, prenom: j['Prénom'], nom: nomDe_(email), site: j.Site || '', cabinet: cabinetActuel_(j.Cabinet), xp: Number(j.XP) || 0, theme: j['Thème'] || 'sombre',\n      charte: !!j['Charte validée le'], charteVersion: String(j['Charte version'] || '').replace(/^'/, ''), charteLe: dateIso_(j['Charte validée le']) },\n    niveaux: niveaux,\n    niveauCourant: courant.num,\n    prochaine: prochaine,\n    quiz: quiz,\n    videos: videos_(),\n    sites: sites_(),\n    cabinets: CONFIG.CABINETS,\n    implantations: CONFIG.IMPLANTATIONS,\n    documents: documentsDe_(j),\n    liens: { catalogue: CONFIG.LIEN_CATALOGUE }\n  });\n}\n\n/* ------------------------------------------------------------------ */\n/* Cache des pages : l'Académie s'affiche sans relire le tableur       */\n/* ------------------------------------------------------------------ */\n\nconst VERSION_CODE = '2026-11-05f';\nconst DUREE_PERSO = 3600;   // état de chaque personne gardé 1 heure (préparé à nouveau chaque heure)\n\nfunction cleCache_(email) { return Utilities.base64EncodeWebSafe(email).replace(/=+$/, ''); }\n\nfunction clePerso_(email) {\n  const v = PropertiesService.getScriptProperties().getProperty('VERSION_ETAT') || '0';\n  return 'J_' + VERSION_CODE + '_' + v + '_' + moisCourant_() + '_' + cleCache_(email);\n}\n\n/* À appeler quand un changement touche tous les joueurs (sites, quiz, vidéos, XP des lives) */\nfunction nouvelleVersionEtat_() {\n  const p = PropertiesService.getScriptProperties();\n  p.setProperty('VERSION_ETAT', String((Number(p.getProperty('VERSION_ETAT')) || 0) + 1));\n  // Les accueils sont préparés à nouveau une minute plus tard, sans ralentir l'action en cours\n  if (!p.getProperty('PRECHAUFFAGE_PREVU')) {\n    try {\n      ScriptApp.newTrigger('prechaufferApresChangement').timeBased().after(60 * 1000).create();\n      p.setProperty('PRECHAUFFAGE_PREVU', new Date().toISOString());\n    } catch (e) { console.warn('Préchauffage non programmé : ' + e.message); }\n  }\n}\n\nfunction prechaufferApresChangement() {\n  if (!versionActivee_()) return;\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (t.getHandlerFunction() === 'prechaufferApresChangement') ScriptApp.deleteTrigger(t);\n  });\n  PropertiesService.getScriptProperties().deleteProperty('PRECHAUFFAGE_PREVU');\n  prechaufferCaches();\n}\n\n/* Déclencheur horaire : prépare l'accueil de chaque collaborateur à l'avance, à partir de la colonne Résumé */\nfunction prechaufferCaches() {\n  if (!versionActivee_()) return;\n  const debut = Date.now();\n  EN_LOT_ = true;\n  // Filet de sécurité : la consolidation des écritures doit tourner toutes les 5 minutes\n  const declencheurs = ScriptApp.getProjectTriggers().map(function (t) { return t.getHandlerFunction(); });\n  if (declencheurs.indexOf('consoliderEcritures') === -1) ScriptApp.newTrigger('consoliderEcritures').timeBased().everyMinutes(5).create();\n  if (declencheurs.indexOf('envoyerInscriptionsWebinaire') === -1) ScriptApp.newTrigger('envoyerInscriptionsWebinaire').timeBased().everyMinutes(1).create();\n  if (declencheurs.indexOf('archiverAttestations') === -1) ScriptApp.newTrigger('archiverAttestations').timeBased().everyMinutes(15).create();\n  // Chaque heure : les publications programmées à une heure précise partent aussi\n  try { publierCalendrier(); } catch (e) { console.warn('Publication : ' + e.message); }\n  viderPartages_();\n  partages_();\n  try { preparerCatalogue_(); } catch (e) { console.warn('Catalogue : ' + e.message); }\n  try { webinairesCommuns_(true); } catch (e) { console.warn('Webinaires : ' + e.message); }\n  try { lireCharte_(); } catch (e) { console.warn('Charte : ' + e.message); }   // remplace le cache seulement si la lecture réussit\n  // Firestore (si activé) : documents communs, rôles et relevé de consommation\n  if (firestoreActif_()) {\n    try { publierPublics_(); } catch (e) { console.warn('Publication Firestore : ' + e.message); }\n    try { pousserRolesFs_(); } catch (e) { console.warn('Rôles Firestore : ' + e.message); }\n    try { releverConsommation(); } catch (e) { console.warn('Consommation Firestore : ' + e.message); }\n  }\n  const cache = cache_();\n  let lot = {}, n = 0;\n  lignes_('Joueurs').forEach(function (j) {\n    const email = String(j.Email || '').toLowerCase();\n    if (!email || Date.now() - debut > LIMITE_LOT_MS) return;\n    try { lot[clePerso_(email)] = JSON.stringify(persoDepuisJoueur_(email, j)); n++; }\n    catch (e) { console.warn('Préchauffage impossible pour ' + email + ' : ' + e.message); }\n    if (Object.keys(lot).length >= 50) { cache.putAll(lot, DUREE_PERSO); lot = {}; }\n  });\n  if (Object.keys(lot).length) cache.putAll(lot, DUREE_PERSO);\n  noterDuree_('prechaufferCaches', debut, n + ' collaborateurs');\n}\n\n/* Comme etatDepuisCache_, mais sans jamais lire le tableur : sert à doGet, qui doit rester instantané */\nfunction etatCacheSeul_(email) {\n  const cache = cache_();\n  const vals = cache.getAll([clePerso_(email), 'PARTAGES']);\n  if (!vals[clePerso_(email)]) return null;\n  if (!vals.PARTAGES) { const secours = PropertiesService.getScriptProperties().getProperty('SECOURS_PARTAGES'); if (!secours) return null; vals.PARTAGES = secours; }\n  const perso = JSON.parse(vals[clePerso_(email)]), commun = JSON.parse(vals.PARTAGES);\n  const etat = {};\n  Object.keys(perso).forEach(function (k) { etat[k] = perso[k]; });\n  ['ligue', 'semaine', 'aLaUne', 'kerogoat', 'finSemaine'].forEach(function (k) { etat[k] = commun[k]; });\n  const props = PropertiesService.getScriptProperties();\n  etat.charteEnVigueur = { version: props.getProperty('CHARTE_VERSION') || '', mots: Number(props.getProperty('CHARTE_MOTS')) || 0 };\n  return etat;\n}\n\nfunction lirePerso_(email) {\n  const enCache = cache_().get(clePerso_(email));\n  return enCache ? JSON.parse(enCache) : null;\n}\nfunction garderPerso_(email, perso) {\n  try { cache_().put(clePerso_(email), JSON.stringify(perso), DUREE_PERSO); } catch (e) { /* trop gros : pas de cache */ }\n}\n/* État d'une personne déjà inscrite (ou en cours d'inscription) : cache, sinon sa ligne */\nfunction persoCourant_(email) {\n  let perso = lirePerso_(email);\n  if (perso) return perso;\n  const j = ligneJoueur_(email);\n  perso = persoDepuisJoueur_(email, j || joueurNeuf_(email));\n  appliquerEnAttente_(email, perso);\n  garderPerso_(email, perso);\n  return perso;\n}\n\nfunction assembler_(perso) {\n  const commun = partages_();\n  const etat = {};\n  Object.keys(perso).forEach(function (k) { etat[k] = perso[k]; });\n  // Charte en vigueur : version et nombre de mots (pour la durée de lecture), notés à chaque lecture du document\n  const props = PropertiesService.getScriptProperties();\n  etat.charteEnVigueur = { version: props.getProperty('CHARTE_VERSION') || '', mots: Number(props.getProperty('CHARTE_MOTS')) || 0 };\n  ['ligue', 'semaine', 'aLaUne', 'kerogoat', 'finSemaine'].forEach(function (k) { etat[k] = commun[k]; });\n  return etat;\n}\n\n/* ------------------------------------------------------------------ */\n/* Retours en fin de mission, vue manager, attestations, accès          */\n/* ------------------------------------------------------------------ */\n\n/* ------------------------------------------------------------------ */\n/* Organigramme : { email: { n: nom, p: poste, o: pôle, m: email du manager } }, gardé 6 h  */\n/* ------------------------------------------------------------------ */\nfunction annuaire_() {\n  if (ANNUAIRE_) return ANNUAIRE_;\n  const cache = cache_();\n  const connu = cache.get('ANNUAIRE_V1');\n  if (connu) return (ANNUAIRE_ = JSON.parse(connu));\n  const id = PropertiesService.getScriptProperties().getProperty('ORGANIGRAMME_ID') || CONFIG.ORGANIGRAMME_ID;\n  const a = {};\n  if (!id) return (ANNUAIRE_ = a);\n  try {\n    const ss = SpreadsheetApp.openById(id);\n    const lire = function (nom) {\n      const sh = ss.getSheetByName(nom);\n      if (!sh) return [];\n      const v = sh.getDataRange().getValues(), t = v.shift().map(function (x) { return String(x).trim(); });\n      return v.map(function (l) { const o = {}; t.forEach(function (k, i) { o[k] = l[i]; }); return o; });\n    };\n    lire('Eurecia_raw').forEach(function (r) {\n      const e = String(r.email || '').trim().toLowerCase();\n      if (/@/.test(e)) a[e] = { n: String(r.nom || '').trim(), p: String(r.poste || '').trim(), o: String(r.pole || '').trim(), m: '' };\n    });\n    lire('Mapping').forEach(function (r) {\n      const e = String(r.email || '').trim().toLowerCase(), m = String(r.email_manager || '').trim().toLowerCase();\n      if (!/@/.test(e)) return;\n      a[e] = a[e] || { n: '', p: '', o: '', m: '' };\n      if (/@/.test(m) && m !== e) a[e].m = m;\n      if (r.slack_id) a[e].s = String(r.slack_id).trim();\n    });\n    lire('Corrections').forEach(function (r) {\n      const e = String(r.email || '').trim().toLowerCase();\n      if (a[e] && r.slack_id_force) a[e].s = String(r.slack_id_force).trim();\n    });\n  } catch (err) {\n    console.warn('Organigramme illisible : ' + err.message);\n    return (ANNUAIRE_ = a);\n  }\n  const json = JSON.stringify(a);\n  if (json.length < 98000) cache.put('ANNUAIRE_V1', json, 21600);\n  return (ANNUAIRE_ = a);\n}\nlet ANNUAIRE_ = null;\n/* Profils Slack (identifiant et nom de famille), gardés 6 h */\nfunction profilsSlack_() {\n  const cache = cache_(), connu = cache.get('PROFILS_SLACK_V1');\n  if (connu) return JSON.parse(connu);\n  const p = {};\n  let curseur = '';\n  do {\n    const params = { limit: 200 };\n    if (curseur) params.cursor = curseur;\n    const r = slack_('users.list', params, true);\n    if (!r.ok) break;\n    r.members.forEach(function (u) {\n      const e = u.profile && u.profile.email ? u.profile.email.toLowerCase() : '';\n      if (!e || u.deleted || u.is_bot) return;\n      let nom = u.profile.last_name || '';\n      if (!nom && u.profile.real_name) { const morceaux = u.profile.real_name.trim().split(/\\s+/); nom = morceaux.slice(1).join(' ') || morceaux[0]; }\n      p[e] = { id: u.id, nom: nom };\n    });\n    curseur = r.response_metadata && r.response_metadata.next_cursor;\n  } while (curseur);\n  const json = JSON.stringify(p);\n  if (json.length < 98000) cache.put('PROFILS_SLACK_V1', json, 21600);\n  return p;\n}\n\nfunction normNom_(n) {\n  return String(n || '').toUpperCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/\\s+EP\\s+.*$/, '').replace(/[^A-Z]/g, '');\n}\n\n/* Relie chaque collaborateur de l'Académie à sa fiche de l'organigramme :\n   1. même adresse ; 2. même identifiant Slack ; 3. même début d'adresse (autre domaine) ;\n   4. même nom de famille (Slack), départagé par l'initiale du prénom. Gardé 6 h. */\nfunction rapprochements_() {\n  if (RAPPROCHEMENT_) return RAPPROCHEMENT_;\n  const cache = cache_(), connu = cache.get('RAPPROCHEMENT_V1');\n  if (connu) return (RAPPROCHEMENT_ = JSON.parse(connu));\n  const a = annuaire_(), r = { liens: {}, methodes: { email: 0, slack: 0, adresse: 0, nom: 0 }, sans: [] };\n  const parSlack = {}, parLocal = {}, parNom = {}, pris = {};\n  Object.keys(a).forEach(function (k) {\n    if (a[k].s) parSlack[a[k].s] = k;\n    const l = k.split('@')[0]; (parLocal[l] = parLocal[l] || []).push(k);\n    const n = normNom_(a[k].n); if (n) (parNom[n] = parNom[n] || []).push(k);\n  });\n  let slack = {}, complet = true;\n  if (SANS_SLACK_) {\n    // Pendant getEtat : seulement les profils Slack déjà en cache ; sinon, rapprochement partiel non gardé\n    const enCache = cache.get('PROFILS_SLACK_V1');\n    if (enCache) slack = JSON.parse(enCache); else complet = false;\n  } else {\n    try { slack = profilsSlack_(); } catch (e) { console.warn('Profils Slack indisponibles : ' + e.message); }\n  }\n  const joueurs = lignes_('Joueurs');\n  joueurs.forEach(function (j) { const e = String(j.Email).toLowerCase(); if (a[e]) { r.liens[e] = e; pris[e] = true; r.methodes.email++; } });\n  joueurs.forEach(function (j) {\n    const e = String(j.Email).toLowerCase();\n    if (r.liens[e]) return;\n    const sid = String(j['Slack ID'] || '') || (slack[e] || {}).id || '';\n    let k = '', methode = '';\n    if (sid && parSlack[sid] && !pris[parSlack[sid]]) { k = parSlack[sid]; methode = 'slack'; }\n    if (!k) { const c = (parLocal[e.split('@')[0]] || []).filter(function (x) { return !pris[x]; }); if (c.length === 1) { k = c[0]; methode = 'adresse'; } }\n    if (!k) {\n      const nom = normNom_((slack[e] || {}).nom);\n      let c = nom ? (parNom[nom] || []).filter(function (x) { return !pris[x]; }) : [];\n      if (c.length > 1) {\n        const ini = String(j['Prénom'] || '').charAt(0).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n        c = c.filter(function (x) { return x.charAt(0) === ini; });\n      }\n      if (c.length === 1) { k = c[0]; methode = 'nom'; }\n    }\n    if (k) { r.liens[e] = k; pris[k] = true; r.methodes[methode]++; }\n    else r.sans.push((j['Prénom'] ? j['Prénom'] + ' · ' : '') + e);\n  });\n  const json = JSON.stringify(r);\n  if (complet && json.length < 98000) cache.put('RAPPROCHEMENT_V1', json, 21600);\n  return (RAPPROCHEMENT_ = r);\n}\nlet RAPPROCHEMENT_ = null, SANS_SLACK_ = false;\n/* Clé de la fiche organigramme d'une adresse de connexion ('' si inconnue) */\nfunction cleOrg_(email) {\n  const e = String(email || '').toLowerCase();\n  if (annuaire_()[e]) return e;\n  return rapprochements_().liens[e] || '';\n}\nfunction viderRapprochements_() {\n  const c = cache_();\n  c.remove('RAPPROCHEMENT_V1'); c.remove('PROFILS_SLACK_V1');\n  RAPPROCHEMENT_ = null;\n}\n\nfunction nomDe_(email) { const x = annuaire_()[cleOrg_(email)]; return x ? nomPropre_(x.n) : ''; }   // « Morel » (l'organigramme écrit MOREL)\nfunction estManagerOrg_(email) {\n  const a = annuaire_(), e = cleOrg_(email);\n  return !!e && Object.keys(a).some(function (k) { return a[k].m === e; });\n}\n/* Toute l'équipe d'un manager, sur tous les niveaux (sans boucle) ; clés de l'organigramme */\nfunction subordonnes_(email) {\n  const a = annuaire_(), e = cleOrg_(email), enfants = {};\n  if (!e) return [];\n  Object.keys(a).forEach(function (k) { const m = a[k].m; if (m) (enfants[m] = enfants[m] || []).push(k); });\n  const vus = {}, file = (enfants[e] || []).slice();\n  while (file.length) { const k = file.shift(); if (vus[k] || k === e) continue; vus[k] = true; (enfants[k] || []).forEach(function (x) { file.push(x); }); }\n  return Object.keys(vus);\n}\n/* Ce qu'un utilisateur peut voir : tout (admin), des sites (accès donné dans l'admin), son équipe (organigramme) */\nfunction perimetre_(email) {\n  if (estAdmin_(email)) return { tous: true };\n  const manuel = managers_()[email], equipe = subordonnes_(email);\n  if (!manuel && !equipe.length) throw new Error('Cette page est réservée aux managers.');\n  if (manuel && !manuel.length) return { tous: true };\n  return { sites: manuel || [], emails: equipe };\n}\nfunction dansPerimetre_(p, email, site) {\n  if (p.tous || (p.sites || []).indexOf(site) !== -1) return true;\n  const k = cleOrg_(email);\n  return !!k && (p.emails || []).indexOf(k) !== -1;\n}\n\n/* À lancer une fois depuis l'éditeur (menu Exécuter) : autorise la lecture de l'organigramme et affiche ce qui est lu */\nfunction verifierOrganigramme() {\n  cache_().remove('ANNUAIRE_V1');\n  ANNUAIRE_ = null;\n  viderRapprochements_();\n  const a = annuaire_(), managers = {};\n  Object.keys(a).forEach(function (k) { if (a[k].m) managers[a[k].m] = true; });\n  console.log(Object.keys(a).length + ' personnes lues, ' + Object.keys(managers).length + ' managers.');\n  const domaines = {};\n  Object.keys(a).forEach(function (k) { const d = k.split('@')[1]; domaines[d] = (domaines[d] || 0) + 1; });\n  console.log('Domaines présents : ' + JSON.stringify(domaines));\n  const r = rapprochements_();\n  console.log('Collaborateurs de l\\'Académie reliés à l\\'organigramme : ' + JSON.stringify(r.methodes) + ' ; non reliés : ' + r.sans.length);\n}\n\nfunction rafraichirOrganigramme() {\n  verifierAdmin_();\n  cache_().remove('ANNUAIRE_V1');\n  ANNUAIRE_ = null;\n  viderRapprochements_();\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\n/* utile : 'oui' | 'non' ; usage : 'souvent' | 'une fois' | 'pas encore' */\nfunction enregistrerRetour(r) {\n  ecrire_(emailCourant_(), 'retour', { mission: String(r && r.mission || ''), utile: String(r && r.utile || ''), usage: String(r && r.usage || '') });\n  return true;\n}\n\n/* Statistiques par collaborateur, limitées aux sites du manager (tous pour un admin) */\n/* Collaborateurs du périmètre ; les membres de l'équipe qui ne sont pas encore venus apparaissent aussi */\nfunction statsCollaborateurs_(p) {\n  const a = annuaire_(), parEmail = {}, prenoms = {};\n  lignes_('Progression').forEach(function (x) { if (x.Statut === 'Réussie' && !/^Q-/.test(String(x.Mission))) (parEmail[x.Email] = parEmail[x.Email] || []).push(String(x.Mission)); });\n  const joueurs = lignes_('Joueurs');\n  joueurs.forEach(function (j) { const k = cleOrg_(j.Email); if (k) prenoms[k] = j['Prénom'] || ''; });\n  const nomComplet = function (e) { if (!e) return ''; return nomAffiche_(prenoms[e] || prenomDepuisEmail_(e), (a[e] || {}).n) || e; };\n  const vus = {};\n  const liste = joueurs.filter(function (j) { return dansPerimetre_(p, j.Email, j.Site); }).map(function (j) {\n    const k = cleOrg_(j.Email), x = a[k] || {};\n    if (k) vus[k] = true;\n    return { prenom: j['Prénom'] || prenomDepuisEmail_(String(j.Email)), nom: nomPropre_(x.n), email: j.Email, site: j.Site || '', cabinet: cabinetActuel_(j.Cabinet), poste: x.p || '', manager: nomComplet(x.m), inscrit: true,\n      xp: Number(j.XP) || 0, charte: dateIso_(j['Charte validée le']), charteVersion: String(j['Charte version'] || '').replace(/^'/, ''), missions: (parEmail[j.Email] || []).sort(), visite: dateIso_(j['Dernière visite']) };\n  });\n  (p.emails || []).forEach(function (e) {\n    if (vus[e]) return;\n    const x = a[e] || {};\n    liste.push({ prenom: prenomDepuisEmail_(e), nom: nomPropre_(x.n) || (prenomDepuisEmail_(e) ? '' : e.split('@')[0]), email: e, site: '', cabinet: '', poste: x.p || '', manager: nomComplet(x.m), inscrit: false,\n      xp: 0, charte: '', charteVersion: '', charteDuree: 0, missions: [], visite: '' });\n  });\n  return liste;\n}\n\nfunction getEquipe() {\n  const email = emailCourant_();\n  const p = perimetre_(email);\n  const collab = statsCollaborateurs_(p);\n  const ordre = [].concat.apply([], NIVEAUX.map(function (n) { return n.missions; })).filter(function (id) { return MISSIONS[id].dispo; });  // contenu prêt, même si le niveau n'est pas encore ouvert\n  const colonnes = ['prenom', 'nom', 'email', 'cabinet', 'site', 'poste', 'manager', 'inscrit', 'xp', 'charte', 'charteVersion', 'missions', 'visite'];\n  return serialiser_({\n    tous: !!p.tous, equipe: !!(p.emails && p.emails.length),\n    // Tableau compact (une liste de valeurs par personne) : moins lourd pour 1 000 collaborateurs et plus\n    collaborateurs: { colonnes: colonnes, lignes: collab.map(function (x) { return colonnes.map(function (k) { return x[k]; }); }) },\n    missions: ordre.map(function (id) { return { id: id, titre: MISSIONS[id].titre }; })\n  });\n}\n\n/* Preuve de formation : un onglet « Attestations » à jour dans le tableur de suivi */\nfunction exporterAttestations() {\n  verifierAdmin_();\n  const email = emailCourant_();\n  const collab = statsCollaborateurs_({ tous: true });\n  const ss = classeur_();\n  let sh = ss.getSheetByName('Attestations') || ss.insertSheet('Attestations');\n  sh.clear();\n  const entetes = ['Prénom', 'Nom', 'Email', 'Cabinet', 'Site', 'Poste', 'Manager', 'Charte validée le', 'Charte version', 'Missions validées', 'Nombre de missions', 'XP', 'Dernière visite'];\n  const lignes = collab.map(function (c) {\n    return [c.prenom, c.nom, c.email, c.cabinet, c.site, c.poste, c.manager, c.charte ? new Date(c.charte) : '', c.charteVersion ? \"'\" + c.charteVersion : '', c.missions.join(', '), c.missions.length, c.xp, c.visite ? new Date(c.visite) : ''];\n  });\n  sh.getRange(1, 1, 1, entetes.length).setValues([entetes]).setFontWeight('bold').setFontColor('#FFFFFF').setBackground('#2A286B');\n  if (lignes.length) sh.getRange(2, 1, lignes.length, entetes.length).setValues(lignes);\n  sh.getRange('H2:H').setNumberFormat('dd/mm/yyyy'); sh.getRange('M2:M').setNumberFormat('dd/mm/yyyy');\n  sh.setFrozenRows(1);\n  sh.getRange(1, 1, 1, 1).setNote('Généré le ' + Utilities.formatDate(new Date(), 'Europe/Paris', 'dd/MM/yyyy HH:mm') + ' par ' + email + '. Preuve de sensibilisation à l\\'IA (loi européenne sur l\\'IA, article 4).');\n  return ss.getUrl() + '#gid=' + sh.getSheetId();\n}\n\n/* role : 'admin' | 'manager' ; sites : liste des sites du manager ([] = tous) */\nfunction ajouterAcces(a) {\n  verifierAdmin_();\n  const email = String(a && a.email || '').trim().toLowerCase();\n  if (!/^[^@\\s]+@[^@\\s]+\\.[a-z]{2,}$/.test(email)) throw new Error('Adresse e-mail invalide.');\n  if (a.role === 'admin') {\n    const liste = admins_();\n    if (liste.indexOf(email) === -1) liste.push(email);\n    PropertiesService.getScriptProperties().setProperty('ADMINS', JSON.stringify(liste));\n  } else {\n    const m = managers_();\n    m[email] = (a.sites || []).filter(function (x) { return sites_().indexOf(x) !== -1; });\n    PropertiesService.getScriptProperties().setProperty('MANAGERS', JSON.stringify(m));\n  }\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction retirerAcces(a) {\n  verifierAdmin_();\n  const email = String(a && a.email || '').toLowerCase();\n  if (a.role === 'admin') {\n    const liste = admins_().filter(function (x) { return x !== email; });\n    if (!liste.length) throw new Error('Il faut garder au moins un administrateur.');\n    PropertiesService.getScriptProperties().setProperty('ADMINS', JSON.stringify(liste));\n  } else {\n    const m = managers_(); delete m[email];\n    PropertiesService.getScriptProperties().setProperty('MANAGERS', JSON.stringify(m));\n  }\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\n/* Date d'ouverture d'un niveau ('' = ouvert tout de suite) */\nfunction definirOuverture(num, date) {\n  verifierAdmin_();\n  num = Number(num);\n  if (!NIVEAUX.some(function (n) { return n.num === num; })) throw new Error('Niveau inconnu.');\n  if (date && !/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) throw new Error('Date invalide.');\n  const o = ouvertures_();\n  if (date) o[String(num)] = date; else delete o[String(num)];\n  PropertiesService.getScriptProperties().setProperty('OUVERTURES', JSON.stringify(o));\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction ajouterDomaine(d) {\n  verifierAdmin_();\n  d = String(d || '').trim().toLowerCase().replace(/^@/, '');\n  if (!/^[a-z0-9.-]+\\.[a-z]{2,}$/.test(d)) throw new Error('Domaine invalide (exemple : ozeo.com).');\n  const liste = domaines_();\n  if (liste.indexOf(d) === -1) liste.push(d);\n  PropertiesService.getScriptProperties().setProperty('DOMAINES', JSON.stringify(liste));\n  return getAdmin();\n}\n\nfunction retirerDomaine(d) {\n  verifierAdmin_();\n  const liste = domaines_().filter(function (x) { return x !== d; });\n  if (!liste.length) throw new Error('Il faut garder au moins un domaine.');\n  PropertiesService.getScriptProperties().setProperty('DOMAINES', JSON.stringify(liste));\n  return getAdmin();\n}\n\n/* ------------------------------------------------------------------ */\n/* Quiz du mois                                                        */\n/* ------------------------------------------------------------------ */\n\nfunction getQuizMois(moisTest) {\n  const admin = estAdmin_(emailCourant_());\n  const mois = admin && moisTest ? moisTest : moisCourant_();\n  const questions = admin && moisTest ? questionsQuiz_(mois, true) : questionsQuiz_(mois);\n  if (!questions.length) throw new Error(\"Pas de quiz ce mois-ci pour l'instant.\");\n  return serialiser_({\n    mois: mois, libelle: libelleMois_(mois),\n    questions: questions.map(function (q) { return { question: q.Question, choix: LETTRES.map(function (l) { return q['Choix ' + l]; }).filter(String) }; }),\n    deja: persoCourant_(emailCourant_()).quiz,\n    test: !!(admin && moisTest)\n  });\n}\n\n/* reponses : tableau d'indices (0, 1, 2) dans l'ordre des questions */\nfunction terminerQuizMois(reponses, moisTest) {\n  const email = emailCourant_();\n  const test = !!(moisTest && estAdmin_(email));\n  const mois = test ? moisTest : moisCourant_();\n  const questions = test ? questionsQuiz_(mois, true) : questionsQuiz_(mois);\n  if (!questions.length) throw new Error(\"Pas de quiz ce mois-ci.\");\n  reponses = (reponses || []).map(Number);\n  const corrections = questions.map(function (q, i) {\n    const bonne = LETTRES.indexOf(String(q['Bonne réponse']).trim().toUpperCase());\n    return { bonne: bonne, juste: reponses[i] === bonne, explication: q.Explication || '' };\n  });\n  const score = corrections.filter(function (c) { return c.juste; }).length;\n  const perso = persoCourant_(email);\n  if (test) return serialiser_({ corrections: corrections, score: score, total: questions.length, xpGagne: 0, premiereFois: false, test: true, etat: assembler_(perso) });\n  const dejaFait = !!(perso.quiz && perso.quiz.mois === mois && perso.quiz.fait);\n  const xpGagne = dejaFait ? 0 : score * XP_QUIZ_PAR_BONNE;\n  ecrire_(email, 'quiz', { mois: mois, score: score, nb: questions.length, justes: corrections.map(function (c) { return c.juste; }) });\n  noterQuizFs_(email, mois, score, questions.length);\n  if (perso.quiz && perso.quiz.mois === mois) {\n    perso.quiz.score = Math.max(Number(perso.quiz.score) || 0, score);\n    perso.quiz.fait = true;\n  }\n  perso.joueur.xp += xpGagne;\n  garderPerso_(email, perso);\n  return serialiser_({ corrections: corrections, score: score, total: questions.length, xpGagne: xpGagne,\n    premiereFois: !dejaFait, etat: assembler_(perso) });\n}\n\nfunction etatQuiz_(resume) {\n  const mois = moisCourant_();\n  const nb = questionsQuiz_(mois).length;\n  if (!nb) return null;\n  const q = (resume || {})['Q-' + mois];\n  return { mois: mois, libelle: libelleMois_(mois), nb: nb, xpMax: nb * XP_QUIZ_PAR_BONNE,\n    fait: !!q, score: q ? Number(q[1]) || 0 : null };\n}\n\nfunction questionsQuiz_(mois, avecBrouillons) {\n  return lignes_('Quiz').filter(function (q) { return moisDe_(q.Mois) === mois && q.Question && (avecBrouillons || q.Statut !== 'Brouillon'); });\n}\n\n/* ------------------------------------------------------------------ */\n/* Espace admin                                                        */\n/* ------------------------------------------------------------------ */\n\nfunction getAdmin() {\n  verifierAdmin_();\n  const joueurs = lignes_('Joueurs');\n  const prog = lignes_('Progression');\n  const parSite = {};\n  joueurs.forEach(function (j) {\n    const s = siteCabinet_(j.Site, j.Cabinet) || 'Site non choisi';\n    parSite[s] = parSite[s] || { site: s, joueurs: 0, charte: 0, xp: 0 };\n    parSite[s].joueurs++;\n    if (j['Charte validée le']) parSite[s].charte++;\n    parSite[s].xp += Number(j.XP) || 0;\n  });\n  const charte = joueurs.filter(function (j) { return j['Charte validée le']; }).length;\n  const versionCharte = PropertiesService.getScriptProperties().getProperty('CHARTE_VERSION') || '';\n  const charteEnVigueur = joueurs.filter(function (j) { return versionCharte && String(j['Charte version'] || '').replace(/^'/, '') === versionCharte; }).length;\n  const calendrier = lignes_('Calendrier').map(function (c) {\n    return { ligne: c._ligne, date: dateIso_(c.Date), jour: c.Date ? Utilities.formatDate(new Date(c.Date), 'Europe/Paris', 'yyyy-MM-dd') : '',\n      heure: c.Date ? Utilities.formatDate(new Date(c.Date), 'Europe/Paris', 'HH:mm') : '', type: c.Type, titre: c.Titre, texte: c.Texte, lien: c.Lien,\n      publie: dateIso_(c['Publié le']), brouillon: c.Statut === 'Brouillon' };\n  });\n  const props = PropertiesService.getScriptProperties();\n  const effectifs = {};\n  joueurs.forEach(function (j) { if (j.Site) effectifs[j.Site] = (effectifs[j.Site] || 0) + 1; });\n  const moisListe = [0, 1, 2].map(function (k) { return moisDecale_(k); });\n  const quiz = lignes_('Quiz');\n  return serialiser_({\n    quiz: moisListe.map(function (m) {\n      return { mois: m, libelle: libelleMois_(m), questions: quiz.filter(function (q) { return moisDe_(q.Mois) === m; }).map(function (q) {\n        return { ligne: q._ligne, question: q.Question, choix: LETTRES.map(function (l) { return q['Choix ' + l]; }), bonne: String(q['Bonne réponse']).trim().toUpperCase(), explication: q.Explication, brouillon: q.Statut === 'Brouillon' };\n      }) };\n    }),\n    sites: sites_().map(function (nom) { return { nom: nom, joueurs: effectifs[nom] || 0 }; }),\n    videos: Object.keys(MISSIONS).filter(function (id) { return MISSIONS[id].dispo; }).map(function (id) {\n      const v = videos_()[id];\n      return { id: id, titre: MISSIONS[id].titre, lien: v ? 'https://drive.google.com/file/d/' + v + '/view' : '' };\n    }),\n    modeTest: modeTest_(),\n    firestore: firestoreActif_(),\n    conso: JSON.parse(PropertiesService.getScriptProperties().getProperty('CONSO_RELEVE') || 'null'),\n    emailTest: CONFIG.EMAIL_TEST,\n    acces: { admins: admins_(), managers: managers_(), domaines: domaines_(),\n      organigramme: (function () { const a = annuaire_(), m = {}; Object.keys(a).forEach(function (k) { if (a[k].m) m[a[k].m] = true; });\n        const r = rapprochements_();\n        return { membres: Object.keys(a).length, managers: Object.keys(m).length, methodes: r.methodes, sans: r.sans.slice(0, 40), nbSans: r.sans.length }; })() },\n    niveaux: NIVEAUX.map(function (n) { return { num: n.num, titre: n.titre, badge: n.badge, ouverture: ouvertures_()[String(n.num)] || '' }; }),\n    missions: Object.keys(MISSIONS).map(function (id) { return { id: id, titre: MISSIONS[id].titre, dispo: !!MISSIONS[id].dispo,\n      faites: prog.filter(function (p) { return String(p.Mission) === id && p.Statut === 'Réussie'; }).length }; }),\n    activite: (function () {\n      const journal = lignes_('Journal', 5000), lundi = debutSemaine_(), semaines = [];\n      for (let k = 7; k >= 0; k--) {\n        const debut = new Date(lundi.getTime() - k * 7 * 86400000), fin = new Date(debut.getTime() + 7 * 86400000);\n        const actifs = {}; let missions = 0;\n        journal.forEach(function (e) { const d = new Date(e.Date); if (d >= debut && d < fin) { actifs[e.Email] = true; if (/a validé la mission/.test(e.Action)) missions++; } });\n        semaines.push({ semaine: Utilities.formatDate(debut, 'Europe/Paris', 'dd/MM'), actifs: Object.keys(actifs).length, missions: missions });\n      }\n      return semaines;\n    })(),\n    quizStats: [moisDecale_(-2), moisDecale_(-1), moisDecale_(0)].map(function (m) {\n      const st = JSON.parse(props.getProperty('QUIZ_STATS_' + m) || '[]');\n      const ok = st.reduce(function (a, x) { return a + (x ? x.ok : 0); }, 0), ko = st.reduce(function (a, x) { return a + (x ? x.ko : 0); }, 0);\n      return { mois: libelleMois_(m), taux: ok + ko ? Math.round(100 * ok / (ok + ko)) : null };\n    }),\n    retours: (function () {\n      const r = lignes_('Retours'), parMission = {}, usage = { souvent: 0, 'une fois': 0, 'pas encore': 0 };\n      r.forEach(function (x) {\n        const id = String(x.Mission); parMission[id] = parMission[id] || { oui: 0, non: 0 };\n        if (x.Utile === 'oui' || x.Utile === 'non') parMission[id][x.Utile]++;\n        if (usage[x['Usage compétences']] !== undefined) usage[x['Usage compétences']]++;\n      });\n      return { parMission: parMission, usage: usage, total: r.length };\n    })(),\n    types: CONFIG.TYPES_CONTENU,\n    urlTableur: classeur_().getUrl(),\n    chiffres: {\n      joueurs: joueurs.length,\n      charte: charte,\n      tauxCharte: joueurs.length ? Math.round(100 * charte / joueurs.length) : 0,\n      charteEnVigueur: charteEnVigueur, versionCharte: versionCharte,\n      dossiers: { accuses: reglageDoc_('DOSSIER_ACCUSES_CHARTE'), certifications: reglageDoc_('DOSSIER_CERTIFICATIONS') },\n      lancement: PropertiesService.getScriptProperties().getProperty('DATE_LANCEMENT') || '',\n      alertesCharte: casCharteNonSignee_(false),\n      missions: prog.filter(function (p) { return p.Statut === 'Réussie'; }).length,\n      actifs7j: joueurs.filter(function (j) { return joursDepuis_(j['Dernière visite']) < 7; }).length\n    },\n    parSite: Object.keys(parSite).map(function (k) { return parSite[k]; }).sort(function (a, b) { return b.joueurs - a.joueurs; }),\n    ia: { active: !!cleClaude_(), moisSuivant: moisDecale_(1), libelleSuivant: libelleMois_(moisDecale_(1)),\n      derniere: props.getProperty('GENERATION_DERNIERE') || '', jour: CONFIG.JOUR_GENERATION,\n      notes: lignes_('Notes').filter(function (n) { return !n['Utilisée le']; }).map(function (n) { return { ligne: n._ligne, note: n.Note }; }) },\n    brouillons: calendrier.filter(function (c) { return c.brouillon; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }),\n    aVenir: calendrier.filter(function (c) { return !c.publie && !c.brouillon; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }),\n    publies: calendrier.filter(function (c) { return c.publie; }).slice(-8).reverse()\n  });\n}\n\nfunction ajouterContenu(c) {\n  verifierAdmin_();\n  if (!c || !c.titre || !c.date) throw new Error('Il faut au moins une date et un titre.');\n  if (CONFIG.TYPES_CONTENU.indexOf(c.type) === -1) throw new Error('Type de contenu inconnu.');\n  const quand = dateHeure_(c.date, c.heure);\n  ajouter_('Calendrier', [quand, c.type, c.titre, c.texte || '', c.lien || '', '']);\n  return getAdmin();\n}\n\nfunction publierMaintenant(c) {\n  verifierAdmin_();\n  if (!c || !c.titre) throw new Error('Il faut au moins un titre.');\n  if (CONFIG.TYPES_CONTENU.indexOf(c.type) === -1) throw new Error('Type de contenu inconnu.');\n  ajouter_('Calendrier', [new Date(), c.type, c.titre, c.texte || '', c.lien || '', '']);\n  publierCalendrier();\n  return getAdmin();\n}\n\nfunction supprimerContenu(ligne) {\n  verifierAdmin_();\n  const c = lignes_('Calendrier').filter(function (x) { return x._ligne === Number(ligne); })[0];\n  if (!c) throw new Error('Contenu introuvable : rechargez la page.');\n  if (c['Publié le']) throw new Error('Ce contenu est déjà publié.');\n  feuille_('Calendrier').deleteRow(c._ligne);\n  invalider_('Calendrier');\n  return getAdmin();\n}\n\nfunction validerContenu(ligne) {\n  verifierAdmin_();\n  const c = lignes_('Calendrier').filter(function (x) { return x._ligne === Number(ligne); })[0];\n  if (!c) throw new Error('Contenu introuvable : rechargez la page.');\n  maj_('Calendrier', c._ligne, 'Statut', '');\n  return getAdmin();\n}\n\nfunction modifierContenu(m) {\n  verifierAdmin_();\n  const c = lignes_('Calendrier').filter(function (x) { return x._ligne === Number(m && m.ligne); })[0];\n  if (!c) throw new Error('Contenu introuvable : rechargez la page.');\n  if (c['Publié le']) throw new Error('Ce contenu est déjà publié.');\n  if (!m.titre) throw new Error('Le titre ne peut pas être vide.');\n  maj_('Calendrier', c._ligne, 'Titre', m.titre);\n  maj_('Calendrier', c._ligne, 'Texte', m.texte || '');\n  if (m.date) maj_('Calendrier', c._ligne, 'Date', dateHeure_(m.date, m.heure));\n  return getAdmin();\n}\n\n/* 'AAAA-MM-JJ' + 'HH:MM' → date (heure de Paris du script) */\nfunction dateHeure_(jour, heure) {\n  const j = String(jour).split('-').map(Number);\n  const h = String(heure || (CONFIG.HEURE_ROUTINE + ':00')).split(':').map(Number);\n  return new Date(j[0], j[1] - 1, j[2], h[0] || 0, h[1] || 0, 0);\n}\n\nfunction validerQuiz(mois) {\n  verifierAdmin_();\n  lignes_('Quiz').forEach(function (q) {\n    if (moisDe_(q.Mois) === mois && q.Statut === 'Brouillon') maj_('Quiz', q._ligne, 'Statut', '');\n  });\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction ajouterNote(texte) {\n  verifierAdmin_();\n  texte = String(texte || '').trim();\n  if (!texte) throw new Error('La note est vide.');\n  ajouter_('Notes', [new Date(), texte, '']);\n  return getAdmin();\n}\n\nfunction genererMaintenant() {\n  verifierAdmin_();\n  if (!cleClaude_()) throw new Error(\"Ajoutez d'abord la clé ANTHROPIC_API_KEY dans les propriétés du script.\");\n  genererContenusMois_(moisDecale_(1));\n  return getAdmin();\n}\n\nfunction ajouterQuestion(q) {\n  verifierAdmin_();\n  if (!q || !q.question || !q.a || !q.b) throw new Error('Il faut une question et au moins deux réponses (A et B).');\n  if (LETTRES.indexOf(q.bonne) === -1 || (q.bonne === 'C' && !q.c)) throw new Error('Indiquez la bonne réponse (A, B ou C).');\n  if (!/^\\d{4}-\\d{2}$/.test(q.mois || '')) throw new Error('Mois invalide.');\n  ajouter_('Quiz', [\"'\" + q.mois, q.question, q.a, q.b, q.c || '', q.bonne, q.explication || '']);\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction supprimerQuestion(ligne) {\n  verifierAdmin_();\n  const q = lignes_('Quiz').filter(function (x) { return x._ligne === Number(ligne); })[0];\n  if (!q) throw new Error('Question introuvable : rechargez la page.');\n  feuille_('Quiz').deleteRow(q._ligne);\n  invalider_('Quiz');\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\n/* Vidéo d'introduction d'une mission : un fichier Google Drive partagé avec le domaine */\nfunction enregistrerVideo(id, lien) {\n  verifierAdmin_();\n  if (!MISSIONS[id]) throw new Error('Mission inconnue.');\n  const videos = videos_();\n  lien = String(lien || '').trim();\n  if (!lien) delete videos[id];\n  else {\n    const m = lien.match(/\\/d\\/([\\w-]{20,})/) || lien.match(/[?&]id=([\\w-]{20,})/) || lien.match(/^([\\w-]{20,})$/);\n    if (!m) throw new Error('Lien Google Drive non reconnu : copiez le lien de partage du fichier.');\n    videos[id] = m[1];\n  }\n  PropertiesService.getScriptProperties().setProperty('VIDEOS', JSON.stringify(videos));\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction videos_() {\n  return JSON.parse(PropertiesService.getScriptProperties().getProperty('VIDEOS') || '{}');\n}\n\nfunction ajouterSite(nom) {\n  verifierAdmin_();\n  nom = String(nom || '').trim();\n  if (!nom) throw new Error('Indiquez le nom du site.');\n  const liste = sites_();\n  if (liste.some(function (s) { return s.toLowerCase() === nom.toLowerCase(); })) throw new Error('Ce site existe déjà.');\n  liste.push(nom);\n  enregistrerSites_(liste);\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\n/* Renomme aussi le site chez les joueurs et dans le journal, pour garder la ligue cohérente */\nfunction renommerSite(ancien, nouveau) {\n  verifierAdmin_();\n  nouveau = String(nouveau || '').trim();\n  const liste = sites_();\n  const i = liste.indexOf(ancien);\n  if (i === -1) throw new Error('Site introuvable : rechargez la page.');\n  if (!nouveau) throw new Error('Indiquez le nouveau nom.');\n  if (liste.some(function (s, k) { return k !== i && s.toLowerCase() === nouveau.toLowerCase(); })) throw new Error('Ce nom existe déjà.');\n  avecVerrou_(function () {\n    ['Joueurs', 'Journal'].forEach(function (onglet) {\n      const sh = feuille_(onglet);\n      const col = ONGLETS[onglet].indexOf('Site') + 1;\n      const n = sh.getLastRow() - 1;\n      if (n < 1) return;\n      const plage = sh.getRange(2, col, n, 1);\n      plage.setValues(plage.getValues().map(function (l) { return [l[0] === ancien ? nouveau : l[0]]; }));\n      invalider_(onglet);\n    });\n    liste[i] = nouveau;\n    enregistrerSites_(liste);\n    viderPartages_();\n  });\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction supprimerSite(nom) {\n  verifierAdmin_();\n  const liste = sites_();\n  if (liste.indexOf(nom) === -1) throw new Error('Site introuvable : rechargez la page.');\n  const rattaches = lignes_('Joueurs').filter(function (j) { return j.Site === nom; }).length;\n  if (rattaches) throw new Error(rattaches + (rattaches > 1 ? ' collaborateurs sont rattachés' : ' collaborateur est rattaché') + ' à ce site : renommez-le plutôt que de le supprimer.');\n  enregistrerSites_(liste.filter(function (s) { return s !== nom; }));\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\n\nfunction basculerModeTest(actif) {\n  verifierAdmin_();\n  PropertiesService.getScriptProperties().setProperty('MODE_TEST', actif ? 'true' : 'false');\n  return getAdmin();\n}\n\n/* ------------------------------------------------------------------ */\n/* Routine quotidienne (déclencheur à 9 h)                             */\n/* ------------------------------------------------------------------ */\n\n/* Les déclencheurs ne tournent qu'une fois cette version activée par installer() (propriété ECRITURES_ACTIVES).\n   Ainsi, un code envoyé dans Apps Script mais pas encore validé n'écrit rien et n'envoie rien. */\nfunction versionActivee_() {\n  if (PropertiesService.getScriptProperties().getProperty('ECRITURES_ACTIVES') === 'oui') return true;\n  console.warn('Déclencheur ignoré : cette version n’est pas encore activée (lancer installer depuis l’éditeur).');\n  return false;\n}\n\nfunction routineQuotidienne() {\n  if (!versionActivee_()) return;\n  [publierCalendrier, crediterPresencesLive, annoncerKerogoat, relancesQuotidiennes, alerteChartesNonSignees_, genererSiBesoin].forEach(function (fn) {\n    try { fn(); } catch (e) { console.error(fn.name + ' : ' + e.message); }\n  });\n}\n\nfunction relancesQuotidiennes() {\n  const jour = new Date().getDay();\n  if (jour === 0 || jour === 6) return;\n  const debut = Date.now();\n  EN_LOT_ = true;\n\n  const joueurs = lignes_('Joueurs');\n  const relances = lignes_('Relances');\n  const derniere = function (email, type) {\n    let d = null;\n    relances.forEach(function (r) {\n      if (r.Email === email && r.Type === type && (!d || new Date(r.Date) > d)) d = new Date(r.Date);\n    });\n    return d;\n  };\n  const nombre = function (email, type) {\n    return relances.filter(function (r) { return r.Email === email && r.Type === type; }).length;\n  };\n  const reussiesParEmail = {};\n  lignes_('Progression').forEach(function (p) {\n    if (p.Statut !== 'Réussie') return;\n    (reussiesParEmail[p.Email] = reussiesParEmail[p.Email] || []).push(String(p.Mission));\n  });\n  const ordre = [].concat.apply([], NIVEAUX.map(function (n) { return n.missions; }));\n\n  // 1. Joueurs inscrits : charte non validée, ou plus de visite depuis 7 jours\n  // (au-delà de 4 minutes, on s'arrête : les relances déjà notées ne repartent pas, la suite part demain)\n  joueurs.forEach(function (j) {\n    if (Date.now() - debut > LIMITE_LOT_MS) return;\n    if (!autorise_(j.Email)) return;\n    if (!estOuvre_(new Date(), j.Site)) return;   // jour férié sur son site : pas de relance aujourd'hui\n    const prenom = j['Prénom'] || '';\n    if (!j['Charte validée le'] && joursOuvresDepuis_(j['Inscrit le'], j.Site) >= CONFIG.JOURS_AVANT_RELANCE_CHARTE\n        && joursDepuis_(derniere(j.Email, 'charte')) >= CONFIG.JOURS_ENTRE_RELANCES) {\n      if (envoyerMP_(j, 'Hello ' + prenom + \" 👋 Ta charte d'usage de l'IA n'est pas encore signée. \"\n          + \"C'est l'étape 0 de \" + CONFIG.NOM_ARTICLE + ' : environ un quart d\\'heure, en plusieurs fois si besoin.', 'Lire la charte', 'etape0')) {\n        ajouter_('Relances', [new Date(), j.Email, 'charte']);\n      }\n      return;\n    }\n    if (joursOuvresDepuis_(j['Dernière visite'], j.Site) >= CONFIG.JOURS_INACTIVITE\n        && joursDepuis_(derniere(j.Email, 'inactif')) >= CONFIG.JOURS_ENTRE_RELANCES) {\n      const faites = reussiesParEmail[j.Email] || [];\n      const id = ordre.filter(function (x) { return faites.indexOf(x) === -1; })[0];\n      if (!id || !dispo_(id)) return;\n      if (envoyerMP_(j, 'Hello ' + prenom + \" 👋 Ta prochaine mission t'attend dans \" + CONFIG.NOM_ARTICLE + ' : *'\n          + MISSIONS[id].titre + '* (' + MISSIONS[id].minutes + ' minutes). Ton site compte sur tes points cette semaine 💪',\n          'Commencer ma mission', 'mission-' + id)) {\n        ajouter_('Relances', [new Date(), j.Email, 'inactif']);\n      }\n    }\n  });\n\n  // 2. Collaborateurs jamais venus : invitation, puis un seul rappel (voir dateRappel_)\n  const inscrits = {};\n  joueurs.forEach(function (j) { inscrits[j.Email] = true; });\n  let envoyees = 0;\n  membresSlack_().some(function (u) {\n    if (envoyees >= CONFIG.INVITATIONS_PAR_JOUR || Date.now() - debut > LIMITE_LOT_MS) return true;\n    if (inscrits[u.email] || !autorise_(u.email)) return false;\n    const deja = nombre(u.email, 'invitation');\n    if (deja >= 2) return false;\n    if (deja === 1 && new Date() < dateRappel_(derniere(u.email, 'invitation'))) return false;\n    const texte = deja === 0\n      ? 'Hello ' + u.prenom + ' 👋 ' + majuscule_(CONFIG.NOM_ARTICLE) + \" est ouverte : des missions de 5 minutes pour prendre les bons réflexes IA au travail, \"\n        + 'en commençant par notre charte. Rien à installer : ton compte Google suffit.'\n      : 'Hello ' + u.prenom + \" 👋 Petit rappel : ta première mission de \" + CONFIG.NOM_ARTICLE + \" prend 5 minutes. On t'attend !\";\n    if (envoyerMP_({ 'Slack ID': u.id, Email: u.email }, texte, \"Découvrir l'Académie\")) {\n      ajouter_('Relances', [new Date(), u.email, 'invitation']);\n      envoyees++;\n    }\n    return false;\n  });\n  noterDuree_('relancesQuotidiennes', debut, envoyees + ' invitation(s)');\n}\n\n/* Calendrier éditorial : publication automatique dans #kerogo-tools */\n/* Mise en forme d'une publication du calendrier pour Slack :\n   le titre en gras, puis le texte en paragraphes, puis le bouton. Les lignes du podium\n   (🥇 🥈 🥉) sont décalées en escalier, comme dans les messages postés à la main. */\nfunction blocsPublication_(c) {\n  const titre = String(c.Titre || '').trim();\n  const texte = mettreEnFormeSlack_(c.Texte);\n  const blocs = [{ type: 'section', text: { type: 'mrkdwn', text: '*' + titre.replace(/^\\*+|\\*+$/g, '') + '*' + (texte ? '\\n\\n' + texte : '') } }];\n  const principal = c.Lien || lienApp_(c.Type === 'Quiz du mois' ? 'quiz' : '');\n  const libelle = c.Lien ? 'Ouvrir' : (c.Type === 'Quiz du mois' ? 'Faire le quiz' : \"Ouvrir l'Académie\");\n  if (principal) blocs.push({ type: 'actions', elements: [{ type: 'button', style: 'primary', text: { type: 'plain_text', text: libelle, emoji: true }, url: principal }] });\n  return blocs;\n}\n\nfunction aererRubriques_(texte) {\n  return String(texte || '')\n    .replace(/\\s*\\*?\\s*(À quoi ça sert|Pour qui|Comment)\\s*\\?\\s*\\*?\\s*/g, function (m, r) { return '\\n\\n*' + r + ' ?* '; })\n    .replace(/\\n{3,}/g, '\\n\\n').replace(/^\\s+/, '');\n}\n\nfunction mettreEnFormeSlack_(texte) {\n  texte = aererRubriques_(texte);\n  const retrait = { '🥈': '\\u2003\\u2003', '🥉': '\\u2003\\u2003\\u2003\\u2003', ':second_place_medal:': '\\u2003\\u2003', ':third_place_medal:': '\\u2003\\u2003\\u2003\\u2003' };\n  return String(texte || '').trim().split('\\n').map(function (ligne) {\n    const l = ligne.replace(/^\\s+/, '');\n    for (const m in retrait) { if (l.indexOf(m) === 0) return retrait[m] + l; }\n    return l;\n  }).join('\\n');\n}\n\n/* Annonce du quiz : toujours le même texte, au bon mois */\nfunction annonceQuiz_(mois, nb) {\n  const libelle = libelleMois_(mois);\n  const de = /^[aeiouéèâ]/i.test(libelle) ? 'd’' : 'de ';\n  return {\n    titre: ':brain: Le quiz ' + de + libelle + ' est ouvert !',\n    texte: (nb || 5) + ' questions sur nos compétences Slackbot et les bons réflexes IA.\\nÇa prend quelques minutes, et chaque bonne réponse te fait gagner des XP.\\n\\nÀ toi de jouer, et bonne chance ! :wink:'\n  };\n}\n\n/* Envoie à l'admin, en message privé, le message exactement tel qu'il sera publié */\nfunction apercuSlack(ligne) {\n  verifierAdmin_();\n  const c = lignes_('Calendrier').filter(function (x) { return x._ligne === Number(ligne); })[0];\n  if (!c) throw new Error('Contenu introuvable : rechargez la page.');\n  const moi = slack_('users.lookupByEmail', { email: emailCourant_() }, true);\n  if (!moi.ok) throw new Error('Votre compte Slack est introuvable : ' + moi.error);\n  const quand = c.Date ? Utilities.formatDate(new Date(c.Date), 'Europe/Paris', \"dd/MM 'à' HH'h'mm\") : '';\n  const blocs = [{ type: 'context', elements: [{ type: 'mrkdwn', text: '👀 Aperçu · ' + (c.Statut === 'Brouillon' ? 'brouillon, ' : '')\n    + 'publication prévue le ' + quand + ' dans #kerogo-tools' }] }].concat(blocsPublication_(c));\n  const r = slack_('chat.postMessage', { channel: moi.user.id, text: 'Aperçu : ' + c.Titre, blocks: blocs, unfurl_links: false });\n  if (!r.ok) throw new Error('Envoi impossible : ' + r.error);\n  return true;\n}\n\nfunction publierCalendrier() {\n  const maintenant = new Date();\n  lignes_('Calendrier').forEach(function (c) {\n    if (!c.Date || c['Publié le'] || c.Statut === 'Brouillon' || new Date(c.Date) > maintenant || !c.Titre) return;\n    const blocs = blocsPublication_(c);\n    const canal = canalAnnonces_();\n    if (!canal) return;\n    const r = slack_('chat.postMessage', { channel: canal, text: c.Titre, blocks: blocs, unfurl_links: false });\n    if (r.ok) { maj_('Calendrier', c._ligne, 'Publié le', new Date()); viderPartages_(); }\n  });\n  partages_();\n}\n\n/**\n * +30 XP aux joueurs présents à un live, sans aucune action de leur part.\n * Lit le rapport de présence que Google Meet joint à l'événement Google Agenda\n * (le suivi des présences doit être activé dans les options de la réunion).\n */\nfunction crediterPresencesLive() {\n  const p
