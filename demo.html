function rendreMissionFiche(id) {
  arreterMinuteur();
  navActive('progression');
  const d = MISSIONS_DEF[id], ex = d.exercice, total = ex.items.length + d.quiz.length;
  const etat = Object.assign({ rep: {}, verifie: false, quiz: {} }, lireReprise(id) || {}, { valide: null, envoi: false });
  SESSION = { nom: 'la mission ' + id, active: () => etat.valide === null && (Object.keys(etat.rep).length > 0 || Object.keys(etat.quiz).length > 0),
    sauver: () => sauverReprise(id, { rep: etat.rep, verifie: etat.verifie, quiz: etat.quiz }) };
  const dessiner = () => {
    const defil = window.scrollY;
    const bonsEx = ex.items.filter((x, i) => etat.rep[i] === x.bonne).length, bonsQuiz = d.quiz.filter((q, i) => etat.quiz[i] === q.bonne).length;
    const pretEx = ex.items.every((_, i) => etat.rep[i] !== undefined), pret = etat.verifie && d.quiz.every((_, i) => etat.quiz[i] !== undefined);
    vue.innerHTML = `<div class="pile" style="max-width:980px;margin:0 auto">
      ${bandeauMission(id)}
      ${entreteMission(id, d.titre, d.chapo)}
      ${lecteurVideo(id)}
      <section class="carte" style="display:flex;flex-direction:column;gap:14px">
        <p class="surtitre">À comprendre</p>
        ${d.lecons.length === 5 ? `<dl class="lecons-liste">${d.lecons.map((l) => `<div><dt>${l[0]}</dt><dd>${l[1]}</dd></div>`).join('')}</dl>`
          : `<div class="${d.lecons.length === 4 ? 'lecons-duo' : 'ch-trio'}">${d.lecons.map((l) => `<div class="ch-carte"><p class="titre" style="font-size:18px">${l[0]}</p><p class="doux" style="line-height:1.55">${l[1]}</p></div>`).join('')}</div>`}
        ${d.exemple ? `<div class="exemple-duo"><div class="exemple ex-flou"><p class="surtitre">${d.exemple[0][0]}</p><p>« ${d.exemple[0][1]} »</p></div><div class="exemple ex-net"><p class="surtitre">${d.exemple[1][0]}</p><p>« ${d.exemple[1][1]} »</p></div></div>` : ''}
        ${d.note ? `<p class="doux" style="font-size:14px;line-height:1.55">${d.note}</p>` : ''}
      </section>
      <section class="carte" style="display:flex;flex-direction:column;gap:22px">
        <p class="surtitre">Exercice</p>
        <h2 class="titre" style="font-size:26px">${ex.titre}</h2>
        ${ex.items.map((x, i) => `<fieldset><legend>${i + 1}. ${x.s}</legend><div class="choix-ligne">${(x.options || ex.options).map((o, k) => {
          let style = '';
          if (etat.verifie) style = k === x.bonne ? 'background:var(--bon);border-color:var(--citron)' : (etat.rep[i] === k ? 'background:var(--faux);border-color:var(--corail)' : '');
          return `<button type="button" data-item="${i}" data-option="${k}" aria-pressed="${etat.rep[i] === k}" ${etat.verifie ? 'disabled' : ''} style="${style};text-align:left">${o}</button>`; }).join('')}</div>
          ${etat.verifie ? `<p class="explication"><strong>${etat.rep[i] === x.bonne ? 'Bien vu !' : 'Pas tout à fait.'}</strong> ${x.explication}</p>` : ''}</fieldset>`).join('')}
        ${etat.verifie ? `<p style="font-weight:700">${bonsEx}/${ex.items.length} ${accord(ex.items.length, 'bonne réponse', 'bonnes réponses')} à l’exercice.</p>`
          : `<div class="boutons"><button type="button" class="btn btn-fort" id="verifier" ${pretEx ? '' : 'disabled'}>Vérifier mes réponses</button><p class="doux" style="font-size:14px">${pretEx ? 'Tout est prêt.' : 'Réponds à chaque ligne.'}</p></div>`}
      </section>
      ${etat.verifie ? `<section class="carte" style="display:flex;flex-direction:column;gap:22px">
        <h2 class="titre" style="font-size:26px">${d.quiz.length === 2 ? 'Deux' : 'Trois'} questions pour valider</h2>
        ${d.quiz.map((q, i) => `<fieldset><legend>${q.q}</legend>${q.choix.map((c, k) => {
          let cls = etat.quiz[i] === k ? 'coche' : '';
          if (etat.valide !== null) cls = k === q.bonne ? 'bonne' : (etat.quiz[i] === k ? 'mauvaise' : '');
          return `<label class="choix ${cls}"><input type="radio" name="q${i}" value="${k}" ${etat.quiz[i] === k ? 'checked' : ''} ${etat.valide !== null ? 'disabled' : ''}>${c}</label>`; }).join('')}
          ${etat.valide !== null ? `<p class="explication"><strong>${etat.quiz[i] === q.bonne ? 'Bien vu !' : 'Pas tout à fait.'}</strong> ${q.explication}</p>` : ''}</fieldset>`).join('')}
        ${etat.valide !== null ? verdictMission(etat.valide, (bonsEx + bonsQuiz) + '/' + total + ' ' + accord(total, 'bonne réponse', 'bonnes réponses') + (etat.valide ? '.' : ' : il en faut ' + d.seuil + '. Relis les explications et refais la mission.'), id)
          : `${blocAvis(id)}<div class="boutons"><button type="button" class="btn btn-citron" id="valider" ${pret && avisComplet(id) && !etat.envoi ? '' : 'disabled'}>${etat.envoi ? 'Enregistrement…' : 'Valider ma mission'}</button></div>`}
      </section>` : ''}
    </div>`;
    window.scrollTo(0, defil);
    brancherAvis(id, dessiner);
    if (SESSION && SESSION.sauver && etat.valide === null) SESSION.sauver();
    document.querySelectorAll('[data-item]').forEach((b) => { b.onclick = () => { etat.rep[Number(b.dataset.item)] = Number(b.dataset.option); dessiner(); }; });
    const ver = document.getElementById('verifier');
    if (ver) ver.onclick = () => { etat.verifie = true; dessiner(); };
    document.querySelectorAll('input[type=radio]').forEach((r) => { r.onchange = () => { etat.quiz[Number(r.name.slice(1))] = Number(r.value); dessiner(); }; });
    const v = document.getElementById('valider');
    if (v) v.onclick = async () => {
      etat.envoi = true; dessiner();
      try { const res = await envoyerMission(id, bonsEx + bonsQuiz, total); etat.valide = !!res.reussie; effacerReprise(id); SESSION = null; }
      catch (e) { toast('Enregistrement impossible', messageErreur(e)); }
      etat.envoi = false; dessiner();
    };
    const r = document.getElementById('reessayer');
    if (r) r.onclick = () => { effacerReprise(id); rendreMissionFiche(id); };
    brancherRecommencer(id, () => rendreMissionFiche(id));
    brancherRetour(id);
  };
  if (lireReprise(id)) toast('On reprend', 'Tu retrouves la mission là où tu l’avais laissée.');
  dessiner();
  window.scrollTo(0, 0);
}

function lancerVisite() {
  SESSION = null;

  const etapes = ETAPES_VISITE.filter((e) => { const el = document.querySelector(e.cible); return el && el.offsetParent !== null; });
  if (!etapes.length) return;
  VISITE = { etapes: etapes, i: 0 };

function finirVisite() {
  VISITE = null;

function montrerEtape() {
  if (!VISITE) return;
  const e = VISITE.etapes[VISITE.i];
  const el = document.querySelector(e.cible);
  if (!el) { if (VISITE.i < VISITE.etapes.length - 1) { VISITE.i++; montrerEtape(); } else finirVisite(); return; }
  document.getElementById('visite-etape').textContent = 'Visite guidée · ' + (VISITE.i + 1) + ' sur ' + VISITE.etapes.length;
  document.getElementById('visite-titre').textContent = e.titre;
  document.getElementById('visite-texte').textContent = e.texte;
  document.getElementById('visite-prec').hidden = VISITE.i === 0;
  document.getElementById('visite-suiv').textContent = VISITE.i === VISITE.etapes.length - 1 ? 'Terminer' : 'Suivant';
  const bulle = document.getElementById('visite-bulle');
  const bw = Math.min(380, window.innerWidth - 32);
  bulle.style.width = bw + 'px';
  const bh = bulle.offsetHeight || 220, marge = 8, ecart = 16;
  el.scrollIntoView({ block: 'center' });
  let r = el.getBoundingClientRect();
  const placeDessous = () => window.innerHeight - r.bottom - marge >= bh + ecart * 2;
  const placeDessus = () => r.top - marge >= bh + ecart * 2;
  if (!placeDessous() && !placeDessus()) {
    // bloc trop haut : son début vient se placer juste sous la bulle
    window.scrollBy(0, r.top - (bh + ecart * 2 + marge));
    r = el.getBoundingClientRect();
  }
  const haut = Math.max(12, r.top - marge);
  const trou = document.getElementById('visite-trou').style;
  trou.left = (r.left - marge) + 'px';
  trou.top = haut + 'px';
  trou.width = (r.width + marge * 2) + 'px';
  trou.height = Math.max(40, Math.min(r.bottom + marge, window.innerHeight - 12) - haut) + 'px';
  const top = placeDessous() ? r.bottom + marge + ecart : Math.max(ecart, r.top - marge - ecart - bh);
  bulle.style.top = top + 'px';
  bulle.style.left = Math.max(ecart, Math.min(r.left, window.innerWidth - bw - ecart)) + 'px';
  document.getElementById('visite-suiv').focus();
}

const avecPastilles = (h) => h.replace(/🟢|🟡|🟠|🔴/g, (e) => `<span class="pastille-niveau ${PASTILLES[e][0]}" role="img" aria-label="${PASTILLES[e][1]}"></span>`);
const texteBrut = (b) => (b.r || []).map((x) => x[0]).join('');
function morceauxCharte(r) {
  return (r || []).map((x) => { let h = avecPastilles(esc(x[0])); if ((x[1] || '').indexOf('i') !== -1) h = '<em>' + h + '</em>'; if ((x[1] || '').indexOf('g') !== -1) h = '<strong>' + h + '</strong>'; return h; }).join('');
}
function listeCharte(groupe) {
  const n = [0, 0];
  return `<ul class="ch-liste">${groupe.map((b) => {
    const niv = Math.min(1, b.n || 0);
    if (niv === 0) n[1] = 0;

}
function tableauCharte(l) {
  return `<div class="tableau-defilant"><table class="ch-table"><thead><tr>${l[0].map((c) => `<th>${avecPastilles(esc(c))}</th>`).join('')}</tr></thead>
    <tbody>${l.slice(1).map((ligne) => `<tr>${ligne.map((c) => `<td>${avecPastilles(esc(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
/* Blocs de la charte, avec les composants de l'Académie ; les interdictions dans l'encadré rouge */
function blocsCharte(blocs) {
  let html = '', i = 0;
  while (i < blocs.length) {
    const b = blocs[i];
    if (b.k === 'l') { const g = []; while (i < blocs.length && blocs[i].k === 'l') g.push(blocs[i++]); html += listeCharte(g); continue; }
    const interdit = (b.k === 'p' && /^(INTERDIT|INTERDICTION FORMELLE)/.test(texteBrut(b))) || (b.k === 'h' && /^Interdictions absolues/i.test(texteBrut(b)));
    if (interdit) {
      i++;
      const suite = [];
      while (i < blocs.length && (blocs[i].k === 'l' || (b.k === 'h' && blocs[i].k === 'p'))) suite.push(blocs[i++]);
      html += `<div class="ch-alerte ch-alerte-rouge"><span class="ch-marque" style="background:var(--corail)">✕</span><div class="ch-alerte-texte">
        <p style="line-height:1.6;${b.k === 'h' ? 'font-weight:800;font-size:17px' : ''}">${morceauxCharte(b.r)}</p>${blocsCharte(suite)}</div></div>`;
      continue;
    }
    if (b.k === 'h') html += b.n === 3 ? `<h3 class="ch-h3">${morceauxCharte(b.r)}</h3>` : `<h4 class="ch-h4">${morceauxCharte(b.r)}</h4>`;
    else if (b.k === 'p') html += `<p class="ch-texte">${morceauxCharte(b.r)}</p>`;
    else if (b.k === 't') html += tableauCharte(b.l);
    i++;
  }
  return html;
}

/* Lecture vérifiée : le temps d'une section ne compte que si elle est à l'écran (40 % d'elle, ou 60 % de la hauteur
   de l'écran), que l'onglet est actif et que la personne a bougé dans les 45 dernières secondes. */
const MOTS_PAR_MINUTE = 230;
function demarrerLecture(C) {
  arreterLecture();
  const cle = 'kta-lecture-' + (utilisateurConnu() || 'inconnu') + '-' + C.version;
  const etat = Object.assign({ lus: {}, secondes: 0 }, relire(cle) || {});
  const minimum = {};
  C.sections.forEach((x) => { minimum[x.num] = Math.max(10, Math.round(x.mots / MOTS_PAR_MINUTE * 60)); });
  let actif = Date.now();
  const bouger = () => { actif = Date.now(); };
  const evenements = ['scroll', 'mousemove', 'keydown', 'touchstart', 'wheel', 'pointerdown'];
  evenements.forEach((e) => window.addEventListener(e, bouger, { passive: true }));
  const aLecran = new Set();
  const obs = new IntersectionObserver((v) => v.forEach((en) => { if (en.isIntersecting) aLecran.add(en.target); else aLecran.delete(en.target); }), { threshold: [0, 0.2, 0.4, 0.6, 0.8, 1] });
  document.querySelectorAll('[data-section]').forEach((x) => obs.observe(x));
  const tic = setInterval(() => {
    if (document.visibilityState !== 'visible' || Date.now() - actif > 45000) return;
    let meilleure = null, plus = 0;
    aLecran.forEach((el) => {
      const r = el.getBoundingClientRect(), h = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0));
      if ((h >= 0.4 * r.height || h >= 0.6 * window.innerHeight) && h > plus) { plus = h; meilleure = el.dataset.section; }
    });
    if (!meilleure) return;
    etat.lus[meilleure] = (etat.lus[meilleure] || 0) + 1;
    etat.secondes++;
    memoriser(cle, etat);
    majLecture();
  }, 1000);
  LECTURE = { C, cle, etat, minimum, arreter: () => { clearInterval(tic); obs.disconnect(); evenements.forEach((e) => window.removeEventListener(e, bouger)); } };
  majLecture();
  const caseSigne = document.getElementById('charte-signe'), bouton = document.getElementById('signer-charte');
  caseSigne.onchange = () => { bouton.disabled = !caseSigne.checked; };
  bouton.onclick = () => signerCharte(C);
}
function arreterLecture() { if (LECTURE) { LECTURE.arreter(); LECTURE = null; } }
function etatLecture() {
  const L = LECTURE, nums = Object.keys(L.minimum);
  const total = nums.reduce((a, n) => a + L.minimum[n], 0), fait = nums.reduce((a, n) => a + Math.min(L.minimum[n], L.etat.lus[n] || 0), 0);
  return { lues: nums.filter((n) => (L.etat.lus[n] || 0) >= L.minimum[n]), toutes: nums.length, pct: total ? Math.floor(100 * fait / total) : 100, reste: Math.ceil((total - fait) / 60) };
}
function majLecture() {
  if (!LECTURE) return;
  const e = etatLecture();
  const t = document.getElementById('lecture-texte'), j = document.getElementById('lecture-jauge');
  if (t) t.textContent = 'Lecture : ' + e.pct + ' %' + (e.reste > 0 ? ' · environ ' + e.reste + ' min ' + (e.reste > 1 ? 'restantes' : 'restante') : ' · terminée');
  if (j) j.style.width = e.pct + '%';
  document.querySelectorAll('[data-sommaire]').forEach((b) => b.classList.toggle('lu', e.lues.indexOf(b.dataset.sommaire) !== -1));
  const c = document.getElementById('charte-signe');
  if (c) {
    const tout = e.lues.length === e.toutes;
    c.disabled = !tout;
    const aide = document.getElementById('engagement-aide');
    if (aide && tout) aide.textContent = 'Toutes les sections sont lues. Tu peux signer.';
  }
}
/* Signature : affichée tout de suite, enregistrée en arrière-plan */
function signerCharte(C) {
  const avant = JSON.parse(JSON.stringify(ETAT));
  const premiere = !ETAT.joueur.charte, n1 = ETAT.niveaux[0];
  ETAT.joueur.charte = true; ETAT.joueur.charteVersion = C.version; ETAT.joueur.charteLe = new Date().toISOString();
  ETAT.documents = ETAT.documents || [];
  const maintenant = new Date().toISOString(), aDoc = (t, v) => ETAT.documents.some((d) => d.type === t && (t === 'certification' || d.version === v));
  if (!aDoc('accuse', C.version)) ETAT.documents.push({ type: 'accuse', version: C.version, date: maintenant, pret: false });
  if (n1.complet && !aDoc('certification')) ETAT.documents.push({ type: 'certification', version: C.version, date: maintenant, pret: false });
  if (premiere && n1.complet) { ETAT.joueur.xp += 100; toast('Badge ' + n1.badge + ' obtenu !', '+100 XP : ta charte est signée et ton niveau 1 terminé.'); }
  else toast('Charte signée', 'Merci ! Version ' + C.version + '.');
  majEntete();
  arreterLecture();
  dessinerCharte(C, true);
  window.scrollTo(0, 0);
  ecrireServeur('signerCharte', [C.version], nouvelleCle('charte'), (frais) => { if (frais && frais.joueur) { ETAT = frais; majEntete(); } }, (e) => {
    ETAT = avant; majEntete();
    toast('Signature non enregistrée', messageErreur(e));
    if (pageAffichee('charte')) rendreCharteComplete(true);
  });
}

/* Le fichier archivé, reçu du serveur, enregistré tel quel */
async function telechargerDocument(bouton) {
  const texte = bouton.textContent;
  bouton.disabled = true; bouton.textContent = 'Préparation…';
  try {
    const f = await appel('telechargerDocument', bouton.dataset.document, bouton.dataset.version);
    const octets = Uint8Array.from(atob(f.contenu), (c) => c.charCodeAt(0));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([octets], { type: 'application/pdf' }));
    a.download = f.nom;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Document téléchargé', f.nom);
  } catch (e) { toast('Téléchargement impossible', messageErreur(e)); }
  bouton.disabled = false; bouton.textContent = texte;
}
/* Accueil : un nouveau document est annoncé une fois ; la certification en attente de la charte */
function carteDocuments() {
  if (certificationEnAttente()) return `<section class="carte entre etape0"><div style="display:flex;flex-direction:column;gap:6px;flex:1 1 380px"><p class="surtitre">Certification du niveau 1</p>

    <button type="button" class="btn btn-citron" data-aller="etape0">Lire la charte</button></section>`;
  const cle = cleLocale('documents-vus') ? 'kta-documents-vus-' + utilisateurConnu() : null;
  const vus = (cle && relire(cle)) || [], nouveaux = (ETAT.documents || []).filter((d) => vus.indexOf(d.type + '-' + d.version) === -1);
  if (!nouveaux.length) return '';
  if (cle) memoriser(cle, vus.concat(nouveaux.map((d) => d.type + '-' + d.version)));
  return `<section class="carte entre etape0"><div style="display:flex;flex-direction:column;gap:6px;flex:1 1 380px"><p class="surtitre">Nouveau document</p>
    <p class="titre" style="font-size:22px">${esc(NOM_DOCUMENT[nouveaux[0].type])}${nouveaux.length > 1 ? ' et ' + (nouveaux.length - 1) + ' autre' + (nouveaux.length > 2 ? 's' : '') : ''}</p><p class="doux">Il t’attend dans Mon profil, prêt à télécharger.</p></div>
    <button type="button" class="btn btn-citron" data-aller="profil">Voir mes documents</button></section>`;
}

const ATT = { document: '', version: '', vues: 50 };

  const D = lireDonnees('documents');
  if (!D || Date.now() - D.t >= FRAICHEUR) chargerDonnees('documents', 'getDocumentsAdmin').then(() => { if (ADMIN_ONGLET === 'attestations' && pageAffichee('admin')) { document.body.classList.add('sans-anim'); dessinerAdmin(ADMIN, true); } }).catch((e) => toast('Attestations', messageErreur(e)));

  const tous = deplier(D.d), versions = [...new Set(tous.filter((d) => d.document === 'accuse').map((d) => d.version))].sort().reverse();
  const liste = tous.filter((d) => (!ATT.document || d.document === ATT.document) && (!ATT.version || d.version === ATT.version)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const pastille = (cle, v, t) => `<button type="button" class="pastille-filtre" data-att="${cle}" data-valeur="${esc(v)}" aria-pressed="${ATT[cle] === v}">${t}</button>`;

    ${versions.length > 1 ? `<div class="cat-filtres"><span class="libelle">Version de la charte</span>${pastille('version', '', 'Toutes')}${versions.map((v) => pastille('version', v, 'v' + esc(v))).join('')}</div>` : ''}
    <p class="doux" style="font-weight:700">${nbr(liste.length)} ${accord(liste.length, 'document', 'documents')}</p>
    <div class="tableau-defilant"><table class="table-admin"><thead><tr><th>Nom</th><th>Document</th><th>Version</th><th>Date</th><th>PDF</th></tr></thead><tbody>
      ${liste.slice(0, ATT.vues).map((d) => `<tr><td><strong>${esc(d.nom)}</strong><br><span class="doux" style="font-size:12px">${esc(d.email)}</span></td>
        <td>${d.document === 'accuse' ? 'Accusé de réception' : 'Certification niveau 1'}</td><td>${esc(d.version)}</td><td>${d.date ? dateCourte(d.date) : ''}</td>
        <td>${d.lien ? `<a href="${esc(d.lien)}" target="_blank" rel="noopener">Ouvrir</a>` : '<span class="doux">en cours</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="doux">Aucun document pour l’instant.</td></tr>'}

    ${liste.length > ATT.vues ? `<button type="button" class="btn btn-contour" id="att-suite" style="align-self:center">Afficher les suivants</button>` : ''}
  </section>`;
}
function brancherAttestations() {
  document.querySelectorAll('[data-att]').forEach((b) => { b.onclick = () => { ATT[b.dataset.att] = b.dataset.valeur; ATT.vues = 50; document.body.classList.add('sans-anim'); dessinerAdmin(ADMIN, true); }; });
  const suite = document.getElementById('att-suite');
  if (suite) suite.onclick = () => { ATT.vues += 50; document.body.classList.add('sans-anim'); dessinerAdmin(ADMIN, true); };
  const ex = document.getElementById('exporter-documents');
  if (ex) ex.onclick = () => exporterDocuments(ex);
}
/* Liste pour un auditeur, en PDF (A4 paysage) */
async function exporterDocuments(bouton) {
  const D = lireDonnees('documents');
  if (!D) return;
  bouton.disabled = true;
  try {
    const JsPDF = await chargerTableauPDF(), doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
    const propre = (t) => String(t == null ? '' : t).replace(/[’‘]/g, "'");
    const liste = deplier(D.d).filter((d) => (!ATT.document || d.document === ATT.document) && (!ATT.version || d.version === ATT.version));
    doc.autoTable({ startY: 26, margin: { top: 26, left: 14, right: 14, bottom: 16 },
      head: [['Nom', 'Adresse', 'Document', 'Version de la charte', 'Date', 'Fichier archivé']],
      body: liste.map((d) => [propre(d.nom), d.email, d.document === 'accuse' ? 'Accusé de réception' : 'Certification niveau 1', d.version, d.date ? dateCourte(d.date) : '', d.lien ? 'oui' : 'en cours']),
      showHead: 'everyPage', theme: 'grid', styles: { font: 'helvetica', fontSize: 8, cellPadding: 2, textColor: [21, 20, 47] },
      headStyles: { fillColor: [99, 69, 240], textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [243, 243, 248] },
      didDrawPage: () => { doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(21, 20, 47); doc.text(propre('Accusés de réception et certifications · Académie IA'), 14, 16);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(85, 83, 122); doc.text(new Date().toLocaleDateString('fr-FR'), 283, 16, { align: 'right' }); } });
    const n = doc.getNumberOfPages();
    for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(8); doc.text('Page ' + p + ' / ' + n, 283, 203, { align: 'right' }); }
    doc.save('attestations-academie-' + new Date().toISOString().slice(0, 10) + '.pdf');
  } catch (e) { toast('Export impossible', messageErreur(e)); }
  bouton.disabled = false;
}

/* Consommation de Firestore (offre gratuite) : relevé de chaque heure, alerte aux administrateurs à 70 % puis 90 % */
function blocConso(A) {
  if (!A.firestore && !A.conso) return '';
  const c = A.conso;
  const titre = '<h2 class="sous-titre-admin">Consommation de Firestore (quota gratuit du jour)</h2>';
  if (!c) return titre + '<p class="doux" style="font-size:14px;line-height:1.55">Premier relevé dans l’heure.</p>';
  const heure = (iso) => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const ligne = (cle, libelle) => {
    const q = c.quotas[cle], n = Number(c[cle]) || 0, pct = Math.round(100 * n / q);
    const hier = c.hier ? Math.round(100 * (Number(c.hier[cle]) || 0) / q) : null;
    return `<div class="item-admin" style="flex-wrap:wrap;gap:8px"><span style="flex:1 1 220px;line-height:1.5"><strong>${libelle}</strong><br>
      <span class="doux" style="font-size:13px">${nbr(n)} sur ${nbr(q)}${hier === null ? '' : ' · hier : ' + hier + ' %'}</span></span>
      <strong style="font-size:22px${pct >= 70 ? ';color:var(--corail)' : ''}">${pct} %${pct >= 90 ? ' · critique' : pct >= 70 ? ' · alerte' : ''}</strong></div>`;
  };
  const source = c.source === 'mesure'
    ? 'Mesure Cloud Monitoring' + (Number(c.coef) && Number(c.coef) !== 1 ? ', corrigée par l’étalonnage (× ' + String(c.coef).replace('.', ',') + ')' : '')
    : 'Estimation à partir de l’activité du jour : ' + nbr(c.actifs) + ' ' + accord(c.actifs, 'visite', 'visites') + ' et ' + nbr(c.nouveaux) + ' ' + accord(c.nouveaux, 'inscription', 'inscriptions') + ' depuis 9 h, avec les coûts mesurés au test de charge';
  return titre + ligne('lectures', 'Lectures') + ligne('ecritures', 'Écritures') + ligne('suppressions', 'Suppressions')
    + `<p class="doux" style="font-size:14px;line-height:1.55">${esc(source)}. Relevé à ${heure(c.releveLe)}, chaque heure. Le quota repart à zéro chaque jour à 9 h. Au-delà de 100 %, l’Académie est bloquée jusqu’au lendemain 9 h : les administrateurs reçoivent un message Slack à 70 % puis à 90 %.</p>`;
}

function ouvrirModaleSite() {
  const modale = document.getElementById('modale-site'), valider = document.getElementById('valider-site');
  let site = ETAT.joueur.site || null, cabinet = ETAT.joueur.cabinet || null;
  const pret = () => { valider.disabled = !(site && cabinet); };
  /* Un seul choix « Ville · Cabinet » (implantations du groupe), par ordre alphabétique ; les sites offshore gardent leur seul nom */
  const choix = (ETAT.implantations || []).map(([s, c]) => ({ site: s, cabinet: c, libelle: siteCab(s, c) }))
    .sort((a, b) => a.libelle.localeCompare(b.libelle, 'fr', { sensitivity: 'base' }));
  const dessiner = () => {
    const zone = document.getElementById('liste-cabinets');
    zone.innerHTML = choix.map((x) => `<button type="button" aria-pressed="${x.site === site && x.cabinet === cabinet}" data-valeur="${esc(x.site + '|' + x.cabinet)}">${esc(x.libelle)}</button>`).join('');
    zone.querySelectorAll('button').forEach((b) => { b.onclick = () => { [site, cabinet] = b.dataset.valeur.split('|'); dessiner(); }; });
    pret();
  };
  valider.onclick = () => {
    const avant = { site: ETAT.joueur.site, cabinet: ETAT.joueur.cabinet };
    ETAT.joueur.site = site; ETAT.joueur.cabinet = cabinet; modale.hidden = true; majEntete();
    if (pageAffichee('accueil') || !document.querySelector('.nav [aria-current="page"]')) rendreAccueil(); else if (document.querySelector('.profil-entete')) rendreProfil();
    proposerVisite();
    ecrireServeur('choisirSite', [site, cabinet], nouvelleCle('site'), (frais) => { if (frais && frais.joueur) { ETAT = frais; majEntete(); } }, (e) => {
      ETAT.joueur.site = avant.site; ETAT.joueur.cabinet = avant.cabinet; majEntete();
      toast('Choix non enregistré', messageErreur(e));
      if (!avant.site || !avant.cabinet) ouvrirModaleSite();
    });
  };
  dessiner();
  modale.hidden = false;
}

    rendreAccueil(aller.dataset.aller);

let PAGE_DEMANDEE_FAITE = false;
/* #webinaire-<id> : gardé le temps de la connexion Google (la page peut se recharger), puis ouvert */
const ANCRE_DEMANDEE = (() => {
  let a = '';
  try { a = decodeURIComponent(location.hash || ''); } catch (e) { a = location.hash || ''; }
  try { if (/^#webinaire-/.test(a)) sessionStorage.setItem('kta-ancre', a); else a = sessionStorage.getItem('kta-ancre') || ''; } catch (e) { }
  return a;
})();
function ouvrirAncre(ancre) {
  if (!/^#webinaire-./.test(ancre || '')) return false;
  try { sessionStorage.removeItem('kta-ancre'); } catch (e) { }
  rendreWebinaires(ancre.slice('#webinaire-'.length));
  return true;
}
function ouvrirPageDemandee() {
  if (PAGE_DEMANDEE_FAITE) return;
  PAGE_DEMANDEE_FAITE = true;
  try {
    google.script.url.getLocation((loc) => {
      const page = loc && loc.parameter ? loc.parameter.page : '';
      if (!ETAT) return;
      if (ouvrirAncre(ANCRE_DEMANDEE || (typeof loc !== 'undefined' && loc && loc.hash ? '#' + decodeURIComponent(loc.hash) : ''))) return;
      if (page === 'webinaires') { rendreWebinaires(); return; }
      if (!page) return;
      if (page === 'quiz' && ETAT.quiz) rendreQuizMois();
      else if (page.indexOf('mission-') === 0) ouvrirMission(page.slice(8));
      else if (page === 'charte') rendreCharteComplete();
      else if (page === 'etape0') rendreCharteComplete(true);
      else if (page === 'lexique') rendreLexique();
      else if (page === 'carte' || page === 'progression') rendreProgression();
      else if (page === 'ligue' || page === 'classement') rendreClassement();
      else if (page === 'profil') rendreProfil();
      else if (page === 'equipe' && ETAT.manager) rendreEquipe();
    });
  } catch (e) { /* hors Apps Script : rien à faire */ }
}

window.addEventListener('error', (e) => afficherPanne('Un problème est survenu', (e && e.message) || 'Erreur inconnue'));
window.addEventListener('unhandledrejection', (e) => afficherPanne('Un problème est survenu', messageErreur(e && e.reason)));
setTimeout(() => { if (!ETAT) afficherPanne('Le chargement prend plus de temps que prévu', 'Le serveur de l’Académie n’a pas encore répondu après 8 secondes.'); }, 8000);

(async function demarrer() {
  if (!window.KTA_CONFIG && !(window.google && window.google['scr' + 'ipt'])) {
    afficherPanne('Ce n’est pas le bon fichier', 'Cette page est la version Apps Script de l’Académie : elle ne fonctionne que dans Apps Script. Sur GitHub, déposez le fichier index.html de la version hébergée.');
    return;
  }
  // 0. La page est arrivée avec les données (cas le plus courant) : affichage immédiat, aucun appel
  if (window.ETAT_INITIAL && window.ETAT_INITIAL.joueur) {
    try {
      ETAT = window.ETAT_INITIAL;
      installerEtat(true);
      if (!ETAT.joueur.site || !ETAT.joueur.cabinet) ouvrirModaleSite(); else { ouvrirPageDemandee(); proposerVisite(); }
      appel('noterVisite').catch(() => {});
      renvoyerAttentes();
      nettoyerAnciennesDonnees();
      precharger();
      return;
    } catch (e) { console.error(e); ETAT = null; }
  }
  // 1. Affichage immédiat avec la dernière version connue (deuxième visite et suivantes)
  nettoyerAnciennesDonnees();
  const cleEtat = cleLocale('etat'), connu = cleEtat ? relire(cleEtat) : null;
  let vueAccueil = false;
  if (connu && connu.joueur) {
    try { ETAT = connu; installerEtat(true); vueAccueil = true; }
    catch (e) { ETAT = null; vueAccueil = false; memoriser(cleEtat, null); }
  }
  try {
    // 2. Données fraîches en arrière-plan ; l'accueil est redessiné sans animation s'il a changé
    const frais = await envoyerAvecReprise('getEtat', []);   /* serveur occupé : nouvelles tentatives espacées */
    const change = hacher(JSON.stringify(frais)) !== hacher(JSON.stringify(ETAT));
    const surAccueil = vueAccueil && document.querySelector('#prochaine') !== null;
    ETAT = frais;
    if (!vueAccueil) installerEtat(true);
    else {
      installerEtat(false);
      if (change && surAccueil) { document.body.classList.add('sans-anim'); rendreAccueil(); }
    }
    renvoyerAttentes();
    if (!ETAT.joueur.site || !ETAT.joueur.cabinet) ouvrirModaleSite(); else { ouvrirPageDemandee(); proposerVisite(); }
    nettoyerAnciennesDonnees();
    precharger();
  } catch (e) {
    if (vueAccueil) { toast('Serveur injoignable', 'Tu vois les données de ta dernière visite. Recharge la page dans un instant.'); return; }
    afficherPanne('L’Académie n’a pas pu se charger', messageErreur(e));
  }
})();
</script>
