rops = PropertiesService.getScriptProperties();\n  const traites = JSON.parse(props.getProperty('LIVES_TRAITES') || '[]');\n  const debut = new Date(Date.now() - 4 * 86400000);\n  const evenements = Calendar.Events.list('primary', {\n    timeMin: debut.toISOString(), timeMax: new Date().toISOString(), singleEvents: true,\n    q: CONFIG.TITRE_LIVE, maxResults: 50\n  }).items || [];\n\n  evenements.forEach(function (ev) {\n    if (traites.indexOf(ev.id) !== -1 || String(ev.summary || '').indexOf(CONFIG.TITRE_LIVE) !== 0) return;\n    const rapport = (ev.attachments || []).filter(function (a) {\n      return a.mimeType === 'application/vnd.google-apps.spreadsheet' && /pr[ée]sence|attendance/i.test(a.title || '');\n    })[0];\n    if (!rapport) return; // rapport pas encore disponible : on réessaiera demain\n    const valeurs = SpreadsheetApp.openById(rapport.fileId).getSheets()[0].getDataRange().getValues();\n    const h = valeurs.findIndex(function (ligne) { return ligne.some(function (c) { return /mail/i.test(String(c)); }); });\n    if (h === -1) return;\n    const col = valeurs[h].findIndex(function (c) { return /mail/i.test(String(c)); });\n    const presents = {};\n    valeurs.slice(h + 1).forEach(function (ligne) {\n      const e = String(ligne[col] || '').trim().toLowerCase();\n      if (e.indexOf('@') !== -1) presents[e] = true;\n    });\n    const sujet = String(ev.summary).replace(CONFIG.TITRE_LIVE, '').replace(/^\\s*[:\\-–]\\s*/, '') || 'le live';\n    const bonusFs = [];\n    avecVerrou_(function () {\n      Object.keys(presents).forEach(function (email) {\n        const j = trouverJoueur_(email);\n        if (!j) return;\n        maj_('Joueurs', j._ligne, 'XP', (Number(j.XP) || 0) + XP_LIVE);\n        journal_(email, j['Prénom'], j.Site, 'a assisté au live ' + sujet, XP_LIVE);\n        bonusFs.push(email);\n      });\n    });\n    bonusFs.forEach(function (email) { ajouterBonusFs_(email, XP_LIVE); });   // hors verrou\n    traites.push(ev.id);\n  });\n  props.setProperty('LIVES_TRAITES', JSON.stringify(traites.slice(-100)));\n  if (evenements.length) nouvelleVersionEtat_();\n}\n\n/* Le premier jour ouvré du mois, annonce le Kerogoat du mois précédent */\nfunction annoncerKerogoat() {\n  const auj = new Date();\n  if (auj.getDay() === 0 || auj.getDay() === 6) return;\n  const premierOuvre = new Date(auj.getFullYear(), auj.getMonth(), 1);\n  while (premierOuvre.getDay() === 0 || premierOuvre.getDay() === 6) premierOuvre.setDate(premierOuvre.getDate() + 1);\n  if (auj.getDate() !== premierOuvre.getDate()) return;\n  const props = PropertiesService.getScriptProperties();\n  const cle = auj.getFullYear() + '-' + (auj.getMonth() + 1);\n  if (props.getProperty('KEROGOAT_ANNONCE') === cle) return;\n\n  const precedent = new Date(auj.getFullYear(), auj.getMonth() - 1, 1);\n  const gagnant = meilleurDuMois_(lignes_('Journal', 5000), precedent.getFullYear(), precedent.getMonth());\n  if (!gagnant) { props.setProperty('KEROGOAT_ANNONCE', cle); return; }\n  const mois = Utilities.formatDate(precedent, 'Europe/Paris', 'MMMM');\n  const nomsMois = { January: 'janvier', February: 'février', March: 'mars', April: 'avril', May: 'mai', June: 'juin', July: 'juillet',\n    August: 'août', September: 'septembre', October: 'octobre', November: 'novembre', December: 'décembre' };\n  const texte = '🐐 *Kerogoat du mois de ' + (nomsMois[mois] || mois) + '* : ' + gagnant.prenom\n    + (gagnant.site ? ' (' + gagnant.site + ')' : '') + ' avec ' + gagnant.xp + ' XP gagnés. Bravo 👏\\nLe titre de ce mois-ci est à prendre !';\n  const canal = canalAnnonces_();\n  if (!canal) return;\n  const blocs = [{ type: 'section', text: { type: 'mrkdwn', text: texte } }];\n  if (urlApp_()) blocs.push({ type: 'actions', elements: [{ type: 'button', style: 'primary',\n    text: { type: 'plain_text', text: \"Ouvrir l'Académie\" }, url: urlApp_() }] });\n  if (slack_('chat.postMessage', { channel: canal, text: texte, blocks: blocs }).ok) props.setProperty('KEROGOAT_ANNONCE', cle);\n}\n\n/* ------------------------------------------------------------------ */\n/* Rédaction automatique des contenus du mois (API Claude)             */\n/* Sources : Catalogue Kerogo Tools, #kerogo-tools, données de         */\n/* l'Académie, notes de l'équipe. Tout arrive en brouillon à valider.  */\n/* ------------------------------------------------------------------ */\n\nfunction genererSiBesoin() {\n  if (!cleClaude_() || new Date().getDate() < CONFIG.JOUR_GENERATION) return;\n  const cible = moisDecale_(1);\n  if (PropertiesService.getScriptProperties().getProperty('GENERATION_MOIS') === cible) return;\n  genererContenusMois_(cible);\n}\n\nfunction genererContenusMois_(mois) {\n  const props = PropertiesService.getScriptProperties();\n  const sources = collecterSources_();\n  const r = appelerClaude_(sources, mois);\n  const annee = Number(mois.split('-')[0]), m = Number(mois.split('-')[1]) - 1;\n  const contenus = [];\n  if (r.article && r.article.titre) contenus.push([jourOuvre_(annee, m, 1), 'Article', r.article]);\n  const quiz = (r.quiz || []).filter(function (q) { return q && q.question && q.a && q.b && LETTRES.indexOf(String(q.bonne).toUpperCase()) !== -1; });\n  if (quiz.length) contenus.push([jourOuvre_(annee, m, 3), 'Quiz du mois', annonceQuiz_(mois, quiz.length)]);\n  if (r.focus && r.focus.titre) contenus.push([jourOuvre_(annee, m, 8), 'Focus compétence', r.focus]);\n  if (r.cas && r.cas.titre) contenus.push([jourOuvre_(annee, m, 15), 'Cas du mois', r.cas]);\n\n  avecVerrou_(function () {\n    // Une nouvelle rédaction remplace les brouillons encore non validés du même mois\n    supprimerBrouillons_(mois);\n    contenus.forEach(function (c) { ajouter_('Calendrier', [c[0], c[1], c[2].titre, aererRubriques_(c[2].texte || ''), '', '', 'Brouillon']); });\n    quiz.forEach(function (q) {\n      ajouter_('Quiz', [\"'\" + mois, q.question, q.a, q.b, q.c || '', String(q.bonne).toUpperCase(), q.explication || '', 'Brouillon']);\n    });\n    lignes_('Notes').forEach(function (n) { if (!n['Utilisée le']) maj_('Notes', n._ligne, 'Utilisée le', new Date()); });\n  });\n  const attente = props.getProperty('CATALOGUE_INSTANTANE_ATTENTE');\n  if (attente) props.setProperty('CATALOGUE_INSTANTANE', attente);\n  props.setProperty('GENERATION_MOIS', mois);\n  props.setProperty('GENERATION_DERNIERE', new Date().toISOString());\n\n  const message = '📝 Les brouillons de ' + libelleMois_(mois) + ' sont prêts : ' + contenus.length + ' contenu(s) et '\n    + quiz.length + ' question(s) de quiz à relire et valider dans l\\'espace admin. Rien ne sera publié sans votre validation.';\n  admins_().forEach(function (email) { try { envoyerMP_({ Email: email }, message, 'Relire les brouillons'); } catch (e) { } });\n}\n\nfunction supprimerBrouillons_(mois) {\n  const cal = lignes_('Calendrier').filter(function (c) { return c.Statut === 'Brouillon' && !c['Publié le'] && c.Date && moisDe_(new Date(c.Date)) === mois; });\n  cal.map(function (c) { return c._ligne; }).sort(function (a, b) { return b - a; }).forEach(function (l) { feuille_('Calendrier').deleteRow(l); });\n  invalider_('Calendrier');\n  const qz = lignes_('Quiz').filter(function (q) { return q.Statut === 'Brouillon' && moisDe_(q.Mois) === mois; });\n  qz.map(function (q) { return q._ligne; }).sort(function (a, b) { return b - a; }).forEach(function (l) { feuille_('Quiz').deleteRow(l); });\n  invalider_('Quiz');\n}\n\nfunction collecterSources_() {\n  const parties = [];\n  const bloc = function (titre, fn) {\n    try { parties.push('## ' + titre + '\\n' + fn()); }\n    catch (e) { parties.push('## ' + titre + '\\n(indisponible : ' + e.message + ')'); }\n  };\n  bloc('Catalogue Kerogo Tools (demandes, statuts, compétences)', resumeCatalogue_);\n  bloc('Canal #kerogo-tools, 30 derniers jours (messages les plus appréciés en premier)', resumeCanal_);\n  bloc(\"Données de l'Académie\", resumeAcademie_);\n  const notes = lignes_('Notes').filter(function (n) { return !n['Utilisée le'] && n.Note; });\n  if (notes.length) parties.push(\"## Notes de l'équipe Dev Ops\\n\" + notes.map(function (n) { return '- ' + n.Note; }).join('\\n'));\n  return parties.join('\\n\\n');\n}\n\nfunction resumeCatalogue_() {\n  let items = [], curseur = '';\n  do {\n    const p = { list_id: CONFIG.LISTE_CATALOGUE, limit: 100 };\n    if (curseur) p.cursor = curseur;\n    const r = slack_('slackLists.items.list', p);\n    if (!r.ok) throw new Error(r.error + (r.error === 'missing_scope' ? ' (ajoutez la permission lists:read)' : ''));\n    items = items.concat(r.items || []);\n    curseur = (r.response_metadata && r.response_metadata.next_cursor) || '';\n  } while (curseur);\n  if (!items.length) return '(liste vide)';\n\n  const schema = chercherSchema_(slack_('slackLists.items.info', { list_id: CONFIG.LISTE_CATALOGUE, id: items[0].id })) || [];\n  const colonnes = {};\n  schema.forEach(function (c) { colonnes[c.id || c.key] = c; });\n  const props = PropertiesService.getScriptProperties();\n  const avant = props.getProperty('CATALOGUE_INSTANTANE');\n  const precedent = avant ? JSON.parse(avant) : null;\n  const instantane = {};\n\n  const lignes = items.map(function (item) {\n    const champs = {};\n    (item.fields || []).forEach(function (f) {\n      const col = colonnes[f.column_id || f.key];\n      if (!col) return;\n      const v = valeurChamp_(f, col);\n      if (v) champs[col.name] = v.slice(0, 300);\n    });\n    const statut = champs['Statut traitement'] || '';\n    instantane[item.id] = statut;\n    let evolution = '';\n    if (precedent && !(item.id in precedent)) evolution = ' [NOUVELLE DEMANDE ce mois-ci]';\n    else if (precedent && precedent[item.id] !== statut) evolution = ' [STATUT CHANGÉ ce mois-ci : ' + (precedent[item.id] || 'aucun') + ' → ' + statut + ']';\n    return '- ' + Object.keys(champs).map(function (k) { return k + ' : ' + champs[k]; }).join(' | ') + evolution;\n  });\n  props.setProperty('CATALOGUE_INSTANTANE_ATTENTE', JSON.stringify(instantane));\n  return lignes.join('\\n').slice(0, 30000);\n}\n\n/* ------------------------------------------------------------------ */\n/* Catalogue Kerogo Tools : la liste Slack, lue par le serveur          */\n/* Gardé 30 minutes ; une copie de secours (6 heures) sert si le cache  */\n/* frais a expiré, pour ne jamais faire attendre Slack pendant un pic.  */\n/* Préparé chaque heure par prechaufferCaches.                         */\n/* ------------------------------------------------------------------ */\nconst STATUTS_CATALOGUE = ['En service', 'Pilote', 'Bientôt'];\nconst CHAMPS_CATALOGUE = { titre: 'Titre', service: 'Service', role: 'À quoi ça sert', pourQui: 'Pour qui', acces: 'Accès', type: 'Type',\n  lancer: 'Comment le lancer', statut: 'Statut déploiement', fiche: 'Fiche', outil: 'Outil', lien: 'Lien de la compétence' };\n\nfunction getCatalogue() {\n  emailCourant_();\n  const cache = cache_();\n  const frais = lireGrand_(cache, 'CATALOGUE') || lireGrand_(cache, 'CATALOGUE_SECOURS');\n  if (frais) return JSON.parse(frais);\n  return preparerCatalogue_();\n}\n\nfunction preparerCatalogue_() {\n  let items = [], curseur = '';\n  do {\n    const p = { list_id: CONFIG.LISTE_CATALOGUE, limit: 100 };\n    if (curseur) p.cursor = curseur;\n    const r = slack_('slackLists.items.list', p);\n    if (!r.ok) throw new Error('Catalogue indisponible (' + r.error + ').');\n    items = items.concat(r.items || []);\n    curseur = (r.response_metadata && r.response_metadata.next_cursor) || '';\n  } while (curseur);\n  const schema = items.length ? chercherSchema_(slack_('slackLists.items.info', { list_id: CONFIG.LISTE_CATALOGUE, id: items[0].id })) || [] : [];\n  const colonnes = {};\n  schema.forEach(function (col) { colonnes[col.id || col.key] = col; });\n  const norm = function (t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, ''); };\n  const cles = {};\n  Object.keys(CHAMPS_CATALOGUE).forEach(function (k) { cles[norm(CHAMPS_CATALOGUE[k])] = k; });\n  const ordre = function (s) { const i = STATUTS_CATALOGUE.indexOf(s); return i === -1 ? 9 : i; };\n  const outils = items.map(function (item) {\n    const o = { id: item.id, slack: CONFIG.LIEN_ELEMENT_CATALOGUE + item.id };\n    (item.fields || []).forEach(function (f) {\n      const col = colonnes[f.column_id || f.key];\n      if (!col) return;\n      const nom = norm(col.name);\n      const k = cles[nom] || Object.keys(cles).filter(function (x) { return nom.indexOf(x) === 0; }).map(function (x) { return cles[x]; })[0];\n      if (!k) return;\n      o[k] = k === 'fiche' || k === 'lien' ? (lienChamp_(f) || valeurChamp_(f, col)) : valeurChamp_(f, col);\n    });\n    return o;\n  }).filter(function (o) { return o.titre && STATUTS_CATALOGUE.indexOf(o.statut) !== -1; })\n    .sort(function (a, b) { return ordre(a.statut) - ordre(b.statut) || String(a.titre).localeCompare(String(b.titre), 'fr'); });\n  const res = serialiser_({ outils: outils, cabinets: CONFIG.CABINETS, prepareLe: dateIso_(new Date()) });\n  const json = JSON.stringify(res), cache = cache_();\n  ecrireGrand_(cache, 'CATALOGUE', json, 1800);\n  ecrireGrand_(cache, 'CATALOGUE_SECOURS', json, 21600);\n  return res;\n}\n\n/* Déclencheur toutes les 5 minutes : relit la liste Slack ; Firestore n'est réécrit que si le catalogue a changé (empreinte) */\nfunction rafraichirCatalogue() {\n  if (!versionActivee_()) return;\n  const c = preparerCatalogue_();\n  if (firestoreActif_()) publierPublics_(['catalogue']);\n  return c;\n}\n/* Admin › Réglages : « Mettre à jour le catalogue » */\nfunction mettreAJourCatalogue() {\n  verifierAdmin_();\n  rafraichirCatalogue();\n  return getAdmin();\n}\n\n/* À lancer depuis l'éditeur après une modification de la liste : affiche ce que l'Académie en lit */\nfunction verifierCatalogue() {\n  const c = preparerCatalogue_();\n  console.log(c.outils.length + ' outil(s) gardé(s) (En service, Pilote, Bientôt).');\n  c.outils.slice(0, 5).forEach(function (o) { console.log(JSON.stringify(o)); });\n  const vides = Object.keys(CHAMPS_CATALOGUE).filter(function (k) { return !c.outils.some(function (o) { return o[k]; }); });\n  if (vides.length) console.warn('Colonnes jamais trouvées : ' + vides.map(function (k) { return CHAMPS_CATALOGUE[k]; }).join(', ') + '. Vérifiez leur nom dans la liste Slack.');\n}\n\n/* Premier lien (http…) trouvé dans un champ de la liste Slack */\nfunction lienChamp_(f) {\n  if (!f) return '';\n  if (typeof f === 'string') return /^https?:/.test(f) ? f : '';\n  if (typeof f === 'object') {\n    if (f.url && /^https?:/.test(f.url)) return f.url;\n    if (f.original_url && /^https?:/.test(f.original_url)) return f.original_url;\n    for (const k in f) { const l = lienChamp_(f[k]); if (l) return l; }\n  }\n  return '';\n}\n\n/* Cache des données de plus de 100 Ko : découpées en morceaux */\nfunction ecrireGrand_(cache, cle, texte, duree) {\n  const morceaux = {}, n = Math.ceil(texte.length / 90000) || 1;\n  for (let i = 0; i < n; i++) morceaux[cle + '_' + i] = texte.slice(i * 90000, (i + 1) * 90000);\n  morceaux[cle] = String(n);\n  cache.putAll(morceaux, duree);\n}\nfunction lireGrand_(cache, cle) {\n  const n = Number(cache.get(cle));\n  if (!n) return null;\n  const cles = []; for (let i = 0; i < n; i++) cles.push(cle + '_' + i);\n  const v = cache.getAll(cles);\n  if (cles.some(function (k) { return v[k] == null; })) return null;\n  return cles.map(function (k) { return v[k]; }).join('');\n}\n\n/* ------------------------------------------------------------------ */\n/* Webinaires : programme lu dans l'agenda de Katia, inscription par    */\n/* la liste Slack « Inscriptions Kerogo Tools webinar ».                */\n/* L'Académie n'écrit jamais dans l'agenda : le script des webinaires   */\n/* (toutes les minutes) ajoute la personne aux invités, confirme et     */\n/* rappelle sur Slack. Il reste ainsi le seul à modifier les invités.   */\n/* ------------------------------------------------------------------ */\n\n/* Programme commun (avec les invités et le lien Meet : jamais envoyés tels quels à la page) */\nfunction webinairesCommuns_(refaire) {\n  const cache = cache_();\n  if (!refaire) { const v = cache.get('WEBINAIRES') || cache.get('WEBINAIRES_SECOURS'); if (v) return JSON.parse(v); }\n  const maintenant = new Date(), dans6mois = new Date(maintenant.getTime() + 183 * 86400000);\n  const norm = function (t) { return String(t || '').replace(/[’‘`]/g, \"'\").replace(/\\s+/g, ' ').trim().toLowerCase(); };\n  const r = Calendar.Events.list('primary', { timeMin: maintenant.toISOString(), timeMax: dans6mois.toISOString(),\n    singleEvents: true, orderBy: 'startTime', q: CONFIG.TITRE_LIVE, maxResults: 50 });\n  const liste = (r.items || []).filter(function (ev) {\n    return ev.status !== 'cancelled' && ev.start && ev.start.dateTime && norm(ev.summary).indexOf(norm(CONFIG.TITRE_LIVE)) === 0;\n  }).map(function (ev) {\n    const debut = new Date(ev.start.dateTime), fin = new Date((ev.end && ev.end.dateTime) || debut.getTime() + 3600000);\n    const video = ev.conferenceData && (ev.conferenceData.entryPoints || []).filter(function (p) { return p.entryPointType === 'video'; })[0];\n    const invites = (ev.attendees || []).filter(function (a) { return a.email && !a.organizer && !a.resource && a.responseStatus !== 'declined'; })\n      .map(function (a) { return String(a.email).toLowerCase(); });\n    return { id: ev.id, titre: String(ev.summary).slice(CONFIG.TITRE_LIVE.length).replace(/^\\s*[:\\-–·]\\s*/, '').trim() || 'Kerogo Tools webinar',\n      debut: debut.toISOString(), fin: fin.toISOString(), duree: Math.round((fin - debut) / 60000),\n      description: nettoyerDescription_(ev.description), invites: invites, lien: ev.hangoutLink || (video && video.uri) || '' };\n  });\n  const json = JSON.stringify(liste);\n  try { cache.put('WEBINAIRES', json, 900); cache.put('WEBINAIRES_SECOURS', json, 21600); } catch (e) { }\n  return liste;\n}\n\nfunction nettoyerDescription_(html) {\n  if (!html) return '';\n  const texte = String(html).replace(/<br\\s*\\/?>/gi, '\\n').replace(/<\\/p>/gi, '\\n').replace(/<[^>]+>/g, '')\n    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')\n    .replace(/&#39;|&apos;/g, \"'\").replace(/&quot;/g, '\"').replace(/\\n{3,}/g, '\\n\\n').trim();\n  return texte.length > 800 ? texte.slice(0, 800).trim() + '…' : texte;\n}\n\n/* Inscriptions envoyées depuis l'Académie, pas encore visibles dans l'agenda */\nfunction demandesWebinaire_(email) { const v = cache_().get('WEBI_' + cleCache_(email)); return v ? JSON.parse(v) : []; }\n\nfunction getWebinaires() {\n  const email = emailCourant_(), demandes = demandesWebinaire_(email);\n  return serialiser_({ webinaires: webinairesCommuns_().map(function (w) {\n    const inscrit = w.invites.indexOf(email) !== -1 || demandes.indexOf(w.id) !== -1;\n    return { id: w.id, titre: w.titre, debut: w.debut, fin: w.fin, duree: w.duree, description: w.description,\n      inscrits: w.invites.length + (inscrit && w.invites.indexOf(email) === -1 ? 1 : 0), inscrit: inscrit };\n  }) });\n}\n\n/* Une ligne ajoutée à « Écritures » ; envoyerInscriptionsWebinaire (chaque minute) la porte dans la liste Slack */\nfunction inscrireWebinaire(id) {\n  const email = emailCourant_();\n  const w = webinairesCommuns_().filter(function (x) { return x.id === id; })[0];\n  if (!w) throw new Error('Ce webinaire n’est plus au programme.');\n  const demandes = demandesWebinaire_(email);\n  if (w.invites.indexOf(email) !== -1 || demandes.indexOf(id) !== -1) return true;\n  ecrire_(email, 'webinaire', { id: id });\n  demandes.push(id);\n  cache_().put('WEBI_' + cleCache_(email), JSON.stringify(demandes), 21600);\n  return true;\n}\n\n/* Le lien Meet : seulement aux inscrits, et seulement 15 minutes avant le début */\nfunction rejoindreWebinaire(id) {\n  const email = emailCourant_();\n  let w = webinairesCommuns_().filter(function (x) { return x.id === id; })[0];\n  if (!w) throw new Error('Ce webinaire n’est plus au programme.');\n  if (w.invites.indexOf(email) === -1 && demandesWebinaire_(email).indexOf(id) === -1) {\n    w = webinairesCommuns_(true).filter(function (x) { return x.id === id; })[0] || w;\n    if (w.invites.indexOf(email) === -1) throw new Error('Inscris-toi d’abord à ce webinaire.');\n  }\n  const maintenant = Date.now();\n  if (maintenant < new Date(w.debut).getTime() - 15 * 60000) throw new Error('Le lien s’ouvre 15 minutes avant le début.');\n  if (maintenant > new Date(w.fin).getTime()) throw new Error('Ce webinaire est terminé.');\n  if (!w.lien) throw new Error('Pas de lien Meet sur cet événement : écris dans #kerogo-tools.');\n  return w.lien;\n}\n\n/* Déclencheur chaque minute : porte les inscriptions dans la liste Slack, par lots (limites de Slack respectées) */\nfunction envoyerInscriptionsWebinaire() {\n  if (!versionActivee_()) return;\n  const debut = Date.now(), repere = cache_();\n  if (repere.get('WEBINAIRES_EN_COURS')) return;\n  repere.put('WEBINAIRES_EN_COURS', '1', 120);\n  let envoyees = 0;\n  try {\n    const props = PropertiesService.getScriptProperties();\n    if (firestoreActif_()) { try { importerInscriptionsFs_(); } catch (e) { console.warn('Inscriptions Firestore : ' + e.message); } }\n    const jeton = props.getProperty('SLACK_WEBINAR_TOKEN');\n    const sh = feuille_('Écritures'), fin = sh.getLastRow();\n    let curseur = Number(props.getProperty('WEBINAIRES_SUIVANTE')) || 2;\n    if (curseur > fin) return;\n    if (!jeton) { console.warn('Propriété SLACK_WEBINAR_TOKEN manquante : inscriptions aux webinaires en attente.'); return; }\n    const colonnes = colonnesInscriptions_(jeton);\n    const lignes = sh.getRange(curseur, 1, fin - curseur + 1, 4).getValues();\n    for (let i = 0; i < lignes.length; i++) {\n      const l = lignes[i];\n      if (l[2] === 'webinaire') {\n        if (envoyees >= 40 || Date.now() - debut > 45000) break;   // la suite à la minute suivante\n        const email = String(l[1]).toLowerCase(), d = JSON.parse(l[3] || '{}'), slackId = estTest_(email) ? '' : slackIdDe_(email);\n        if (estTest_(email)) { /* test de charge : jamais dans la liste Slack */ }\n        else if (slackId && d.id) {\n          const r = slackAvec_(jeton, 'slackLists.items.create', { list_id: CONFIG.LISTE_INSCRIPTIONS_WEBINAIRE, initial_fields: [\n            { column_id: colonnes.participant, user: [slackId] },\n            { column_id: colonnes.evenement, rich_text: [{ type: 'rich_text', elements: [{ type: 'rich_text_section', elements: [{ type: 'text', text: d.id }] }] }] }] });\n          if (!r.ok) {\n            if (r.error === 'ratelimited') break;                    // nouvel essai à la minute suivante\n            console.warn('Inscription au webinaire non envoyée pour ' + email + ' : ' + r.error);\n          } else envoyees++;\n          Utilities.sleep(300);\n        } else console.warn('Inscription au webinaire impossible pour ' + email + ' : identifiant Slack introuvable.');\n      }\n      curseur++;\n    }\n    props.setProperty('WEBINAIRES_SUIVANTE', String(curseur));\n    if (envoyees) cache_().remove('WEBINAIRES');   // le programme sera relu avec les nouveaux invités\n  } finally {\n    repere.remove('WEBINAIRES_EN_COURS');\n  }\n  if (envoyees) noterDuree_('envoyerInscriptionsWebinaire', debut, envoyees + ' inscription(s)');\n}\n\nfunction slackIdDe_(email) {\n  const j = ligneJoueur_(email);\n  if (j && j['Slack ID']) return String(j['Slack ID']);\n  const a = annuaire_()[cleOrg_(email)];\n  if (a && a.s) return a.s;\n  const s = infosSlack_(email);\n  return s ? s.id : '';\n}\n\n/* Colonnes « Participant » et « Événement » de la liste des inscriptions, gardées 6 heures */\nfunction colonnesInscriptions_(jeton) {\n  const cache = cache_(), connu = cache.get('COLONNES_INSCRIPTIONS');\n  if (connu) return JSON.parse(connu);\n  const items = slackAvec_(jeton, 'slackLists.items.list', { list_id: CONFIG.LISTE_INSCRIPTIONS_WEBINAIRE, limit: 1 }).items || [];\n  if (!items.length) throw new Error('Liste des inscriptions vide : impossible de lire ses colonnes.');\n  const schema = chercherSchema_(slackAvec_(jeton, 'slackLists.items.info', { list_id: CONFIG.LISTE_INSCRIPTIONS_WEBINAIRE, id: items[0].id })) || [];\n  const col = function (nom) { const c = schema.filter(function (x) { return x.name === nom; })[0]; if (!c) throw new Error('Colonne « ' + nom + ' » introuvable dans la liste des inscriptions.'); return c.id || c.key; };\n  const res = { participant: col('Participant'), evenement: col('Événement') };\n  cache.put('COLONNES_INSCRIPTIONS', JSON.stringify(res), 21600);\n  return res;\n}\n\n/* Appel Slack avec un autre jeton que celui de l'Académie (l'app des webinaires a lists:write) */\nfunction slackAvec_(jeton, methode, params) {\n  const r = JSON.parse(UrlFetchApp.fetch('https://slack.com/api/' + methode, { method: 'post', contentType: 'application/json; charset=utf-8',\n    headers: { Authorization: 'Bearer ' + jeton }, payload: JSON.stringify(params), muteHttpExceptions: true }).getContentText());\n  if (!r.ok) console.warn('Slack ' + methode + ' : ' + r.error);\n  return r;\n}\n\n/* ------------------------------------------------------------------ */\n/* Charte officielle : lue dans le Google Doc (CONFIG.CHARTE_DOC_ID ou  */\n/* propriété CHARTE_DOC_ID), découpée en blocs pour la page. Gardée     */\n/* 6 heures ; « Relire la charte » dans Admin › Réglages.               */\n/* Blocs : h (titre, n = 3 ou 4), p (paragraphe), l (élément de liste,  */\n/* n = niveau, o = numéroté), t (tableau : lignes de cellules).         */\n/* Un texte est une liste de morceaux [texte, 'g' gras / 'i' italique]. */\n/* ------------------------------------------------------------------ */\nfunction idCharte_() { return PropertiesService.getScriptProperties().getProperty('CHARTE_DOC_ID') || CONFIG.CHARTE_DOC_ID; }\n\nfunction getCharte() {\n  emailCourant_();\n  const connu = lireGrand_(cache_(), 'CHARTE_' + idCharte_());\n  return connu ? JSON.parse(connu) : lireCharte_();\n}\n\nfunction lireCharte_() {\n  // Service avancé Docs : lecture seule (documents.readonly), sans droit d'écriture sur les Docs\n  const doc = Docs.Documents.get(idCharte_());\n  const onglet = doc.tabs && doc.tabs.length && doc.tabs[0].documentTab ? doc.tabs[0].documentTab : doc;\n  const elements = (onglet.body && onglet.body.content) || [], listes = onglet.lists || {};\n  const res = { version: '', enVigueur: '', preambule: [], sections: [], annexe: null };\n  let courant = res.preambule, section = null;\n  const motsDe = function (t) { return (String(t).match(/[\\wÀ-ÿ’']+/g) || []).length; };\n  for (let i = 0; i < elements.length; i++) {\n    const el = elements[i];\n    if (el.table) {\n      const lignes = (el.table.tableRows || []).map(function (r) {\n        return (r.tableCells || []).map(function (cell) {\n          return (cell.content || []).filter(function (x) { return x.paragraph; }).map(function (x) { return texteParagraphe_(x.paragraph); }).join('\\n').trim();\n        });\n      });\n      courant.push({ k: 't', l: lignes });\n      if (section) section.mots += motsDe(lignes.map(function (l) { return l.join(' '); }).join(' '));\n      continue;\n    }\n    if (!el.paragraph) continue;\n    const p = el.paragraph, texte = texteParagraphe_(p).trim();\n    if (!texte) continue;\n    const style = (p.paragraphStyle && p.paragraphStyle.namedStyleType) || 'NORMAL_TEXT';\n    let m = texte.match(/^Version\\s*:\\s*(.+)$/i);\n    if (m && !res.version) { res.version = m[1].trim(); continue; }\n    m = texte.match(/^Date d.entr[ée]e en vigueur\\s*:\\s*(.+)$/i);\n    if (m && !res.enVigueur) { res.enVigueur = m[1].trim(); continue; }\n    if (/^Annexe\\s*\\d*\\s*:/i.test(texte)) { res.annexe = { titre: texte, blocs: [] }; courant = res.annexe.blocs; section = null; continue; }\n    if (style === 'HEADING_2' && !res.annexe && /^\\d+\\.\\s/.test(texte)) {\n      section = { num: Number(texte.match(/^(\\d+)/)[1]), titre: texte.replace(/^\\d+\\.\\s*/, ''), blocs: [], mots: 0 };\n      res.sections.push(section); courant = section.blocs; continue;\n    }\n    if (!section && !res.annexe && (style === 'HEADING_1' || style === 'TITLE' || /^CHARTE D.UTILISATION/i.test(texte))) continue;\n    const morceaux = morceauxDocs_(p);\n    // Titres : dans les sections, niveau 3 → intertitre, niveau 4 → sous-intertitre ; dans l'annexe, lettres puis termes\n    const niveau = style === 'HEADING_2' ? 3 : style === 'HEADING_3' ? (res.annexe ? 4 : 3) : (style === 'HEADING_4' || style === 'HEADING_5') ? 4 : 0;\n    if (p.bullet) {\n      const niv = p.bullet.nestingLevel || 0, l = listes[p.bullet.listId];\n      const g = (l && l.listProperties && l.listProperties.nestingLevels && l.listProperties.nestingLevels[niv]) || {};\n      courant.push({ k: 'l', n: niv, o: /DECIMAL|ALPHA|ROMAN/.test(g.glyphType || ''), r: morceaux });\n    } else if (niveau) courant.push({ k: 'h', n: niveau, r: morceaux });\n    else courant.push({ k: 'p', r: morceaux });\n    if (section) section.mots += motsDe(texte);\n  }\n  if (!res.version) throw new Error('Charte : ligne « Version : » introuvable dans le document.');\n  const json = JSON.stringify(res);\n  ecrireGrand_(cache_(), 'CHARTE_' + idCharte_(), json, 21600);\n  const props = PropertiesService.getScriptProperties();\n  if (props.getProperty('CHARTE_VERSION') !== res.version) props.setProperty('CHARTE_VERSION_DEPUIS', Utilities.formatDate(new Date(), 'Europe/Paris', 'yyyy-MM-dd'));\n  props.setProperty('CHARTE_VERSION', res.version);\n  props.setProperty('CHARTE_MOTS', String(res.sections.reduce(function (a, s) { return a + s.mots; }, 0)));\n  return res;\n}\n\n/* Texte d'un paragraphe (sans le retour à la ligne final) */\nfunction texteParagraphe_(p) {\n  return (p.elements || []).map(function (e) { return e.textRun ? e.textRun.content : ''; }).join('').replace(/\\n$/, '').replace(/\\u000b/g, '\\n');\n}\n/* Texte découpé selon le gras et l'italique : [[texte, 'g' / 'i' / 'gi'], …] */\nfunction morceauxDocs_(p) {\n  const res = [];\n  (p.elements || []).forEach(function (e) {\n    if (!e.textRun) return;\n    const bout = e.textRun.content.replace(/\\n$/, '').replace(/\\u000b/g, '\\n');\n    if (!bout) return;\n    const ts = e.textRun.textStyle || {}, style = (ts.bold ? 'g' : '') + (ts.italic ? 'i' : '');\n    const dernier = res[res.length - 1];\n    if (dernier && dernier[1] === style) dernier[0] += bout; else res.push([bout, style]);\n  });\n  return res.map(function (x) { return x[1] ? x : [x[0]]; });\n}\n\n/* Signature de l'étape 0 : la version lue (le temps de lecture est contrôlé dans la page et n'est gardé nulle part) */\nfunction signerCharte(version) {\n  const email = emailCourant_();\n  const enVigueur = PropertiesService.getScriptProperties().getProperty('CHARTE_VERSION') || lireCharte_().version;\n  if (String(version) !== enVigueur) throw new Error('La charte vient d’être mise à jour : recharge la page pour lire la nouvelle version.');\n  const perso = persoCourant_(email);\n  if (perso.joueur.charte && perso.joueur.charteVersion === enVigueur) {\n    // Déjà signée pour cette version : rien ne change (date et accusé de réception restent ceux de la première signature)\n    const deja = assembler_(perso);\n    deja.resultat = { reussie: true, xpGagne: 0, nouveauBadge: null, premiereFois: false };\n    return serialiser_(deja);\n  }\n  const resultat = appliquerCharte_(perso, enVigueur, new Date());\n  const lignes = [ligneEcriture_(email, 'charte', { version: enVigueur })];\n  [documentANoter_(perso, email, 'accuse', enVigueur, new Date()),\n    perso.niveaux[0].complet ? documentANoter_(perso, email, 'certification', enVigueur, new Date()) : null]\n    .forEach(function (d) { if (d) lignes.push(d); });\n  ajouterSousVerrou_(lignes);\n  garderPerso_(email, perso);\n  const etat = assembler_(perso);\n  etat.resultat = resultat;\n  return serialiser_(etat);\n}\nfunction appliquerCharte_(perso, version, date) {\n  const premiere = !perso.joueur.charte, n1 = perso.niveaux[0];\n  const r = { reussie: true, xpGagne: 0, nouveauBadge: null, premiereFois: premiere };\n  perso.joueur.charte = true; perso.joueur.charteVersion = String(version); perso.joueur.charteLe = dateIso_(date);\n  if (premiere && n1.complet) { r.nouveauBadge = n1.badge; r.xpGagne = XP_BADGE; perso.joueur.xp += XP_BADGE; }\n  return r;\n}\n\n/* Admin › Réglages */\nfunction relireCharte() {\n  verifierAdmin_();\n  cache_().remove('CHARTE_' + idCharte_());\n  lireCharte_();\n  nouvelleVersionEtat_();\n  return getAdmin();\n}\nfunction definirCharte(id) {\n  verifierAdmin_();\n  id = String(id || '').trim();\n  const m = id.match(/\\/d\\/([\\w-]{20,})/) || id.match(/^([\\w-]{20,})$/);\n  if (!m) throw new Error('Lien du Google Doc non reconnu.');\n  PropertiesService.getScriptProperties().setProperty('CHARTE_DOC_ID', m[1]);\n  return relireCharte();\n}\n\n/* ------------------------------------------------------------------ */\n/* Accusé de réception de la charte et certification du niveau 1       */\n/* Un seul exemplaire de chaque document : la ligne est enregistrée     */\n/* tout de suite (onglet Documents), le PDF est produit une fois par    */\n/* archiverAttestations_ (toutes les 15 minutes) ou au premier          */\n/* téléchargement, puis archivé dans le Drive partagé. Le télécharger   */\n/* de nouveau renvoie toujours le même fichier.                         */\n/* ------------------------------------------------------------------ */\nconst NOMS_DOCUMENTS = { accuse: 'Charte', certification: 'Certification niveau 1' };\n\nfunction reglageDoc_(cle) { return PropertiesService.getScriptProperties().getProperty(cle) || CONFIG[cle] || ''; }\n\n/* Documents d'un collaborateur, depuis son résumé (tenu par la consolidation) */\nfunction documentsDe_(j) {\n  try { return (JSON.parse(String(j['Résumé'] || '{}'))._docs) || []; } catch (e) { return []; }\n}\n\n/* La ligne à ajouter à Documents (null si ce document existe déjà pour cette version) ; ajoutée par ajouterSousVerrou_ */\nfunction documentANoter_(perso, email, type, version, date) {\n  if (estTest_(email)) return null;\n  perso.documents = perso.documents || [];\n  if (perso.documents.some(function (d) { return d.type === type && (type === 'certification' || d.version === version); })) return null;\n  perso.documents.push({ type: type, version: String(version), date: dateIso_(date), pret: false });\n  return ['Documents', [date, email, type, \"'\" + version, date, '', '']];\n}\n\n/* Téléchargement : le fichier archivé ; s'il n'est pas encore produit, il l'est maintenant (une seule fois, sous verrou) */\nfunction telechargerDocument(type, version) {\n  const email = emailCourant_();\n  if (!NOMS_DOCUMENTS[type]) throw new Error('Document inconnu.');\n  let ligne = ligneDocument_(email, type, version);\n  if (!ligne) throw new Error('Ce document n’est pas encore disponible.');\n  const lien = ligne.Fichier || produireDocument_(ligne, ATTENTE_VERROU_MS);\n  const fichier = DriveApp.getFileById(idFichier_(lien));\n  return { nom: fichier.getName(), contenu: Utilities.base64Encode(fichier.getBlob().getBytes()) };\n}\nfunction ligneDocument_(email, type, version) {\n  return lignes_('Documents').filter(function (d) {\n    return String(d.Email).toLowerCase() === email && d.Document === type && (type === 'certification' || String(d.Version) === String(version));\n  })[0] || null;\n}\nconst idFichier_ = function (lien) { const m = String(lien).match(/[-\\w]{25,}/); return m ? m[0] : String(lien); };\n\n/* Déclencheur toutes les 15 minutes : produit les PDF manquants, par lots de moins de 4 minutes */\nfunction archiverAttestations_() {\n  if (!versionActivee_()) return;\n  const debut = Date.now(), cache = cache_();\n  if (cache.get('ARCHIVAGE_EN_COURS')) return;\n  cache.put('ARCHIVAGE_EN_COURS', '1', 300);\n  let n = 0;\n  const produits = [];\n  try {\n    invalider_('Documents');\n    lignes_('Documents').forEach(function (d) {\n      if (d.Fichier || estTest_(d.Email) || Date.now() - debut > LIMITE_LOT_MS) return;\n      try { produireDocument_(d, 20000); n++; produits.push(String(d.Email).toLowerCase()); } catch (e) { console.warn('Document non produit pour ' + d.Email + ' : ' + e.message); }\n    });\n  } finally { cache.remove('ARCHIVAGE_EN_COURS'); }\n  if (n) { try { pousserDocumentsFs_(produits, null); } catch (e) { console.warn('Documents Firestore : ' + e.message); } }\n  if (n) noterDuree_('archiverAttestations_', debut, n + ' document(s)');\n}\n/* Les déclencheurs n'appellent pas les fonctions qui finissent par « _ » : cette porte sert au déclencheur */\nfunction archiverAttestations() { archiverAttestations_(); }\n\n/* Produit le PDF d'une ligne (gabarit HTML → PDF) hors verrou, le range dans le bon dossier,\n   puis note le lien sous verrou court. Si un autre traitement l'a produit entre-temps, le doublon part à la corbeille. */\nfunction produireDocument_(d, attenteVerrou) {\n  const email = String(d.Email).toLowerCase(), type = d.Document, version = String(d.Version);\n  // Un même document déjà produit (ligne en double) : même fichier\n  const jumeau = lignes_('Documents').filter(function (x) { return x.Fichier && String(x.Email).toLowerCase() === email && x.Document === type && (type === 'certification' || String(x.Version) === version); })[0];\n  let lien = jumeau ? jumeau.Fichier : '';\n  if (!lien) {\n    const j = ligneJoueur_(email) || {}, nom = nomDe_(email), prenom = j['Prénom'] || prenomDepuisEmail_(email);\n    const jour = Utilities.formatDate(new Date(d['Lu le'] || d.Date), 'Europe/Paris', 'yyyy-MM-dd');\n    // Fichier en « NOM Prénom » (tri alphabétique dans Drive) ; dans le document, « Prénom Nom »\n    const nomFichier = (((nom ? nom.toUpperCase() + ' ' : '') + prenom).trim() || email) + ' — ' + (type === 'accuse' ? 'Charte v' + version : NOMS_DOCUMENTS[type]) + ' — ' + jour + '.pdf';\n    const missions = type === 'certification' ? NIVEAUX[0].missions.map(function (id) {\n      const p = lignes_('Progression').filter(function (x) { return String(x.Email).toLowerCase() === email && String(x.Mission) === id && x.Statut === 'Réussie'; })[0];\n      return 'Mission ' + id + ' · ' + MISSIONS[id].titre + (p && p['Réussie le'] ? ' (' + dateLongue_(new Date(p['Réussie le'])) + ')' : '');\n    }) : [];\n    const pdf = Utilities.newBlob(gabaritDocument_(type, { nom: nomAffiche_(prenom, nom) || email, version: version, date: new Date(d['Lu le'] || d.Date), missions: missions }), 'text/html', 'document.html')\n      .getAs('application/pdf').setName(nomFichier);\n    const fichier = dossierDocument_(type, version).createFile(pdf);\n    lien = fichier.getUrl();\n  }\n  const verrou = LockService.getScriptLock();\n  if (!verrou.tryLock(attenteVerrou || 20000)) { if (!jumeau) DriveApp.getFileById(idFichier_(lien)).setTrashed(true); throw new Error(SERVEUR_OCCUPE); }\n  try {\n    const colFichier = ONGLETS.Documents.indexOf('Fichier') + 1, deja = feuille_('Documents').getRange(d._ligne, colFichier).getValue();\n    if (deja) { if (!jumeau) DriveApp.getFileById(idFichier_(lien)).setTrashed(true); return deja; }\n    maj_('Documents', d._ligne, 'Fichier', lien);\n    maj_('Documents', d._ligne, 'Produit le', new Date());\n    const jl = ligneJoueur_(email);\n    if (jl) maj_('Joueurs', jl._ligne, type === 'accuse' ? 'Accusé charte' : 'Certification niveau 1', lien);\n    SpreadsheetApp.flush();\n  } finally { verrou.releaseLock(); }\n  cache_().remove(clePerso_(email));\n  return lien;\n}\n\nfunction dossierDocument_(type, version) {\n  if (type === 'certification') return DriveApp.getFolderById(reglageDoc_('DOSSIER_CERTIFICATIONS'));\n  const parent = DriveApp.getFolderById(reglageDoc_('DOSSIER_ACCUSES_CHARTE')), nom = 'v' + version;\n  const existants = parent.getFoldersByName(nom);\n  return existants.hasNext() ? existants.next() : parent.createFolder(nom);\n}\n\n/* Même mise en page que l'ancienne attestation (version 25, jsPDF) : A4, marges de 20 mm, logo de 11 mm, trait violet,\n   surtitre 9 pt violet, titre 22 pt, texte 12 pt, note 10 pt grise, Helvetica ; « Fait à Paris » à 120 mm du haut au moins */\nfunction gabaritDocument_(type, x) {\n  const e = function (t) { return String(t == null ? '' : t).replace(/[&<>\"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]; }); };\n  const titre = type === 'accuse' ? 'Accusé de réception de la charte d’utilisation de l’IA' : 'Certification interne de l’Académie IA';\n  const phrase = type === 'accuse'\n    ? e(x.nom) + ' a lu la charte d’utilisation de l’intelligence artificielle du groupe Kerogo Finance (version ' + e(x.version) + ') le ' + dateLongue_(x.date) + ' et s’engage à la respecter.'\n    : e(x.nom) + ' a validé le ' + dateLongue_(x.date) + ' le niveau 1 « Les bons réflexes » de l’Académie IA du groupe Kerogo Finance, test de certification interne prévu par l’article 6.2 de la charte d’utilisation de l’IA (version ' + e(x.version) + ', signée).';\n  const note = type === 'accuse'\n    ? 'Ce document vaut accusé de réception de la charte (article 10.1).'\n    : 'Cette formation contribue à l’obligation de maîtrise de l’IA prévue par la loi européenne sur l’IA (article 4).';\n  const missions = (x.missions || []).length\n    ? '<p class=\"gras\">Missions validées :</p><ul>' + x.missions.map(function (m) { return '<li>' + e(m) + '</li>'; }).join('') + '</ul>' : '';\n  const signataire = reglageDoc_('SIGNATAIRE');\n  return '<html><head><meta charset=\"utf-8\"><style>'\n    + '@page{size:A4;margin:0}html,body{margin:0;padding:0}'\n    + 'body{font-family:Helvetica,Arial,sans-serif;color:#15142F;background:#FFFFFF}'\n    + '.page{padding:18mm 20mm 0 20mm}.corps{min-height:96mm}'\n    + '.logo{height:11mm;width:auto;display:block}.trait{height:0;border-top:0.6mm solid #6345F0;margin:9mm 0 0}'\n    + '.sur{margin:8mm 0 0;font-size:9pt;line-height:4mm;font-weight:bold;color:#6345F0}'\n    + 'h1{margin:5mm 0 6mm;font-size:22pt;line-height:9mm;font-weight:bold;color:#15142F}'\n    + 'p{margin:0 0 6mm;font-size:12pt;line-height:6mm}.gras{font-weight:bold;margin-bottom:1mm}'\n    + 'ul{margin:0 0 5mm;padding-left:8mm}li{font-size:12pt;line-height:6mm;margin:0 0 1mm}'\n    + '.note{font-size:10pt;line-height:5mm;color:#55537A;margin-bottom:14mm}.fait{margin:0}.sig{margin:8mm 0 0}'\n    + '</style></head><body><div class=\"page\"><div class=\"corps\"><img class=\"logo\" src=\"' + LOGO_KEROGO + '\"><div class=\"trait\"></div>'\n    + '<p class=\"sur\">KEROGO TOOLS ACADEMY</p><h1>' + titre + '</h1><p>' + phrase + '</p>' + missions\n    + '<p class=\"note\">' + note + '</p></div>'\n    + '<p class=\"fait\">Fait à Paris, le ' + dateLongue_(x.date) + '.</p>'\n    + (signataire ? '<p class=\"sig\"><strong>' + e(signataire) + '</strong><br>' + e(reglageDoc_('SIGNATAIRE_FONCTION')) + '</p>' : '')\n    + '</div></body></html>';\n}\n\n/* « 5 novembre 2026 » (heure de Paris) */\nconst MOIS_LONGS_ = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];\nfunction dateLongue_(d) {\n  const p = Utilities.formatDate(new Date(d), 'Europe/Paris', 'dd MM yyyy').split(' ');\n  return Number(p[0]) + ' ' + MOIS_LONGS_[Number(p[1]) - 1] + ' ' + p[2];\n}\n\n/* Noms : l'organigramme les donne en capitales (« MOREL ») ; affichés « Prénom Nom » (« Claire Morel ») */\nfunction nomPropre_(nom) {\n  const t = String(nom || '').trim().toLowerCase();\n  if (!t) return '';\n  return t.split(' ').map(function (mot, i) {\n    if (i && ['de', 'du', 'des', 'la', 'le'].indexOf(mot) !== -1) return mot;\n    if (i && /^d['’]/.test(mot)) return 'd’' + mot.charAt(2).toUpperCase() + mot.slice(3);\n    return mot.replace(/(^|[-'’])([^-'’])/g, function (m, a, b) { return a + b.toUpperCase(); });\n  }).join(' ');\n}\nfunction nomAffiche_(prenom, nom) { return (Strin ignée 14 jours après la date de départ          */\n/* Date de départ = la plus récente de : lancement de l'Académie        */\n/* (Admin › Réglages), publication de la version en vigueur, arrivée    */\n/* dans l'organigramme. Sans date de lancement, aucune alerte.          */\n/* ------------------------------------------------------------------ */\nconst JOURS_ALERTE_CHARTE = 14;\n\n/* { email: 'AAAA-MM-JJ' } ; avecMaj : ajoute les nouvelles personnes de l'organigramme (déclencheur seulement) */\nfunction arrivees_(avecMaj) {\n  const vus = {};\n  lignes_('Arrivées').forEach(function (l) { vus[String(l.Email).toLowerCase()] = l['Vu le'] instanceof Date ? Utilities.formatDate(l['Vu le'], 'Europe/Paris', 'yyyy-MM-dd') : String(l['Vu le']); });\n  if (avecMaj) {\n    const jour = Utilities.formatDate(new Date(), 'Europe/Paris', 'yyyy-MM-dd'), nouveaux = [];\n    Object.keys(annuaire_()).forEach(function (e) { if (!vus[e]) { vus[e] = jour; nouveaux.push([e, jour]); } });\n    if (nouveaux.length) { ajouterLignes_('Arrivées', nouveaux); invalider_('Arrivées'); }\n  }\n  return vus;\n}\n\nfunction casCharteNonSignee_(avecMaj) {\n  const props = PropertiesService.getScriptProperties();\n  const lancement = props.getProperty('DATE_LANCEMENT'), version = props.getProperty('CHARTE_VERSION') || '';\n  if (!lancement || !version) return [];\n  const depuisVersion = props.getProperty('CHARTE_VERSION_DEPUIS') || lancement;\n  const a = annuaire_(), arrivees = arrivees_(avecMaj), joueurs = {}, cas = [];\n  lignes_('Joueurs').forEach(function (j) { const e = String(j.Email).toLowerCase(); joueurs[cleOrg_(e) || e] = j; });\n  const personnes = {};\n  Object.keys(a).forEach(function (e) { personnes[e] = true; });\n  Object.keys(joueurs).forEach(function (e) { personnes[e] = true; });\n  const aujourdhui = Utilities.formatDate(new Date(), 'Europe/Paris', 'yyyy-MM-dd');\n  Object.keys(personnes).forEach(function (e) {\n    const j = joueurs[e], x = a[e] || {};\n    if (j && String(j['Charte version'] || '').replace(/^'/, '') === version) return;\n    const depart = [lancement, depuisVersion, arrivees[e] || lancement].sort().pop();\n    const jours = Math.floor((new Date(aujourdhui) - new Date(depart)) / 86400000);\n    if (jours < JOURS_ALERTE_CHARTE) return;\n    const m = a[x.m] || {}, mj = joueurs[x.m];\n    cas.push({ email: j ? String(j.Email).toLowerCase() : e, nom: nomAffiche_((j && j['Prénom']) || prenomDepuisEmail_(e), x.n) || e,\n      cabinet: cabinetActuel_(j && j.Cabinet), site: (j && j.Site) || '', inscrit: !!j, manager: (x.m ? nomAffiche_((mj && mj['Prénom']) || prenomDepuisEmail_(x.m), m.n) : '') || x.m || '',\n      managerEmail: x.m || '', depuis: depart, jours: jours });\n  });\n  return cas.sort(function (p, q) { return (p.cabinet || '~').localeCompare(q.cabinet || '~') || p.manager.localeCompare(q.manager) || p.nom.localeCompare(q.nom); });\n}\n\n/* Chaque jour ouvré à 9 h (routine) : message aux administrateurs s'il y a de nouveaux cas ; le lundi, tous les cas */\nfunction alerteChartesNonSignees_() {\n  if (!estOuvre_(new Date(), 'Paris')) return;\n  const cas = casCharteNonSignee_(true);\n  const version = PropertiesService.getScriptProperties().getProperty('CHARTE_VERSION') || '';\n  const type = 'alerte-charte-' + version, deja = {};\n  lignes_('Relances').forEach(function (r) { if (r.Type === type) deja[String(r.Email).toLowerCase()] = true; });\n  const nouveaux = cas.filter(function (x) { return !deja[x.email]; }), lundi = new Date().getDay() === 1;\n  if (nouveaux.length) ajouterLignes_('Relances', nouveaux.map(function (x) { return [new Date(), x.email, type]; }));\n  const liste = lundi ? cas : nouveaux;\n  if (!liste.length) return;\n  const texte = (lundi ? '*Récapitulatif du lundi* : ' + cas.length + ' collaborateur(s) n’ont pas signé la charte (version ' + version + ') ' + JOURS_ALERTE_CHARTE + ' jours après leur date de départ.'\n    : '*Charte non signée après ' + JOURS_ALERTE_CHARTE + ' jours* : ' + nouveaux.length + ' nouveau(x) cas.') + '\\n\\n' + texteParCabinet_(liste)\n    + '\\n\\nPour relancer une personne et son manager : Admin › Vue d’ensemble.';\n  admins_().forEach(function (e) { if (autorise_(e)) envoyerMP_({ Email: e }, texte.slice(0, 2900), 'Ouvrir l’admin', 'admin'); });\n}\nfunction texteParCabinet_(liste) {\n  const parCab = {};\n  liste.forEach(function (x) { const c = x.cabinet || 'Cabinet non renseigné', m = x.manager || 'Manager non renseigné'; ((parCab[c] = parCab[c] || {})[m] = parCab[c][m] || []).push(x); });\n  return Object.keys(parCab).map(function (c) {\n    return '*' + c + '*\\n' + Object.keys(parCab[c]).map(function (m) {\n      return '   _' + m + '_ : ' + parCab[c][m].map(function (x) { return x.nom + ' (' + x.jours + ' j' + (x.inscrit ? '' : ', jamais venu') + ')'; }).join(', ');\n    }).join('\\n');\n  }).join('\\n');\n}\n\n/* Bouton « Relancer » : un rappel à la personne et à son manager (jours fériés du site respectés) */\nfunction relancerCharte(email) {\n  verifierAdmin_();\n  email = String(email || '').toLowerCase();\n  const x = casCharteNonSignee_(false).filter(function (c) { return c.email === email; })[0];\n  if (!x) throw new Error('Cette personne a signé la charte ou n’est plus concernée.');\n  if (!estOuvre_(new Date(), x.site || 'Paris')) throw new Error('Jour férié sur le site de ' + x.nom + ' : relance demain.');\n  const prenom = x.nom.split(' ')[0];\n  let envoyes = 0;\n  if (autorise_(email) && envoyerMP_(ligneJoueur_(email) || { Email: email }, 'Hello ' + prenom + \" 👋 Ta charte d'utilisation de l'IA n'est pas encore signée. \"\n      + \"C'est l'étape 0 de \" + CONFIG.NOM_ARTICLE + ' : environ un quart d\\'heure, en plusieurs fois si besoin.', 'Lire la charte', 'etape0')) envoyes++;\n  if (x.managerEmail && autorise_(x.managerEmail) && envoyerMP_(ligneJoueur_(x.managerEmail) || { Email: x.managerEmail }, 'Hello 👋 ' + x.nom + ' (ton équipe) n’a pas encore signé la charte d’utilisation de l’IA, '\n      + x.jours + ' jours après son arrivée. Peux-tu lui en glisser un mot ?', 'Voir mon équipe', 'equipe')) envoyes++;\n  if (!envoyes) throw new Error('Aucun message envoyé (mode test, ou personne introuvable sur Slack).');\n  ajouter_('Relances', [new Date(), email, 'charte']);\n  return getAdmin();\n}\n\nfunction definirLancement(jour) {\n  verifierAdmin_();\n  jour = String(jour || '').trim();\n  if (jour && !/^\\d{4}-\\d{2}-\\d{2}$/.test(jour)) throw new Error('Date invalide.');\n  const props = PropertiesService.getScriptProperties();\n  if (jour) props.setProperty('DATE_LANCEMENT', jour); else props.deleteProperty('DATE_LANCEMENT');\n  return getAdmin();\n}\n\nfunction resumeCanal_() {\n  const depuis = String(Math.floor((Date.now() - 31 * 86400000) / 1000));\n  let messages = [], curseur = '';\n  for (let page = 0; page < 5; page++) {\n    const p = { channel: CONFIG.CANAL_ANNONCES, oldest: depuis, limit: 200 };\n    if (curseur) p.cursor = curseur;\n    const r = slack_('conversations.history', p, true);\n    if (!r.ok) throw new Error(r.error === 'not_in_channel' ? \"le bot n'est pas dans #kerogo-tools : invitez-le avec /invite\" : r.error);\n    messages = messages.concat(r.messages || []);\n    curseur = r.response_metadata && r.response_metadata.next_cursor;\n    if (!curseur) break;\n  }\n  const notes = messages\n    .filter(function (m) { return !m.subtype && !m.bot_id && m.user && String(m.text || '').length > 30; })\n    .map(function (m) {\n      const reactions = (m.reactions || []).reduce(function (s, x) { return s + (x.count || 0); }, 0);\n      return { m: m, score: reactions + 2 * (m.reply_count || 0) };\n    })\n    .sort(function (a, b) { return b.score - a.score; });\n  if (!notes.length) return '(aucun message de collègue ce mois-ci)';\n  return notes.slice(0, 25).map(function (x) {\n    return '- ' + nomUtilisateur_(x.m.user) + ' (' + x.score + ' réactions ou réponses) : ' + nettoyerSlack_(x.m.text).slice(0, 600);\n  }).join('\\n');\n}\n\nfunction resumeAcademie_() {\n  const joueurs = lignes_('Joueurs');\n  const journal = lignes_('Journal', 5000);\n  const lignes = [];\n  const charte = joueurs.filter(function (j) { return j['Charte validée le']; }).length;\n  lignes.push('- ' + joueurs.length + ' collaborateur(s) inscrit(s), dont ' + charte + ' ont validé la charte.');\n  const depuis = new Date(Date.now() - 30 * 86400000);\n  const parSite = {};\n  journal.forEach(function (e) { if (e.Site && new Date(e.Date) >= depuis) { const s = siteDuJournal_(e); parSite[s] = (parSite[s] || 0) + (Number(e.XP) || 0); } });\n  const classement = Object.keys(parSite).sort(function (a, b) { return parSite[b] - parSite[a]; });\n  if (classement.length) lignes.push('- Ligue des 30 derniers jours : ' + classement.slice(0, 5).map(function (s, i) { return (i + 1) + '. ' + s + ' (' + parSite[s] + ' XP)'; }).join(', ') + '.');\n  const maintenant = new Date();\n  const goat = meilleurDuMois_(journal, maintenant.getFullYear(), maintenant.getMonth());\n  if (goat) lignes.push('- Kerogoat du mois en cours : ' + goat.prenom + (goat.site ? ' (' + goat.site + ')' : '') + ', ' + goat.xp + ' XP.');\n  const mois = moisCourant_();\n  const stats = JSON.parse(PropertiesService.getScriptProperties().getProperty('QUIZ_STATS_' + mois) || '[]');\n  const questions = questionsQuiz_(mois);\n  const ratees = questions.map(function (q, i) { const s = stats[i] || { ok: 0, ko: 0 }; return { q: q.Question, ko: s.ko, total: s.ok + s.ko }; })\n    .filter(function (x) { return x.total > 0; }).sort(function (a, b) { return (b.ko / b.total) - (a.ko / a.total); });\n  if (ratees.length) lignes.push('- Questions du quiz de ce mois les plus ratées : ' + ratees.slice(0, 2).map(function (x) { return '« ' + x.q + ' » (' + x.ko + ' erreurs sur ' + x.total + ')'; }).join(' ; ') + '.');\n  try {\n    const lives = Calendar.Events.list('primary', { timeMin: new Date().toISOString(), timeMax: new Date(Date.now() + 45 * 86400000).toISOString(),\n      singleEvents: true, orderBy: 'startTime', q: CONFIG.TITRE_LIVE, maxResults: 10 }).items || [];\n    lives.filter(function (ev) { return String(ev.summary || '').indexOf(CONFIG.TITRE_LIVE) === 0; }).forEach(function (ev) {\n      lignes.push('- Live prévu : ' + ev.summary + ', le ' + Utilities.formatDate(new Date(ev.start.dateTime || ev.start.date), 'Europe/Paris', 'dd/MM à HH:mm') + '.');\n    });\n  } catch (e) { /* agenda indisponible : on continue sans les lives */ }\n  return lignes.join('\\n');\n}\n\nfunction appelerClaude_(sources, mois) {\n  const systeme = [\n    \"Tu es le rédacteur de la Kerogo Tools Academy, la plateforme qui apprend aux collaborateurs du groupe Kerogo (cabinets d'expertise comptable) à bien utiliser l'IA au travail.\",\n    \"Slackbot est l'outil d'IA prioritaire du groupe. Les compétences Kerogo Tools sont des consignes Slackbot vérifiées et labellisées par l'équipe Dev Ops ; on propose une idée avec le formulaire « Proposer une automatisation ou amélioration » dans #kerogo-tools.\",\n    'À partir des sources fournies, rédige les contenus du mois indiqué.',\n    'Règles :',\n    \"- Français clair et professionnel : c'est un outil de formation. Phrases courtes et précises, vocabulaire juste (garde les termes métier et IA habituels : biais, jour ouvré, nominatif, grille de revue…), sans familiarités, sans argot ni expressions imagées. Tutoiement, ton chaleureux mais sérieux.\",\n    \"- N'utilise que des faits présents dans les sources : n'invente ni compétence, ni chiffre, ni citation.\",\n    \"- Ne cite jamais de nom de client, d'entreprise cliente, de montant ni d'information sensible sur une personne. Tu peux citer le prénom d'un collègue mis à l'honneur pour une astuce.\",\n    '- Format Slack : gras avec *astérisques*. Le titre est court et sans emoji ; le texte ne répète pas le titre.',\n    '- Texte aéré : des paragraphes courts (1 ou 2 phrases), séparés par une ligne vide (\\\\n\\\\n). 900 caractères au maximum.',\n    \"- Termine toujours par une courte phrase de conclusion qui donne envie d'agir (essayer, s'inscrire, donner son avis). Le message est publié dans #kerogo-tools : pour inviter à réagir, propose de répondre en fil de discussion sous ce message, et n'écris jamais « dans #kerogo-tools ».\",\n    '- Quand tu cites le Catalogue Kerogo Tools, écris-le en lien gras : *<' + CONFIG.LIEN_CATALOGUE + '|Catalogue Kerogo Tools>*. Même chose pour tout autre lien présent dans les sources.',\n    \"- Un classement (podium) s'écrit sur trois lignes, une par place, commençant par 🥇, 🥈 puis 🥉, avec le nom de la compétence en gras puis ses chiffres, par exemple : 🥇 *GEC – Générateur d'Écritures Comptables* : 287 usages par 74 personnes.\",\n    '- Si les sources ne suffisent pas pour un contenu, mets null pour ce contenu.',\n    'Contenus attendus :',\n    \"- article : une actualité utile du mois (demandes du Catalogue qui avancent ou sont livrées, chiffres d'usage, lives à venir).\",\n    \"- focus : une compétence du Catalogue terminée ou labellisée récemment, en quatre paragraphes séparés par une ligne vide, exactement dans ce format : *À quoi ça sert ?* suivi d'une à deux phrases ; puis *Pour qui ?* suivi d'une phrase ; puis *Comment ?* suivi d'une phrase ; puis une phrase de conclusion.\",\n    \"- cas : un collègue qui a partagé une astuce ou un gain de temps dans #kerogo-tools (de préférence le message le plus apprécié).\",\n    \"- quiz : exactement 5 questions sur les compétences et les bons réflexes IA, 3 réponses chacune, une seule bonne, une explication d'une phrase. Reprends une notion des questions les plus ratées si elles sont fournies.\",\n    'Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour ni balises, de cette forme :',\n    '{\"article\":{\"titre\":\"\",\"texte\":\"\"},\"focus\":{\"titre\":\"\",\"texte\":\"\"},\"cas\":{\"titre\":\"\",\"texte\":\"\"},\"quiz\":[{\"question\":\"\",\"a\":\"\",\"b\":\"\",\"c\":\"\",\"bonne\":\"A\",\"explication\":\"\"}]}'\n  ].join('\\n');\n  const reponse = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {\n    method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    headers: { 'x-api-key': cleClaude_(), 'anthropic-version': '2023-06-01' },\n    payload: JSON.stringify({ model: CONFIG.MODELE_CLAUDE, max_tokens: 4000, system: systeme,\n      messages: [{ role: 'user', content: 'Mois à préparer : ' + libelleMois_(mois) + ' ' + mois.slice(0, 4) + '\\n\\n' + sources }] })\n  });\n  const corps = JSON.parse(reponse.getContentText());\n  if (reponse.getResponseCode() !== 200) throw new Error('API Claude : ' + ((corps.error && corps.error.message) || reponse.getResponseCode()));\n  const texte = (corps.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');\n  const debut = texte.indexOf('{'), fin = texte.lastIndexOf('}');\n  if (debut === -1 || fin === -1) throw new Error(\"Réponse de l'IA illisible : réessayez.\");\n  return JSON.parse(texte.slice(debut, fin + 1));\n}\n\nfunction cleClaude_() { return PropertiesService.getScriptProperties().getProperty('ANTHROPIC_API_KEY') || ''; }\n\n/* Premier jour ouvré à partir du jour demandé, à l'heure de la routine */\nfunction jourOuvre_(annee, mois, jour) {\n  const d = new Date(annee, mois, jour, CONFIG.HEURE_ROUTINE, 0, 0);\n  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);\n  return d;\n}\n\nfunction chercherSchema_(obj) {\n  if (!obj || typeof obj !== 'object') return null;\n  if (Array.isArray(obj.schema) && obj.schema.length && obj.schema[0].name) return obj.schema;\n  for (const k in obj) {\n    const s = chercherSchema_(obj[k]);\n    if (s) return s;\n  }\n  return null;\n}\n\nfunction valeurChamp_(f, col) {\n  const choix = (col.options && (col.options.choices || col.options.options)) || [];\n  const libelle = function (v) {\n    const c = choix.filter(function (x) { return x.value === v || x.id === v; })[0];\n    return c ? (c.label || c.name || v) : v;\n  };\n  if (f.select && f.select.length) return f.select.map(libelle).join(', ');\n  if (f.user && f.user.length) return f.user.map(nomUtilisateur_).join(', ');\n  if (typeof f.text === 'string' && f.text) return f.text;\n  if (f.rich_text) { const t = texteRiche_(f.rich_text); if (t) return t; }\n  if (typeof f.value === 'string' || typeof f.value === 'number') return libelle(String(f.value));\n  return '';\n}\n\nfunction texteRiche_(n) {\n  if (!n) return '';\n  if (Array.isArray(n)) return n.map(texteRiche_).join('');\n  if (typeof n === 'object') {\n    if (n.type === 'text' && typeof n.text === 'string') return n.text;\n    return texteRiche_(n.elements);\n  }\n  return '';\n}\n\nconst NOMS_ = {};\nfunction nomUtilisateur_(id) {\n  if (!id) return '';\n  if (NOMS_[id]) return NOMS_[id];\n  const r = slack_('users.info', { user: id }, true);\n  NOMS_[id] = r.ok ? ((r.user.profile && (r.user.profile.first_name || r.user.profile.real_name)) || r.user.name) : 'un collègue';\n  return NOMS_[id];\n}\n\nfunction nettoyerSlack_(t) {\n  return String(t || '')\n    .replace(/<@([UW][A-Z0-9]+)>/g, function (_, id) { return '@' + nomUtilisateur_(id); })\n    .replace(/<(https?:[^|>]+)\\|([^>]+)>/g, '$2')\n    .replace(/<https?:[^>]+>/g, '')\n    .replace(/<#[A-Z0-9]+\\|([^>]+)>/g, '#$1')\n    .replace(/\\s+/g, ' ').trim();\n}\n\n/* ------------------------------------------------------------------ */\n/* Installation, tableur et tests                                      */\n/* ------------------------------------------------------------------ */\n\nfunction installer() {\n  const props = PropertiesService.getScriptProperties();\n  props.setProperty('ECRITURES_ACTIVES', 'oui');   // active les déclencheurs de cette version\n  if (!props.getProperty('SHEET_ID')) {\n    const ss = SpreadsheetApp.create(CONFIG.NOM + ' – Suivi');\n    props.setProperty('SHEET_ID', ss.getId());\n  }\n  optimiserTableur();\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (['routineQuotidienne', 'relancesQuotidiennes', 'publierCalendrier', 'prechaufferCaches', 'consoliderEcritures', 'envoyerInscriptionsWebinaire', 'archiverAttestations', 'rafraichirCatalogue'].indexOf(t.getHandlerFunction()) !== -1) ScriptApp.deleteTrigger(t);\n  });\n  ScriptApp.newTrigger('consoliderEcritures').timeBased().everyMinutes(5).create();\n  ScriptApp.newTrigger('envoyerInscriptionsWebinaire').timeBased().everyMinutes(1).create();\n  ScriptApp.newTrigger('archiverAttestations').timeBased().everyMinutes(15).create();\n  ScriptApp.newTrigger('rafraichirCatalogue').timeBased().everyMinutes(5).create();\n  ScriptApp.newTrigger('routineQuotidienne').timeBased().everyDays(1).atHour(CONFIG.HEURE_ROUTINE).create();\n  ScriptApp.newTrigger('prechaufferCaches').timeBased().everyHours(1).create();\n  prechaufferCaches();\n  console.log('Installé. Tableur de suivi : ' + classeur_().getUrl());\n}\n\n/* Mise en forme du tableur : relançable sans risque à tout moment */\nfunction optimiserTableur() {\n  const ss = classeur_();\n  const BLEU = '#2A286B', CLAIR = '#F3F3F8';\n  const largeurs = {\n    Calendrier: [120, 150, 300, 420, 260, 150, 100],\n    Joueurs: [260, 120, 130, 70, 140, 140, 150, 110, 80, 200, 180, 110, 130, 260, 260],\n    Progression: [260, 80, 100, 110, 70, 90, 140],\n    Journal: [150, 260, 120, 130, 320, 60],\n    Relances: [150, 260, 110],\n    Quiz: [90, 380, 220, 220, 220, 120, 380, 100],\n    Notes: [120, 520, 140]\n  };\n\n  Object.keys(ONGLETS).forEach(function (nom, i) {\n    let sh = ss.getSheetByName(nom) || ss.insertSheet(nom);\n    const n = ONGLETS[nom].length;\n    sh.getRange(1, 1, 1, n).setValues([ONGLETS[nom]])\n      .setFontWeight('bold').setFontColor('#FFFFFF').setBackground(BLEU).setVerticalAlignment('middle');\n    sh.setFrozenRows(1);\n    sh.setRowHeight(1, 32);\n    largeurs[nom].forEach(function (w, k) { sh.setColumnWidth(k + 1, w); });\n    if (!sh.getFilter()) sh.getRange(1, 1, Math.max(2, sh.getMaxRows()), n).createFilter();\n    ss.setActiveSheet(sh);\n    ss.moveActiveSheet(i + 2);\n  });\n\n  const cal = ss.getSheetByName('Calendrier');\n  cal.getRange('A2:A').setNumberFormat('dd/mm/yyyy');\n  cal.getRange('F2:F').setNumberFormat('dd/mm/yyyy hh:mm');\n  cal.getRange('D2:D').setWrap(true);\n  cal.getRange('B2:B').setDataValidation(SpreadsheetApp.newDataValidation()\n    .requireValueInList(CONFIG.TYPES_CONTENU, true).setAllowInvalid(false).build());\n  cal.getRange('A2:A').setDataValidation(SpreadsheetApp.newDataValidation().requireDate().setAllowInvalid(false).build());\n  cal.setConditionalFormatRules([\n    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=$G2=\"Brouillon\"')\n      .setBackground('#EDE9FB').setRanges([cal.getRange('A2:G')]).build(),\n    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=$F2<>\"\"')\n      .setFontColor('#9594B5').setRanges([cal.getRange('A2:G')]).build(),\n    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=AND($A2<>\"\",$F2=\"\",$A2<TODAY())')\n      .setBackground('#FDF3D0').setRanges([cal.getRange('A2:G')]).build()\n  ]);\n  cal.getRange('A1').setNote('Date de publication (à 9 h). Violet : brouillon à valider dans l\\'espace admin. Gris : déjà publié. Jaune : aurait dû partir, vérifiez le titre et le type.');\n  ss.getSheetByName('Notes').getRange('A2:A').setNumberFormat('dd/mm/yyyy');\n  ss.getSheetByName('Notes').getRange('B2:B').setWrap(true);\n\n  const joueurs = ss.getSheetByName('Joueurs');\n  joueurs.getRange('E2:G').setNumberFormat('dd/mm/yyyy');\n  majValidationSites_();\n  joueurs.setConditionalFormatRules([\n    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=AND($A2<>\"\",$G2=\"\")')\n      .setBackground('#FDE6E3').setRanges([joueurs.getRange('G2:G')]).build()\n  ]);\n  ss.getSheetByName('Progression').getRange('G2:G').setNumberFormat('dd/mm/yyyy');\n  const quiz = ss.getSheetByName('Quiz');\n  quiz.getRange('A2:A').setNumberFormat('@');\n  quiz.getRange('B2:G').setWrap(true);\n  quiz.getRange('F2:F').setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(LETTRES, true).setAllowInvalid(false).build());\n  quiz.getRange('A1').setNote('Mois au format AAAA-MM, par exemple 2026-12. Le plus simple : ajoutez les questions depuis l\\'espace admin.');\n  ss.getSheetByName('Journal').getRange('A2:A').setNumberFormat('dd/mm/yyyy hh:mm');\n  ss.getSheetByName('Relances').getRange('A2:A').setNumberFormat('dd/mm/yyyy hh:mm');\n\n  ['Progression', 'Journal', 'Relances'].forEach(function (nom) {\n    const sh = ss.getSheetByName(nom);\n    if (!sh.getProtections(SpreadsheetApp.ProtectionType.SHEET).length) {\n      sh.protect().setDescription(\"Rempli par l'Académie : modifier à la main peut fausser les scores\").setWarningOnly(true);\n    }\n  });\n\n  // Tableau de bord (formules recalculées en direct)\n  let tdb = ss.getSheetByName('Tableau de bord');\n  if (!tdb) tdb = ss.insertSheet('Tableau de bord', 0);\n  tdb.clear();\n  tdb.getRange('A1').setValue('Tableau de bord').setFontSize(16).setFontWeight('bold').setFontColor(BLEU);\n  // Le séparateur d'arguments dépend de la langue du tableur (« , » ou « ; ») : on le teste\n  const sep = separateurFormules_(tdb);\n  const f = function (formule) { return formule.replace(/§/g, sep); };\n  const chiffres = [\n    ['Joueurs inscrits', '=COUNTA(Joueurs!A2:A)'],\n    ['Charte validée', '=COUNTA(Joueurs!G2:G)'],\n    ['Taux de validation de la charte', f('=IFERROR(B4/B3§0)')],\n    ['Missions réussies', f('=COUNTIF(Progression!C2:C§\"Réussie\")')],\n    ['Actifs ces 7 derniers jours', f('=COUNTIF(Joueurs!F2:F§\">=\"&(TODAY()-7))')],\n    ['XP gagnés au total', '=SUM(Joueurs!D2:D)']\n  ];\n  chiffres.forEach(function (c, i) {\n    tdb.getRange(3 + i, 1).setValue(c[0]);\n    tdb.getRange(3 + i, 2).setFormula(c[1]);\n  });\n  tdb.getRange('B5').setNumberFormat('0%');\n  tdb.getRange('A3:A8').setFontWeight('bold');\n  tdb.getRange('A3:B8').setBackground(CLAIR);\n  tdb.getRange('D1').setValue('Par site').setFontSize(13).setFontWeight('bold').setFontColor(BLEU);\n  tdb.getRange('D3').setFormula(f('=IFERROR(QUERY(Joueurs!A2:I§\"select C, count(A), count(G), sum(D) where A is not null group by C order by count(A) desc label C \\'Site\\', count(A) \\'Joueurs\\', count(G) \\'Charte validée\\', sum(D) \\'XP\\'\"§0)§\"Pas encore de joueurs\")'));\n  tdb.getRange('D3:G3').setFontWeight('bold').setFontColor('#FFFFFF').setBackground(BLEU);\n  tdb.setColumnWidth(1, 260); tdb.setColumnWidth(2, 110); tdb.setColumnWidth(3, 30);\n  [4, 5, 6, 7].forEach(function (c) { tdb.setColumnWidth(c, 140); });\n  tdb.setTabColor('#F6C832');\n  ss.setActiveSheet(tdb);\n  ss.moveActiveSheet(1);\n\n  ['Feuille 1', 'Sheet1'].forEach(function (n) {\n    const s = ss.getSheetByName(n);\n    if (s && ss.getSheets().length > 1) ss.deleteSheet(s);\n  });\n}\n\nfunction separateurFormules_(feuille) {\n  const cellule = feuille.getRange('Z1');\n  cellule.setFormula('=IF(TRUE,1,0)');\n  SpreadsheetApp.flush();\n  const virgule = cellule.getDisplayValue() === '1';\n  cellule.clearContent();\n  return virgule ? ',' : ';';\n}\n\nfunction testerSlack() {\n  const r = slack_('users.lookupByEmail', { email: CONFIG.EMAIL_TEST }, true);\n  if (!r.ok) { console.log('Échec : ' + r.error); return; }\n  const ok = envoyerMP_({ 'Slack ID': r.user.id, Email: CONFIG.EMAIL_TEST },\n    'Test de ' + CONFIG.NOM_ARTICLE + ' : le bot fonctionne ✅', \"Ouvrir l'Académie\");\n  console.log(ok ? 'Message de test envoyé.' : \"Échec de l'envoi.\");\n}\n\n/* ------------------------------------------------------------------ */\n/* Outils internes                                                     */\n/* ------------------------------------------------------------------ */\n\nfunction emailCourant_() {\n  if (EMAIL_API_) return EMAIL_API_;\n  const email = (Session.getActiveUser().getEmail() || '').toLowerCase();\n  if (!email) throw new Error(\"Impossible de vous identifier : ouvrez l'Académie avec votre compte Google Kerogo.\");\n  return email;\n}\n\nlet EN_LOT_ = false;\nconst LISTES_ = {};\nfunction lireListe_(cle, defaut) {\n  if (EN_LOT_) {\n    if (!(cle in LISTES_)) { const v = PropertiesService.getScriptProperties().getProperty(cle); LISTES_[cle] = v ? JSON.parse(v) : defaut; }\n    return LISTES_[cle];\n  }\n  const p = PropertiesService.getScriptProperties().getProperty(cle);\n  return p ? JSON.parse(p) : defaut;\n}\nfunction admins_() { return lireListe_('ADMINS', CONFIG.ADMINS).map(function (a) { return String(a).toLowerCase(); }); }\nfunction managers_() { return lireListe_('MANAGERS', {}); }            // { email: [sites] } ; [] = tous les sites\nfunction domaines_() { return lireListe_('DOMAINES', CONFIG.DOMAINES).map(function (d) { return String(d).toLowerCase(); }); }\nfunction estAdmin_(email) { return admins_().indexOf(String(email).toLowerCase()) !== -1; }\n\n\nfunction verifierAdmin_() {\n  if (!estAdmin_(emailCourant_())) throw new Error(\"Cet espace est réservé à l'équipe Dev Ops.\");\n}\n\n/* Liste des sites, toujours dans l'ordre alphabétique (Île Maurice avec les I, Sélestat avec les S) */\nfunction sites_() {\n  const p = PropertiesService.getScriptProperties().getProperty('SITES');\n  const liste = p ? JSON.parse(p) : CONFIG.SITES.slice();\n  const cle = function (s) { return String(s).normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase(); };\n  return liste.sort(function (a, b) { return cle(a) < cle(b) ? -1 : (cle(a) > cle(b) ? 1 : 0); });\n}\n\nfunction enregistrerSites_(liste) {\n  PropertiesService.getScriptProperties().setProperty('SITES', JSON.stringify(liste));\n  majValidationSites_();\n}\n\nfunction majValidationSites_() {\n  feuille_('Joueurs').getRange('C2:C').setDataValidation(SpreadsheetApp.newDataValidation()\n    .requireValueInList(sites_(), true).setAllowInvalid(true).build());\n}\n\nfunction modeTest_() {\n  const p = PropertiesService.getScriptProperties().getProperty('MODE_TEST');\n  return p === null ? CONFIG.MODE_TEST : p === 'true';\n}\n\nfunction canalAnnonces_() {\n  if (!modeTest_()) return CONFIG.CANAL_ANNONCES;\n  const test = slack_('users.lookupByEmail', { email: CONFIG.EMAIL_TEST }, true);\n  return test.ok ? test.user.id : null;\n}\n\nlet CLASSEUR_ = null;\nfunction classeur_() {\n  if (CLASSEUR_) return CLASSEUR_;\n  const id = PropertiesService.getScriptProperties().getProperty(MODE_CHARGE_ ? 'TABLEUR_CHARGE' : 'SHEET_ID');\n  if (!id) throw new Error(\"L'Académie n'est pas encore installée : lancez installer().\");\n  CLASSEUR_ = SpreadsheetApp.openById(id);\n  return CLASSEUR_;\n}\n\nfunction moisCourant_() { return Utilities.formatDate(new Date(), 'Europe/Paris', 'yyyy-MM'); }\n\nfunction moisDecale_(k) {\n  const d = new Date();\n  d.setDate(1);\n  d.setMonth(d.getMonth() + k);\n  return Utilities.formatDate(d, 'Europe/Paris', 'yyyy-MM');\n}\n\nfunction moisDe_(v) {\n  if (v instanceof Date) return Utilities.formatDate(v, 'Europe/Paris', 'yyyy-MM');\n  return String(v || '').trim();\n}\n\nfunction libelleMois_(mois) {\n  const noms = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];\n  const m = Number(String(mois).split('-')[1]);\n  return noms[m - 1] || mois;\n}\n\nconst FEUILLES_ = {};\nfunction feuille_(nom) {\n  if (FEUILLES_[nom]) return FEUILLES_[nom];\n  const ss = classeur_();\n  let sh = ss.getSheetByName(nom);\n  if (!sh && ONGLETS[nom]) {\n    sh = ss.insertSheet(nom);\n    sh.getRange(1, 1, 1, ONGLETS[nom].length).setValues([ONGLETS[nom]]).setFontWeight('bold').setFontColor('#FFFFFF').setBackground('#2A286B');\n    sh.setFrozenRows(1);\n  }\n  if (sh && COLONNES_RETIREES_[nom]) retirerColonnes_(sh, nom);\n  if (sh && ONGLETS[nom] && nom === 'Joueurs') {\n    // Colonnes ajoutées en fin d'onglet par une nouvelle version : l'en-tête est créé s'il manque\n    const n = sh.getLastColumn(), attendu = ONGLETS[nom].length;\n    if (n < attendu) {\n      if (sh.getMaxColumns() < attendu) sh.insertColumnsAfter(sh.getMaxColumns(), attendu - sh.getMaxColumns());\n      sh.getRange(1, n + 1, 1, attendu - n).setValues([ONGLETS[nom].slice(n)]).setFontWeight('bold').setFontColor('#FFFFFF').setBackground('#2A286B');\n    }\n  }\n  return (FEUILLES_[nom] = sh);\n}\n\n/* Colonnes retirées (5 novembre 2026 : la durée de lecture de la charte n'est plus gardée nulle part).\n   Les colonnes sont repérées par leur position (ONGLETS) : la colonne est supprimée du tableur à la première\n   ouverture de l'onglet par cette version, sous verrou, avant toute lecture ou écriture. */\nconst COLONNES_RETIREES_ = { Joueurs: ['Charte durée (min)'], Documents: ['Durée (min)'] };\nfunction retirerColonnes_(sh, nom) {\n  const entete = function () { const n = sh.getLastColumn(); return n ? sh.getRange(1, 1, 1, n).getValues()[0].map(String) : []; };\n  if (!COLONNES_RETIREES_[nom].some(function (c) { return entete().indexOf(c) !== -1; })) return;\n  const verrou = LockService.getScriptLock(), deja = verrou.hasLock();\n  if (!deja && !verrou.tryLock(30000)) throw new Error(SERVEUR_OCCUPE);\n  try {\n    COLONNES_RETIREES_[nom].forEach(function (c) {\n      const k = entete().indexOf(c);   // relue sous verrou : jamais deux suppressions\n      if (k !== -1) { sh.deleteColumn(k + 1); console.log('Colonne « ' + c + ' » retirée de l’onglet ' + nom + '.'); }\n    });\n    SpreadsheetApp.flush();\n  } finally { if (!deja) verrou.releaseLock(); }\n}\n\n/* Lecture d'un onglet, mémorisée le temps de l'exécution. max : seulement les dernières lignes */\nconst MEMO_ = {};\nfunction lignes_(nom, max) {\n  const cle = nom + '|' + (max || 0);\n  if (MEMO_[cle]) return MEMO_[cle];\n  const sh = feuille_(nom);\n  const entetes = ONGLETS[nom];\n  const derniere = sh.getLastRow();\n  if (derniere < 2) { MEMO_[cle] = []; return MEMO_[cle]; }\n  const debut = max ? Math.max(2, derniere - max + 1) : 2;\n  const valeurs = sh.getRange(debut, 1, derniere - debut + 1, entetes.length).getValues();\n  if (!('__chargeFs' in MEMO_)) MEMO_.__chargeFs = chargeFs_();   // test de charge Firestore (copie seulement) : les adresses de test sont gardées\n  const filtrer = !MODE_CHARGE_ && !MEMO_.__chargeFs && entetes.indexOf('Email') !== -1;\n  MEMO_[cle] = valeurs.map(function (ligne, i) {\n    const o = { _ligne: debut + i };\n    entetes.forEach(function (h, k) { o[h] = ligne[k]; });\n    return o;\n  }).filter(function (o) { return o[entetes[0]] !== '' && !(filtrer && estTest_(o.Email)); });\n  return MEMO_[cle];\n}\n\nfunction invalider_(nom) {\n  Object.keys(MEMO_).forEach(function (k) { if (k.indexOf(nom + '|') === 0) delete MEMO_[k]; });\n  if (nom === 'Joueurs') delete MEMO_.__cabinets;\n}\n\nfunction ajouter_(nom, valeurs) { feuille_(nom).appendRow(valeurs); invalider_(nom); }\n\nfunction maj_(nom, ligne, colonne, valeur) {\n  const k = ONGLETS[nom].indexOf(colonne);\n  if (k === -1) throw new Error('Colonne inconnue : ' + colonne);\n  feuille_(nom).getRange(ligne, k + 1).setValue(valeur);\n  invalider_(nom);\n}\n\nfunction avecVerrou_(fn) {\n  const verrou = LockService.getScriptLock();\n  verrou.waitLock(15000);\n  try { fn(); } finally { verrou.releaseLock(); }\n}\n\n/* ------------------------------------------------------------------ */\n/* Écritures des collaborateurs et consolidation                       */\n/* Une action (mission, quiz, site, thème, avis, visite, inscription)  */\n/* ajoute une ligne à « Écritures », sans verrou ; l'état de la        */\n/* personne est mis à jour tout de suite dans le cache.                */\n/* consoliderEcritures (toutes les 5 minutes) reporte ces lignes dans  */\n/* Joueurs, Progression, Journal et Retours, par lots, sous verrou.    */\n/* ------------------------------------------------------------------ */\nconst LIMITE_LOT_MS = 4 * 60 * 1000;\n\n/* Ajouts au journal sous verrou court : plusieurs ajouts simultanés sur un même onglet peuvent s'écraser.\n   La ligne est réellement écrite (flush) avant de répondre ; sans verrou à temps, la page garde l'écriture et réessaie. */\nconst ATTENTE_VERROU_MS = 3000;\nconst SERVEUR_OCCUPE = 'Serveur occupé : à réessayer.';\nfunction ajouterSousVerrou_(lignes) {\n  const verrou = LockService.getScriptLock();\n  if (!verrou.tryLock(ATTENTE_VERROU_MS)) throw new Error(SERVEUR_OCCUPE);\n  try {\n    lignes.forEach(function (l) { feuille_(l[0]).appendRow(l[1]); });\n    SpreadsheetApp.flush();\n  } finally {\n    verrou.releaseLock();\n  }\n  lignes.forEach(function (l) { invalider_(l[0]); });\n}\nfunction ligneEcriture_(email, type, donnees) { return ['Écritures', [new Date(), email, type, JSON.stringify(donnees || {}), '']]; }\nfunction ecrire_(email, type, donnees) { ajouterSousVerrou_([ligneEcriture_(email, type, donnees)]); }\n\nfunction joueurNeuf_(email) {\n  return { Email: email, 'Prénom': prenomDepuisEmail_(email), Site: '', Cabinet: '', XP: 0, 'Thème': 'sombre', 'Charte validée le': '', 'Résumé': '{}' };\n}\n\n/* Résumé d'un collaborateur : { mission: [réussie 0/1, meilleur score, total, réussie le] }, quiz compris (Q-AAAA-MM) */\nfunction resumeDe_(j) {\n  const brut = String(j['Résumé'] || '');\n  if (brut) { try { return JSON.parse(brut); } catch (e) { } }\n  // Ligne pas encore consolidée (avant la première consolidation) : lecture de Progression\n  const r = {}, email = String(j.Email || '').toLowerCase();\n  lignes_('Progression').forEach(function (p) {\n    if (String(p.Email).toLowerCase() === email) r[String(p.Mission)] = [p.Statut === 'Réussie' ? 1 : 0, Number(p['Meilleur score']) || 0, Number(p.Total) || 0, dateIso_(p['Réussie le'])];\n  });\n  return r;\n}\n\nfunction persoDepuisJoueur_(email, j) {\n  const resume = resumeDe_(j);\n  const niveaux = NIVEAUX.map(function (n) {\n    const missions = n.missions.map(function (id) {\n      const m = MISSIONS[id], x = resume[id];\n      return { id: id, titre: m.titre, minutes: m.minutes, seuil: m.seuil || 0, dispo: dispo_(id), ouvreLe: ouvreLe_(id), objectif: m.o
